        <div class="d-head">
          <a class="icon-btn" href="#/pedidos" aria-label="Voltar para os pedidos">${I.back}</a>

          <a class="icon-btn" href="#/editar/${esc(o.id)}" aria-label="Editar pedido">${I.edit}</a>

        <section class="box">

          <div class="stepper" role="group" aria-label="Situação do pedido">${U.FLOW.map((s, i) => `<button type="button" data-status="${s}" class="${s === st ? 'on' : i < idx ? 'done' : ''}" aria-pressed="${s === st}">${U.STATUS[s].label}</button>`).join('')}</div>
          <p class="d-meta">${deliveryLine(o)}</p>

  async function renderPreview() {
    const o = byId(S.currentId), wrap = $('#paper');
    if (!o || !wrap) return;
    const token = ++S.prevToken;
    const { pages } = DOC.layout(o, S.cfg);
    const imgs = await docImages(o);
    if (token !== S.prevToken || !document.body.contains(wrap)) return;
    const avail = Math.max(240, wrap.clientWidth - 24);
    const cssW = Math.round(S.zoom ? Math.min(avail * 2, 1500) : Math.min(avail, 820));
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const scale = cssW / DOC.PAGE.w;
    const frag = document.createDocumentFragment();
    pages.forEach((ops, i) => {
      const cv = document.createElement('canvas');
      cv.width = Math.round(cssW * dpr);
      cv.height = Math.round(DOC.PAGE.h * scale * dpr);
      cv.style.width = cssW + 'px';
      cv.style.height = Math.round(DOC.PAGE.h * scale) + 'px';
      cv.setAttribute('role', 'img');
      cv.setAttribute('aria-label', `Página ${i + 1} de ${pages.length} do pedido ${U.fmtNum(o.numero)}`);
      DOC.drawCanvas(cv.getContext('2d'), ops, scale * dpr, imgs);
      frag.appendChild(cv);
    });
    wrap.replaceChildren(frag);
  }

  async function detailClick(e, o) {
    const sb = e.target.closest('[data-status]');
    if (sb) return setStatus(o, sb.dataset.status);
    const b = e.target.closest('[data-act]');
    if (!b) return;
    switch (b.dataset.act) {
      case 'wa': return sendWhatsApp(o);
      case 'share-pdf': return sharePdf(o);
      case 'email': return emailModal(o);
      case 'dl-pdf': downloadFile(makePdf(o)); return logEnvio(o, 'PDF baixado');
      case 'png': return shareImages(o);
      case 'print': return printOrder(o);
      case 'copy-msg': return toast((await copyText(msgText(o))) ? 'Mensagem copiada' : 'Não foi possível copiar aqui');
      case 'copy-pix': return toast((await copyText(pixCodeFor(o))) ? 'Código PIX copiado' : 'Não foi possível copiar aqui');
      case 'pay': return payModal(o);
      case 'more': return moreMenu(o);
      case 'reopen': o.status = 'aberto'; await saveOrder(o); toast('Pedido reaberto'); return viewDetail(o.id);
      case 'zoom':
        S.zoom = !S.zoom;
        b.textContent = S.zoom ? 'Ajustar à tela' : 'Ampliar';
        b.setAttribute('aria-pressed', S.zoom);
        return renderPreview();
      default:
    }
  }

  async function printOrder(o) {
    const pa = $('#print-area');
    const { pages } = DOC.layout(o, S.cfg);
    const imgs = await docImages(o);
    pa.innerHTML = '';
    const waits = pages.map(ops => {
      const cv = document.createElement('canvas'), sc = 2.5;
      cv.width = Math.round(DOC.PAGE.w * sc);
      cv.height = Math.round(DOC.PAGE.h * sc);
      DOC.drawCanvas(cv.getContext('2d'), ops, sc, imgs);
      const im = new Image();
      im.alt = '';
      im.src = cv.toDataURL('image/png');
      pa.appendChild(im);
      return im.decode().catch(() => {});
    });
    await Promise.all(waits);
    try { window.print(); } catch (e) { toast('A impressão não abriu aqui. Baixe o PDF e imprima por ele.'); }
  }

  /* ---------- ajustes ---------- */
  function drawQrCanvas(cv, text) {
    let q;
    try { q = QR.encode(text, 'M'); } catch (e) { return false; }
    const n = q.size, quiet = 4, px = Math.max(2, Math.floor(280 / (n + quiet * 2)));
    cv.width = cv.height = (n + quiet * 2) * px;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#000';
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.modules[y][x]) ctx.fillRect((x + quiet) * px, (y + quiet) * px, px, px);
    return true;
  }

  const redesenharNuvemBox = () => { const b = $('#nuvem-conteudo'); if (b) b.innerHTML = nuvemBoxHtml(); };
  async function acaoNuvem(act, b) {
    const st = Sync.s && Sync.s.estado;
    if (act === 'fb-regras') return toast((await copyText(REGRAS)) ? 'Regras copiadas. Cole na aba Regras do Firestore.' : 'Não foi possível copiar aqui');
    if (act === 'fb-copiar-uid') return toast((await copyText(st.uid)) ? 'UID copiado' : 'Não foi possível copiar aqui');
    if (act === 'fb-link') {
      const link = location.href.split('#')[0] + '#/ajustes?fb=' + b64u(JSON.stringify({ apiKey: st.apiKey, projectId: st.projectId }));
      return toast((await copyText(link)) ? 'Link copiado. Abra no outro aparelho.' : 'Não foi possível copiar aqui');
    }
    if (act === 'fb-sair') {
      if (!(await confirmBox('Desligar o backup na nuvem?', 'Este aparelho para de enviar e de receber pedidos da nuvem. Os pedidos continuam aqui e no Firebase.', 'Desligar'))) return;
      await Sync.s.sair();
      Sync.pend.clear();
      Sync.tumulos = {};
      Sync.cfgPend = false;
      persistSync();
      setSync('off');
      return redesenharNuvemBox();
    }
    b.disabled = true;
    try {
      if (act === 'fb-verificar') {
        if (await Sync.s.verificarMembro()) { await conectarNuvem(); toast('Usuário liberado. Backup ligado.'); }
        else toast(st.motivo === 'sem-regras' ? 'O Firebase ainda recusa o acesso. Confira as regras.' : 'Ainda não liberado. Confira o ID do documento em membros.', 'err');
      } else if (act === 'fb-enviar') {
        S.orders.forEach(o => Sync.pend.add(o.id));
        Sync.cfgPend = true;
        persistSync();
        const ok = await sincronizar();
        toast(ok && !Sync.problema ? `${S.orders.length} ${S.orders.length === 1 ? 'pedido enviado' : 'pedidos enviados'} para a nuvem` : statusNuvemTexto().replace(/<[^>]+>/g, ''), ok && !Sync.problema ? '' : 'err');
      } else if (act === 'fb-trazer') {
        const docs = await Sync.s.todos();
        const n = await aplicarRemotos(docs, false);
        toast(n ? `${n} ${n === 1 ? 'pedido atualizado' : 'pedidos atualizados'} com a nuvem` : 'Este aparelho já está igual à nuvem');
      }
    } catch (e) {
      tratarErroNuvem(e);
      toast(e.message || 'Não deu certo agora.', 'err');

      redesenharNuvemBox();
    }

  async function entrarNuvem(form) {
    const cfg = NUVEM.lerConfig(form.fbcfg.value);
    const problema = NUVEM.conferirConfig(cfg);
    if (problema) return showErr(form.fbcfg, problema);
    const email = form.fbemail.value.trim();
    if (!email) return showErr(form.fbemail, 'Digite o e-mail do usuário criado no Firebase.');
    if (!form.fbsenha.value) return showErr(form.fbsenha, 'Digite a senha.');
    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true;
    btn.lastChild.textContent = 'Entrando…';
    try {
      await Sync.s.entrar({ apiKey: cfg.apiKey, projectId: cfg.projectId, email, senha: form.fbsenha.value });
      S.fbPrefill = '';
      if (Sync.s.liberado()) { await conectarNuvem(); toast('Backup na nuvem ligado'); }
      else setSync('bloqueado');
    } catch (e) {
      toast(e.message || 'Não foi possível entrar.', 'err');
    }
    redesenharNuvemBox();
  }

  function viewSettings() {
    setTitle('Ajustes');
    const c = S.cfg;
    const page = mount(`
    <div class="page-head"><h1>Ajustes</h1><p class="muted">Estes dados saem no topo de cada pedido e na mensagem para o cliente.</p></div>
    <form id="cfg" class="settings" novalidate autocomplete="off">
      <div class="grid2">
        <fieldset class="box">
          <legend>Empresa</legend>
          <div class="logo-row">
            <div class="logo-prev" id="logo-prev">${logoPreview()}</div>
            <div>
              <label class="btn sm file-btn">Escolher logo<input type="file" id="logo-file" accept="image/*"></label>
              ${c.logo ? '<button type="button" class="btn sm ghost" data-act="rm-logo">Remover logo</button>' : ''}
              <p class="hint">Sem logo, o pedido mostra as iniciais.</p>
            </div>
          </div>
          <label class="fld"><span>Nome</span><input name="nome" value="${esc(c.nome)}"></label>
          <label class="fld"><span>Atividade (aparece abaixo do nome)</span><input name="atividade" value="${esc(c.atividade)}"></label>
          <label class="fld"><span>Endereço</span><input name="endereco1" value="${esc(c.endereco1)}"></label>
          <label class="fld"><span>Bairro, cidade e estado</span><input name="endereco2" value="${esc(c.endereco2)}"></label>
          <div class="row2">
            <label class="fld"><span>Telefone</span><input name="telefone" type="tel" inputmode="tel" value="${esc(U.fmtPhone(c.telefone))}"></label>
            <label class="fld"><span>E-mail</span><input name="email" type="email" inputmode="email" autocapitalize="off" value="${esc(c.email)}"></label>
          </div>
          <label class="check"><input type="checkbox" name="whatsapp"${c.whatsapp ? ' checked' : ''}> Esse telefone é WhatsApp</label>
        </fieldset>
        <fieldset class="box">
          <legend>PIX</legend>
          <div class="row2">
            <label class="fld"><span>Tipo da chave</span><select name="pixTipo">${Object.entries(U.PIX_TIPOS).map(([k, v]) => `<option value="${k}"${k === c.pixTipo ? ' selected' : ''}>${v}</option>`).join('')}</select></label>
            <label class="fld"><span>Chave PIX</span><input name="pixChave" value="${esc(c.pixChave)}" autocapitalize="off"></label>
          </div>
          <p class="hint" id="pix-hint" aria-live="polite"></p>
          <div class="row2">
            <label class="fld"><span>Nome de quem recebe (opcional)</span><input name="pixNome" value="${esc(c.pixNome)}" placeholder="${esc(c.nome)}"></label>
            <label class="fld"><span>Cidade</span><input name="pixCidade" value="${esc(c.pixCidade)}"></label>
          </div>
          <label class="check"><input type="checkbox" name="qrPadrao"${c.qrPadrao ? ' checked' : ''}> QR Code PIX nos pedidos novos</label>
          <label class="check"><input type="checkbox" name="incluirCopiaCola"${c.incluirCopiaCola ? ' checked' : ''}> PIX copia e cola na mensagem do WhatsApp</label>
          <div class="pix-test" id="pix-test" hidden><canvas aria-label="QR Code de teste de R$ 0,01"></canvas><p><b>Teste antes de usar.</b> Leia este QR de R$&nbsp;0,01 no app do seu banco e confira se aparece o nome certo de quem recebe. Não precisa concluir o pagamento.</p></div>
        </fieldset>
      </div>
      <fieldset class="box">
        <legend>Pedidos e mensagens</legend>
        <div class="row2">
          <label class="fld"><span>Próximo número de pedido</span><input name="proximoNumero" inputmode="numeric" value="${nextNumber()}"></label>
          <label class="fld"><span>DDD padrão dos clientes</span><input name="ddd" inputmode="numeric" maxlength="2" value="${esc(c.ddd)}"></label>
        </div>
        <p class="hint">Para continuar a numeração do talão de papel, coloque aqui o próximo número dele.</p>
        <label class="fld"><span>Final da mensagem</span><textarea name="mensagemFinal" rows="2">${esc(c.mensagemFinal)}</textarea></label>
      </fieldset>
      <div class="savebar settings-bar"><p class="muted">${c.conferido ? '' : 'Os dados vieram da foto do talão. Confira antes de salvar.'}</p><button type="submit" class="btn primary">Salvar ajustes</button></div>
    </form>
    <section class="box" id="nuvem-box">
      <h2>Backup na nuvem (Firebase)</h2>
      <div id="nuvem-conteudo">${nuvemBoxHtml()}</div>
    </section>
    <section class="box">
      <h2>Seus dados</h2>
      <p>${storageText()}</p>
      <div class="btn-row">
        <button type="button" class="btn" data-act="backup">${I.download}Fazer backup</button>
        <label class="btn file-btn">Restaurar backup<input type="file" id="import-file" accept=".json,application/json"></label>
        <button type="button" class="btn" data-act="csv">Exportar planilha</button>
      </div>
      <p class="hint">${c.ultimoBackup ? 'Último backup: ' + U.fmtDateTime(c.ultimoBackup) + '.' : 'Nenhum backup feito ainda.'} A planilha (.csv) abre no Excel e no Google Planilhas.</p>
    </section>
    <section class="box">
      <h2>Instalar no celular ou no computador</h2>
      ${installHtml()}
    </section>
    <section class="box danger-zone">
      <h2>Apagar pedidos</h2>
      <p>Remove todos os pedidos deste aparelho. Os ajustes continuam. Faça um backup antes.</p>
      <button type="button" class="btn danger" data-act="wipe">Apagar todos os pedidos</button>
    </section>`);

    const f = $('#cfg', page);
    const pixUpdate = () => {
      const tipo = $('[name=pixTipo]', f).value, chave = $('[name=pixChave]', f).value;
      const warn = PIX.checkKey(tipo, chave), g = PIX.guessTipo(chave);
      const hint = $('#pix-hint', f);
      if (warn) { hint.textContent = warn; hint.className = 'hint bad'; }
      else if (g && g !== tipo) { hint.textContent = `Confira o tipo: essa chave parece ser ${U.PIX_TIPOS[g].toLowerCase()}.`; hint.className = 'hint warnt'; }
      else { hint.textContent = 'Chave no formato certo.'; hint.className = 'hint okt'; }
      const code = PIX.payload({ tipo, chave, nome: $('[name=pixNome]', f).value || $('[name=nome]', f).value, cidade: $('[name=pixCidade]', f).value, valorCentavos: 1, descricao: 'Teste' });
      const box = $('#pix-test', f);
      box.hidden = !code;
      if (code) drawQrCanvas($('canvas', box), code);
    };
    pixUpdate();
    f.addEventListener('input', e => { if (['pixTipo', 'pixChave', 'pixNome', 'pixCidade', 'nome'].includes(e.target.name)) pixUpdate(); });
    f.addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(f);
      for (const k of ['nome', 'atividade', 'endereco1', 'endereco2', 'telefone', 'email', 'pixTipo', 'pixChave', 'pixNome', 'pixCidade', 'mensagemFinal']) c[k] = String(fd.get(k) ?? '').trim();
      c.whatsapp = !!fd.get('whatsapp');
      c.qrPadrao = !!fd.get('qrPadrao');
      c.incluirCopiaCola = !!fd.get('incluirCopiaCola');
      c.ddd = U.digits(fd.get('ddd')).slice(0, 2);
      let pn = parseInt(U.digits(fd.get('proximoNumero')), 10) || 1;
      const min = 1 + S.orders.reduce((m, o) => Math.max(m, Number(o.numero) || 0), 0);
      let msg = 'Ajustes salvos';
      if (pn < min) { pn = min; msg = `Ajustes salvos. O próximo número ficou ${U.fmtNum(min)}, porque já existe o pedido ${U.fmtNum(min - 1)}.`; }
      c.proximoNumero = pn;
      c.conferido = true;
      marcarAjustes();
      await saveCfg();
      updateBrand();
      toast(msg);
      viewSettings();
    });
    $('#logo-file', page).addEventListener('change', async e => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      try {
        c.logo = await processLogo(file);
        marcarAjustes();
        await saveCfg();
        updateBrand();
        toast('Logo atualizado');
        viewSettings();
      } catch (err) { toast('Não foi possível usar essa imagem. Tente um arquivo PNG ou JPG.', 'err'); }
    });
    $('#import-file', page).addEventListener('change', e => { const file = e.target.files && e.target.files[0]; if (file) importBackup(file); e.target.value = ''; });
    page.addEventListener('submit', e => { if (e.target.id === 'fb-form') { e.preventDefault(); entrarNuvem(e.target); } });
    page.addEventListener('click', async e => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const act = b.dataset.act;
      if (act.startsWith('fb-')) return acaoNuvem(act, b);
      if (act === 'rm-logo') { c.logo = null; marcarAjustes(); await saveCfg(); updateBrand(); viewSettings(); }
      else if (act === 'backup') exportBackup();
      else if (act === 'csv') exportCSV();
      else if (act === 'install' && S.installEvt) { S.installEvt.prompt(); S.installEvt = null; }
      else if (act === 'wipe') {
        if (!S.orders.length) return toast('Não há pedidos para apagar.');
        if (!(await confirmBox(`Apagar ${S.orders.length} ${S.orders.length === 1 ? 'pedido' : 'pedidos'}?`, 'Todos os pedidos somem deste aparelho e não dá para desfazer. Faça um backup antes, se ainda não fez.', 'Apagar tudo', true))) return;
        await Store.clearOrders();
        S.orders = [];
        toast('Pedidos apagados');
        viewSettings();
      }
    });
  }
  async function processLogo(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = new Image();
      img.src = url;
      await img.decode();
      let w = img.naturalWidth || 300, h = img.naturalHeight || 300;
      const k = Math.min(1, 480 / Math.max(w, h));
      w = Math.max(1, Math.round(w * k));
      h = Math.max(1, Math.round(h * k));
      const cv = document.createElement('canvas');
      cv.width = w;
      cv.height = h;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      return { src: cv.toDataURL('image/jpeg', 0.9), w, h };
    } finally { URL.revokeObjectURL(url); }
  }

  /* ---------- backup, planilha ---------- */
  async function exportBackup() {
    const data = { app: 'talao-digital', versao: 1, exportadoEm: new Date().toISOString(), cfg: S.cfg, pedidos: S.orders };
    const file = new File([JSON.stringify(data)], `backup-pedidos-${U.isoLocal()}.json`, { type: 'application/json' });
    if (coarse() && canShare([file])) {
      try { await navigator.share({ files: [file], title: file.name }); } catch (err) { if (err && err.name === 'AbortError') return; downloadFile(file); }
    } else downloadFile(file);
    S.cfg.ultimoBackup = Date.now();
    await saveCfg().catch(() => {});
    toast('Backup gerado. Guarde o arquivo fora do aparelho (Drive, e-mail).');
    if (S.route === 'ajustes') viewSettings(); else if (S.route === 'pedidos') viewList();
  }
  function sanitizeOrder(x) {
    if (!x || typeof x !== 'object' || !x.id) return null;
    const o = Object.assign(newOrder(), x);
    o.id = String(x.id);
    o.numero = Number(x.numero) || 0;
    o.status = U.STATUS[o.status] ? o.status : 'aberto';
    o.cliente = Object.assign({ nome: '', telefone: '', email: '', endereco: '' }, x.cliente || {});
    o.itens = (Array.isArray(x.itens) ? x.itens : []).map(it => ({ qtd: Number(it && it.qtd) || 0, desc: String((it && it.desc) || ''), unit: Number(it && it.unit) || 0 }));
    ['desconto', 'pago', 'pixValor'].forEach(k => { o[k] = Math.max(0, Number(x[k]) || 0); });
    return o.numero ? o : null;
  }
  async function importBackup(file) {
    let data;
    try { data = JSON.parse(await file.text()); } catch (e) { return toast('Esse arquivo não é um backup válido.', 'err'); }
    if (!data || data.app !== 'talao-digital' || !Array.isArray(data.pedidos)) return toast('Esse arquivo não é um backup deste app.', 'err');
    const incoming = data.pedidos.map(sanitizeOrder).filter(Boolean);
    const when = data.exportadoEm ? U.fmtDateTime(Date.parse(data.exportadoEm)) : 'data desconhecida';
    const mode = await modal({
      title: 'Restaurar backup',
      body: `<p>Backup de ${when}, com <b>${incoming.length} ${incoming.length === 1 ? 'pedido' : 'pedidos'}</b>. Neste aparelho há ${S.orders.length}.</p>
        <div class="choice-list">
          <button type="button" class="choice" data-choice="merge"><b>Juntar com os pedidos deste aparelho</b><small>Mantém o que já está aqui. Quando o mesmo pedido existe nos dois, fica a versão mais recente.</small></button>
          <button type="button" class="choice danger" data-choice="replace"><b>Trocar tudo pelo backup</b><small>Apaga os pedidos e ajustes deste aparelho e usa os do arquivo.</small></button>
        </div>`,
      onOpen: (w, close) => w.addEventListener('click', e => { const b = e.target.closest('[data-choice]'); if (b) close(b.dataset.choice); }),
    });
    if (!mode) return;
    if (mode === 'replace') {
      await Store.clearOrders();
      S.orders = [];
      if (data.cfg && typeof data.cfg === 'object') S.cfg = Object.assign(clone(DEFAULT_CFG), data.cfg);
    }
    let n = 0;
    for (const o of incoming) {
      const cur = byId(o.id);
      if (cur && (cur.updatedAt || 0) >= (o.updatedAt || 0)) continue;
      await Store.putOrder(o);
      if (cur) S.orders[S.orders.indexOf(cur)] = o; else S.orders.push(o);
      if (nuvemLigada()) Sync.pend.add(o.id);
      n++;
    }
    if (n && nuvemLigada()) { persistSync(); agendarSync(); }
    S.cfg.proximoNumero = nextNumber();
    await saveCfg();
    updateBrand();
    toast(`${n} ${n === 1 ? 'pedido restaurado' : 'pedidos restaurados'}`);
    viewSettings();
  }
  function exportCSV() {
    if (!S.orders.length) return toast('Ainda não há pedidos para exportar.');
    const cell = v => {
      let s = String(v ?? '');
      if (/^[=+\-@]/.test(s)) s = "'" + s;
      return /[";\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const head = ['Nº', 'Data', 'Cliente', 'Telefone', 'E-mail', 'Endereço', 'Itens', 'Subtotal', 'Desconto', 'Total', 'Pago', 'Falta', 'Forma de pagamento', 'Prazo', 'Situação', 'Recebido por', 'Recebido em', 'Observações'];
    const rows = [...S.orders].sort((a, b) => a.numero - b.numero).map(o => {
      const t = U.totals(o), c = o.cliente || {};
      return [U.fmtNum(o.numero), U.fmtDate(o.data), c.nome, U.fmtPhone(c.telefone), c.email, c.endereco,
        (o.itens || []).filter(validItem).map(i => `${U.fmtQty(i.qtd)} x ${i.desc} (${U.money2(i.unit)})`).join(' | '),
        U.money2(t.sub), U.money2(t.desc), U.money2(t.total), U.money2(Math.min(t.pago, t.total)), U.money2(t.rest),
        o.formaPagamento, U.fmtDate(o.prazo), (U.STATUS[o.status] || {}).label, o.recebidoPor, U.fmtDate(o.recebidoEm), String(o.obs || '').replace(/\s+/g, ' ')];
    });
    const csv = '﻿' + [head, ...rows].map(r => r.map(cell).join(';')).join('\r\n');
    downloadFile(new File([csv], `pedidos-${U.isoLocal()}.csv`, { type: 'text/csv;charset=utf-8' }));
    toast('Planilha exportada');
  }

  /* ---------- início ---------- */
  function registerSW() {
    try {
      if (!('serviceWorker' in navigator)) return;
      if (location.protocol !== 'https:' && !['localhost', '127.0.0.1'].includes(location.hostname)) return;
      navigator.serviceWorker.register('sw.js').catch(() => { /* sem service worker: o app funciona online */ });
    } catch (e) { /* ambiente sem permissão (ex.: prévia em iframe) */ }
  }
  async function boot() {
    S.mode = await Store.init();
    try { const c = await Store.getKV('cfg'); if (c) S.cfg = Object.assign(clone(DEFAULT_CFG), c); } catch (e) { /* usa o padrão */ }
    try { S.orders = ((await Store.allOrders()) || []).filter(o => o && o.id); } catch (e) { S.orders = []; }
    try { S.drafts = (await Store.getKV('drafts')) || {}; } catch (e) { S.drafts = {}; }
    try { S.persisted = !!(navigator.storage && navigator.storage.persisted && (await navigator.storage.persisted())); } catch (e) { /* ok */ }
    let est = null;
    try { est = await Store.getKV('nuvem'); } catch (e) { est = null; }
    Sync.s = NUVEM.sessao(est || null, st => Store.setKV('nuvem', st).catch(() => {}));
    try {
      const p = await Store.getKV('nuvemPend');
      if (p) { Sync.pend = new Set(p.pend || []); Sync.tumulos = p.tumulos || {}; Sync.cfgPend = !!p.cfgPend; }
    } catch (e) { /* começa sem pendências */ }
    if (nuvemOk()) { Sync.at = (est && est.ultimoEnvio) || 0; Sync.status = 'ok'; } else if (nuvemLigada()) Sync.status = 'bloqueado';
    updateBrand();
    window.addEventListener('hashchange', route);
    let lastW = window.innerWidth;
    window.addEventListener('resize', debounce(() => { if (S.route === 'pedido' && window.innerWidth !== lastW) { lastW = window.innerWidth; renderPreview(); } }, 200));
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; if (S.route === 'ajustes') viewSettings(); });
    window.addEventListener('appinstalled', () => { S.installEvt = null; toast('App instalado'); });
    window.addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
    document.addEventListener('click', navGuard, true);
    window.addEventListener('online', () => { sincronizar(); });
    window.addEventListener('offline', () => { if (nuvemOk()) setSync('offline'); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sincronizar(); });
    setInterval(() => { if (document.visibilityState === 'visible') sincronizar(); }, 5 * 60 * 1000);
    route();
    registerSW();
    if (nuvemOk()) setTimeout(() => { sincronizar(); }, 600);
  }

  window.TALAO = { S, Sync, makePdf, makePngs, msgText, pixCodeFor, sincronizar, nuvemEndpoints: NUVEM.setEndpoints };
  boot();
})();

</script>
