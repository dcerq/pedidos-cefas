/* ===== Talão digital: a interface é a "via amarela" (fica na fábrica); a via do cliente é o papel branco. ===== */
:root {
  --ink: #22398c;        /* tinta azul do talão */
  --ink-2: #172a6b;
  --ink-soft: #e4e9f7;
  --rule: #c3cbe6;       /* pauta */
  --carbon: #f3e6a6;     /* via amarela */
  --carbon-pale: #faf4d8;
  --desk: #e7ddb4;
  --text: #1b2130;
  --muted: #5b6273;
  --green: #1d7549;
  --green-soft: #e0f1e7;
  --red: #b3261e;        /* numerador */
  --red-soft: #fbe8e6;
  --amber: #8a5800;
  --r-box: 14px;
  --r-ctl: 10px;
  --font: "Barlow SC", "Arial Narrow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --nav-h: 66px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; font-family: var(--font); font-size: 17px; line-height: 1.45;
  color: var(--text); background: var(--carbon-pale); font-variant-numeric: tabular-nums lining-nums;
  -webkit-tap-highlight-color: rgba(34, 57, 140, .12);
}
button, input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; }
svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
a { color: var(--ink); }
h1, h2 { margin: 0; color: var(--ink-2); line-height: 1.15; font-weight: 700; }
h1 { font-size: 28px; letter-spacing: -.005em; }
h2 { font-size: 20px; margin-bottom: 10px; }
p { margin: 0 0 10px; }
.muted { color: var(--muted); }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.topbar :focus-visible { outline-color: var(--carbon); }

/* ---------- topo e navegação ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px;
  padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top)); background: var(--ink); color: #fff;
}
.brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; min-width: 0; }
.brand-mark {
  width: 40px; height: 40px; border-radius: 50%; border: 2px solid #fff; display: grid; place-items: center;
  font-weight: 700; font-size: 16px; letter-spacing: .02em; overflow: hidden; flex: none;
}
.brand-mark img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.brand-text { min-width: 0; }
.brand-text strong { display: block; font-size: 21px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-text small { display: block; font-size: 14px; color: #cfd8f3; }
.tabs { display: flex; gap: 6px; margin-left: auto; }
.tabs a {
  display: flex; align-items: center; gap: 8px; color: #dbe2f6; text-decoration: none; padding: 9px 14px;
  border-radius: 10px; font-weight: 600; white-space: nowrap;
}
.tabs a:hover { background: rgba(255, 255, 255, .1); color: #fff; }
.tabs a[aria-current="page"] { background: rgba(255, 255, 255, .16); color: #fff; }
.tabs a.tab-new { background: var(--carbon); color: var(--ink-2); }
.tabs a.tab-new[aria-current="page"] { box-shadow: inset 0 0 0 2px #fff; }

main { max-width: 1140px; margin: 0 auto; padding: 18px 16px 48px; outline: none; }
.loading { color: var(--muted); }

@media (max-width: 719px) {
  .topbar { padding: 8px 14px; padding-top: calc(8px + env(safe-area-inset-top)); }
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; margin: 0; gap: 0; justify-content: space-around; align-items: center;
    background: #fff; border-top: 1.5px solid var(--ink); padding: 6px 10px calc(6px + env(safe-area-inset-bottom));
  }
  .tabs a { flex-direction: column; gap: 1px; color: var(--muted); font-size: 13.5px; padding: 5px 12px; min-width: 76px; }
  .tabs a:hover { background: transparent; color: var(--ink); }
  .tabs a[aria-current="page"] { color: var(--ink); background: transparent; }
  .tabs a.tab-new { background: var(--ink); color: #fff; border-radius: 16px; padding: 7px 18px; }
  .tabs a.tab-new[aria-current="page"] { box-shadow: none; }
  main { padding: 14px 12px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom)); }
  body.r-form .tabs { display: none; }
  body.r-form main { padding-bottom: calc(150px + env(safe-area-inset-bottom)); }
  h1 { font-size: 25px; }
}

/* ---------- botões e campos ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px;
  border-radius: var(--r-ctl); border: 1.5px solid var(--ink); background: #fff; color: var(--ink);
  font-size: 17px; font-weight: 600; text-decoration: none; cursor: pointer; line-height: 1.15; text-align: left;
}
.btn:hover { background: var(--ink-soft); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--ink); color: #fff; }
.btn.primary:hover { background: var(--ink-2); }
.btn.wa { background: var(--green); border-color: var(--green); color: #fff; }
.btn.wa:hover { background: #155c39; }
.btn.danger { border-color: var(--red); color: var(--red); }
.btn.danger:hover { background: var(--red-soft); }
.btn.danger-solid { background: var(--red); border-color: var(--red); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--ink-soft); }
.btn.sm { min-height: 40px; padding: 0 12px; font-size: 15.5px; }
.btn.sm svg { width: 19px; height: 19px; }
.btn.block { width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 10px; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.file-btn:focus-within { outline: 3px solid var(--ink); outline-offset: 2px; }
.link { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; font-weight: 600; }
.icon-btn {
  display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; border: 0;
  background: transparent; color: var(--ink); cursor: pointer; flex: none; text-decoration: none;
}
.icon-btn:hover { background: var(--ink-soft); }

.fld { display: block; margin: 0 0 12px; min-width: 0; position: relative; }
.fld > span { display: block; font-size: 15px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
.fld input, .fld select, .fld textarea {
  display: block; width: 100%; font-size: 17px; background: #fff; border: 1.5px solid var(--rule); border-radius: 8px;
  padding: 10px 12px; min-height: 46px; color: var(--text); appearance: none; -webkit-appearance: none;
}
.fld select { background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 12px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 34px; }
.fld input[type="date"] { min-width: 0; }

<script>
/* ===== util.js: formatação, cálculos e regras de negócio (sem DOM) ===== */
const U = (() => {
  const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  const DEC2 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const DECQ = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 3 });

  // Valores sempre em centavos (inteiros) para não ter erro de arredondamento.
  const money = c => BRL.format((Number(c) || 0) / 100);
  const money2 = c => DEC2.format((Number(c) || 0) / 100);

  function parseDecimal(s) {
    s = String(s ?? '').trim().replace(/\s/g, '').replace(/[^\d,.]/g, '');
    if (!s) return 0;
    let n;
    if (s.includes(',')) n = parseFloat(s.replace(/\./g, '').replace(',', '.'));
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) n = parseFloat(s.replace(/\./g, ''));
    else n = parseFloat(s);
    return isFinite(n) && n > 0 ? n : 0;
  }
  const parseMoney = s => Math.round(parseDecimal(s) * 100);
  const parseQty = s => Math.round(parseDecimal(s) * 1000) / 1000;
  const fmtQty = q => (Number(q) ? DECQ.format(Number(q)) : '');

  const itemTotal = it => Math.round((Number(it && it.qtd) || 0) * (Number(it && it.unit) || 0));
  function totals(o) {
    const sub = ((o && o.itens) || []).reduce((a, it) => a + itemTotal(it), 0);
    const desc = Math.min(sub, Math.max(0, Number(o && o.desconto) || 0));
    const total = Math.max(0, sub - desc);
    const pago = Math.max(0, Number(o && o.pago) || 0);
    const rest = Math.max(0, total - pago);
    return { sub, desc, total, pago, rest };
  }
  // Valor que vai no QR/copia e cola: o que falta pagar, ou um valor menor informado (ex.: sinal).
  function pixValue(o) {
    const { rest } = totals(o);
    if (rest <= 0) return 0;
    const v = Number(o && o.pixValor) || 0;
    return v > 0 ? Math.min(v, rest) : rest;
  }

  const pad2 = n => String(n).padStart(2, '0');
  const isoLocal = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const fmtDate = iso => {
    if (!iso || !/^\d{4}-\d{2}-\d{2}/.test(iso)) return '';
    const [y, m, d] = String(iso).slice(0, 10).split('-');
    return `${d}/${m}/${y}`;
  };
  const fmtDateTime = ts => {
    const d = new Date(ts);
    return `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()} às ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  };
  const fmtNum = n => (n == null || n === '' ? '' : String(n).padStart(4, '0'));

  const digits = s => String(s ?? '').replace(/\D/g, '');
  function fmtPhone(s) {
    let d = digits(s);
    if (d.startsWith('55') && (d.length === 12 || d.length === 13)) d = d.slice(2);
    if (d.length === 11) return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
    if (d.length === 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
    if (d.length === 9) return `${d.slice(0, 5)}-${d.slice(5)}`;

    const P1 = [true, false, true, true, true, false, true, false, false, false, false];
    const P2 = [false, false, false, false, true, false, true, true, true, false, true];

/* ===== pix.js: código PIX "copia e cola" (BR Code estático, padrão EMV do Banco Central) ===== */
const PIX = (() => {
  const strip = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '');
  const clean = (s, max) => strip(s).replace(/[^A-Za-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim().toUpperCase().slice(0, max).trim();
  const field = (id, v) => id + String(v.length).padStart(2, '0') + v;

  function crc16(s) {
    let crc = 0xffff;
    for (let i = 0; i < s.length; i++) {
      crc ^= s.charCodeAt(i) << 8;
      for (let j = 0; j < 8; j++) crc = crc & 0x8000 ? ((crc << 1) ^ 0x1021) & 0xffff : (crc << 1) & 0xffff;
    }
    return crc.toString(16).toUpperCase().padStart(4, '0');
  }

  function validCPF(d) {
    d = String(d).replace(/\D/g, '');
    if (d.length !== 11 || /^(\d)\1{10}$/.test(d)) return false;
    const calc = n => {
      let s = 0;
      for (let i = 0; i < n; i++) s += Number(d[i]) * (n + 1 - i);
      const r = (s * 10) % 11;
      return r === 10 ? 0 : r;
    };
    return calc(9) === Number(d[9]) && calc(10) === Number(d[10]);
  }
  function validCNPJ(d) {
    d = String(d).replace(/\D/g, '');
    if (d.length !== 14 || /^(\d)\1{13}$/.test(d)) return false;
    const calc = n => {
      const w = n === 12 ? [5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2] : [6, 5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2];
      let s = 0;
      for (let i = 0; i < n; i++) s += Number(d[i]) * w[i];
      const r = s % 11;
      return r < 2 ? 0 : 11 - r;
    };
    return calc(12) === Number(d[12]) && calc(13) === Number(d[13]);
  }
  const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

  // Converte a chave para o formato exigido no BR Code (celular com +55, CPF/CNPJ só números...).
  function normKey(tipo, chave) {
    const raw = String(chave ?? '').trim();
    if (!raw) return '';
    const d = raw.replace(/\D/g, '');
    switch (tipo) {
      case 'celular': {
        const n = d.replace(/^0+/, '');
        if (n.startsWith('55') && (n.length === 12 || n.length === 13)) return '+' + n;
        if (n.length === 10 || n.length === 11) return '+55' + n;
        return '';
      }
      case 'cpf': return d.length === 11 ? d : '';
      case 'cnpj': return d.length === 14 ? d : '';
      case 'email': return raw.includes('@') ? raw.toLowerCase() : '';
      case 'aleatoria': return UUID.test(raw) ? raw.toLowerCase() : '';
      default: return '';
    }
  }

  // Confere a chave e devolve um aviso em português (ou '' se estiver ok).
  function checkKey(tipo, chave) {
    const raw = String(chave ?? '').trim();
    if (!raw) return 'Sem chave PIX: o pedido sai sem QR Code.';
    const d = raw.replace(/\D/g, '');
    switch (tipo) {
      case 'celular': return normKey(tipo, raw) ? '' : 'Celular precisa ter DDD + número (ex.: 71 98675-2251).';
      case 'cpf': return validCPF(d) ? '' : 'Esse CPF não é válido. Confira os números.';
      case 'cnpj': return validCNPJ(d) ? '' : 'Esse CNPJ não é válido. Confira os números.';
      case 'email': return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(raw) ? '' : 'E-mail inválido.';
      case 'aleatoria': return UUID.test(raw) ? '' : 'Chave aleatória tem o formato 0000aaaa-00aa-00aa-00aa-000000aaaaaa.';
      default: return 'Escolha o tipo da chave.';
    }
  }

  function guessTipo(chave) {
    const raw = String(chave ?? '').trim(), d = raw.replace(/\D/g, '');
    if (!raw) return '';
    if (raw.includes('@')) return 'email';
    if (UUID.test(raw)) return 'aleatoria';
    if (raw.startsWith('+')) return 'celular';
    if (d.length === 14) return 'cnpj';
    if (d.length === 11) return validCPF(d) ? 'cpf' : 'celular';
    if (d.length === 10 || d.length === 12 || d.length === 13) return 'celular';
    return '';
  }

  function payload({ tipo, chave, nome, cidade, valorCentavos, descricao }) {
    const key = normKey(tipo, chave);
    if (!key) return '';
    let mai = field('00', 'br.gov.bcb.pix') + field('01', key);
    const desc = strip(descricao).replace(/[^A-Za-z0-9 ]/g, '').trim();
    const room = 99 - mai.length - 4;
    if (desc && room > 0) mai += field('02', desc.slice(0, room));
    let p = field('00', '01') + field('26', mai) + field('52', '0000') + field('53', '986');
    if (valorCentavos > 0) p += field('54', (valorCentavos / 100).toFixed(2));
    p += field('58', 'BR') + field('59', clean(nome, 25) || 'RECEBEDOR') + field('60', clean(cidade, 15) || 'BRASIL');
    p += field('62', field('05', '***'));
    p += '6304';
    return p + crc16(p);
  }

  return { payload, crc16, normKey, checkKey, guessTipo, validCPF, validCNPJ };
})();

    ...rep(667, 6), 1000, 722, ...rep(667, 4), ...rep(278, 4), 722, 722, ...rep(778, 5), 584, 778, ...rep(722, 4), 667, 667, 611,
    ...rep(556, 6), 889, 500, ...rep(556, 4), ...rep(278, 4), 556, 556, ...rep(556, 5), 584, 611, ...rep(556, 4), 500, 556, 500];
  const B_LAT = [278, 333, 556, 556, 556, 556, 280, 556, 333, 737, 370, 556, 584, 333, 737, 333, 400, 584, 333, 333, 333, 611, 556, 278, 333, 333, 365, 556, 834, 834, 834, 611,
    ...rep(722, 6), 1000, 722, ...rep(667, 4), ...rep(278, 4), 722, 722, ...rep(778, 5), 584, 778, ...rep(722, 4), 667, 667, 611,
    ...rep(556, 6), 889, 556, ...rep(556, 4), ...rep(278, 4), 611, 611, ...rep(611, 5), 584, 611, ...rep(611, 4), 556, 611, 556];
  const WR = rep(0, 256), WB = rep(0, 256);
  for (let i = 0; i < 95; i++) { WR[32 + i] = R_ASCII[i]; WB[32 + i] = B_ASCII[i]; }
  for (const k in R_HI) { WR[k] = R_HI[k]; WB[k] = B_HI[k]; }
  for (let i = 0; i < 96; i++) { WR[160 + i] = R_LAT[i]; WB[160 + i] = B_LAT[i]; }

  const WIN = { 0x20ac: 128, 0x201a: 130, 0x0192: 131, 0x201e: 132, 0x2026: 133, 0x2020: 134, 0x2021: 135, 0x02c6: 136, 0x2030: 137, 0x0160: 138, 0x2039: 139, 0x0152: 140, 0x017d: 142, 0x2018: 145, 0x2019: 146, 0x201c: 147, 0x201d: 148, 0x2022: 149, 0x2013: 150, 0x2014: 151, 0x02dc: 152, 0x2122: 153, 0x0161: 154, 0x203a: 155, 0x0153: 156, 0x017e: 158, 0x0178: 159 };
  // Converte texto para bytes WinAnsi (o que a Helvetica do PDF entende). Emojis e símbolos fora da tabela são descartados.
  function toWin(str) {
    const out = [];
    for (const ch of String(str ?? '')) {
      const c = ch.codePointAt(0);
      if (c >= 32 && c <= 126) out.push(c);
      else if (c >= 160 && c <= 255) out.push(c);
      else if (WIN[c]) out.push(WIN[c]);
      else if (c === 9 || c === 10 || c === 13 || (c >= 0x2000 && c <= 0x200b) || c === 0x202f || c === 0x205f || c === 0x3000) out.push(32);
      else if (c === 0x2212) out.push(45);
      else {
        const base = ch.normalize('NFD').replace(/[̀-ͯ]/g, '');
        const b = base.codePointAt(0);
        if (base.length === 1 && b >= 32 && b <= 126) out.push(b);
      }
    }
    return out;
  }
  const widthBytes = (bytes, size, bold) => { const w = bold ? WB : WR; let t = 0; for (const b of bytes) t += w[b] || 556; return (t * size) / 1000; };
  const width = (s, size, bold) => widthBytes(toWin(s), size, bold);

  function wrap(str, size, bold, maxW) {
    const words = String(str ?? '').replace(/\s+/g, ' ').trim().split(' ').filter(Boolean);
    const lines = [];
    let cur = '';
    for (const w of words) {
      const test = cur ? cur + ' ' + w : w;
      if (width(test, size, bold) <= maxW) { cur = test; continue; }
      if (cur) lines.push(cur);
      if (width(w, size, bold) > maxW) {
        let part = '';
        for (const ch of w) {
          if (part && width(part + ch, size, bold) > maxW) { lines.push(part); part = ch; } else part += ch;
        }
        cur = part;
      } else cur = w;
    }
    if (cur) lines.push(cur);
    return lines.length ? lines : [''];
  }
  const wrapPara = (str, size, bold, maxW) => String(str ?? '').split(/\r?\n/).flatMap(p => (p.trim() ? wrap(p, size, bold, maxW) : ['']));
  function ellipsize(s, size, bold, maxW) {
    s = String(s ?? '');
    if (width(s, size, bold) <= maxW) return s;
    let lo = 0, hi = s.length;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (width(s.slice(0, mid) + '…', size, bold) <= maxW) lo = mid; else hi = mid - 1;
    }
    return s.slice(0, lo).trimEnd() + '…';
  }
  function fitSize(s, size, bold, maxW, min) {
    while (size > min && width(s, size, bold) > maxW) size -= 0.5;
    return size;
  }

  /* ---------- Layout: gera páginas como listas de operações de desenho ---------- */
  function layout(order, cfg) {
    const o = order || {}, c = cfg || {}, cli = o.cliente || {};
    const pages = [];
    let ops = null, y = 0;
    const LIMIT = PAGE.h - M - 18;
    const numStr = U.fmtNum(o.numero) || '----';
    const tt = U.totals(o);
    const pv = U.pixValue(o);
    let pixCode = '', qr = null;
    if (o.mostrarQr !== false && String(c.pixChave || '').trim() && pv > 0 && o.status !== 'cancelado') {
      pixCode = PIX.payload({ tipo: c.pixTipo, chave: c.pixChave, nome: c.pixNome || c.nome, cidade: c.pixCidade, valorCentavos: pv, descricao: 'Pedido ' + numStr });
      if (pixCode) { try { qr = QR.encode(pixCode, 'M'); } catch (e) { qr = null; } }
    }

    const T = (s, x, yy, size, st = {}) => {
      s = String(s ?? '');
      if (s) ops.push({ t: 'text', s, x, y: yy, size, bold: !!st.bold, color: st.color || C.text, align: st.align || 'left' });
    };
    const R = (x, yy, w, h, st = {}) => ops.push({ t: 'rect', x, y: yy, w, h, r: st.r || 0, rr: st.rr || null, fill: st.fill || null, stroke: st.stroke || null, lw: st.lw || 1 });
    const L = (x1, y1, x2, y2, st = {}) => ops.push({ t: 'line', x1, y1, x2, y2, color: st.color || C.ink, lw: st.lw || 0.8, dash: st.dash || null });
    const lab = (s, x, yy) => { T(s, x, yy, 6.8, { bold: true, color: C.ink }); return width(s, 6.8, true); };

    function newPage(first) {
      ops = [];
      pages.push(ops);
      y = M;
      if (first) header(); else miniHeader();
    }

    function header() {
      const HH = 92, gap = 8, leftW = Math.round(CW * 0.69), rightW = CW - leftW - gap;
      R(X0, y, leftW, HH, { r: 9, stroke: C.ink, lw: 1.3 });
      const ls = 54, lx = X0 + 12, ly = y + (HH - ls) / 2;
      if (c.logo && c.logo.w && c.logo.h) {
        const ar = c.logo.w / c.logo.h;
        let w = ls, h = ls;
        if (ar >= 1) h = ls / ar; else w = ls * ar;
        ops.push({ t: 'img', key: 'logo', x: lx + (ls - w) / 2, y: ly + (ls - h) / 2, w, h });
      } else {
        R(lx, ly, ls, ls, { r: ls / 2, stroke: C.ink, lw: 1.6 });
        const ini = U.initials(c.nome, c.atividade);
        T(ini, lx + ls / 2, ly + ls / 2 + 7.2, ini.length > 1 ? 20 : 24, { bold: true, color: C.ink, align: 'center' });
      }
      const nx = lx + ls + 11, split = X0 + leftW * 0.49, nameW = split - nx - 6;
      const nome = c.nome || 'Sua empresa';
      const ns = fitSize(nome, 22, true, nameW, 11);
      const sl = c.atividade ? wrap(c.atividade, 9.5, false, nameW).slice(0, 2) : [];
      const bh = ns * 0.72 + (sl.length ? 13 + (sl.length - 1) * 11.5 + 2 : 0);
      const ny = y + (HH - bh) / 2 + ns * 0.72;
      T(nome, nx, ny, ns, { bold: true, color: C.ink });
      sl.forEach((l, i) => T(l, nx, ny + 13 + i * 11.5, 9.5, { color: C.ink }));

      const ax = split + 4, aw = X0 + leftW - 10 - ax;
      const lines = [];
      if (c.endereco1) lines.push({ s: c.endereco1, size: 8.4 });
      if (c.endereco2) lines.push({ s: c.endereco2, size: 8.4 });
      if (c.email) lines.push({ s: 'E-mail: ' + c.email, size: 8.4 });
      if (c.telefone) lines.push({ s: U.fmtPhone(c.telefone), size: 11.5, bold: true, suffix: c.whatsapp ? 'WhatsApp' : '' });
      const lh = l => l.size + 3.8;
      let ay = y + (HH - lines.reduce((a, l) => a + lh(l), 0)) / 2;
      for (const l of lines) {
        ay += lh(l);
        const s = ellipsize(l.s, l.size, !!l.bold, aw);
        T(s, ax, ay - 3.2, l.size, { bold: l.bold, color: C.ink });
        if (l.suffix) {
          const sx = ax + width(s, l.size, !!l.bold) + 5;
          if (sx + width(l.suffix, 7.5, false) <= ax + aw) T(l.suffix, sx, ay - 3.4, 7.5, { color: C.ink });
        }
      }

      const rx = X0 + leftW + gap, cx = rx + rightW / 2;
      R(rx, y, rightW, HH, { r: 9, stroke: C.ink, lw: 1.3 });
      T('PEDIDO', cx, y + 27, 17, { bold: true, color: C.ink, align: 'center' });
      T('Nº ' + numStr, cx, y + 49, 14, { bold: true, color: C.red, align: 'center' });
      L(rx + 10, y + 60, rx + rightW - 10, y + 60, { color: C.rule, lw: 0.6 });
      const dw = lab('DATA:', rx + 12, y + 79);
      T(U.fmtDate(o.data), rx + 12 + dw + 6, y + 79.5, 11, { bold: true });
      y += HH + 8;

      if (o.status === 'cancelado') {
        R(X0, y, CW, 22, { r: 6, stroke: C.red, lw: 1.2, fill: '#fdecea' });
        T('PEDIDO CANCELADO', X0 + CW / 2, y + 15, 10, { bold: true, color: C.red, align: 'center' });
        y += 30;
      }
      clientBlock();
    }

    function miniHeader() {
      R(X0, y, CW, 28, { r: 8, stroke: C.ink, lw: 1.1 });
      T(ellipsize(c.nome || '', 12, true, CW * 0.45), X0 + 12, y + 18.5, 12, { bold: true, color: C.ink });
      T('PEDIDO Nº ' + numStr + '  (continuação)', X1 - 12, y + 18.5, 9.5, { bold: true, color: C.ink, align: 'right' });
      y += 36;
    }

    function clientBlock() {
      const pad = 9, top = y;
      let ry = y;
      let w = lab('RESPONSÁVEL PELO PEDIDO:', X0 + pad, ry + 14.5);
      T(ellipsize(cli.nome || '', 11, true, CW - pad * 2 - w - 6), X0 + pad + w + 6, ry + 15, 11, { bold: true });
      ry += 22;
      L(X0, ry, X1, ry, { color: C.rule, lw: 0.6 });
      w = lab('ENDEREÇO CLIENTE:', X0 + pad, ry + 14.5);
      const addr = wrap(cli.endereco || '', 10, false, CW - pad * 2 - w - 6).slice(0, 2);
      addr.forEach((l, i) => T(l, X0 + pad + w + 6, ry + 15 + i * 12, 10));
      ry += Math.max(22, 10 + addr.length * 12);
      L(X0, ry, X1, ry, { color: C.rule, lw: 0.6 });
      const sx = X0 + CW * 0.6;
      w = lab('E-MAIL:', X0 + pad, ry + 14.5);
      T(ellipsize(cli.email || '', 10, false, sx - X0 - pad * 2 - w - 6), X0 + pad + w + 6, ry + 15, 10);
      L(sx, ry, sx, ry + 22, { color: C.rule, lw: 0.6 });
      w = lab('TEL.:', sx + pad, ry + 14.5);
      T(U.fmtPhone(cli.telefone || ''), sx + pad + w + 6, ry + 15, 11, { bold: true });
      ry += 22;
      R(X0, top, CW, ry - top, { r: 9, stroke: C.ink, lw: 1.3 });
      y = ry + 8;
    }

    // Colunas da tabela (iguais ao talão)
    const cQ = X0 + 46, cT = X1 - 84, cU = cT - 74;
    const dW = cU - cQ - 12;
    function tableHead() {
      R(X0, y, CW, 18, { rr: [8, 8, 0, 0], fill: C.fill });
      T('QUANT.', (X0 + cQ) / 2, y + 12, 7.2, { bold: true, color: C.ink, align: 'center' });
      T('DISCRIMINAÇÃO', (cQ + cU) / 2, y + 12, 7.2, { bold: true, color: C.ink, align: 'center' });
      T('VL. UNIT.', (cU + cT) / 2, y + 12, 7.2, { bold: true, color: C.ink, align: 'center' });
      T('VL. TOTAL', (cT + X1) / 2, y + 12, 7.2, { bold: true, color: C.ink, align: 'center' });
      L(X0, y + 18, X1, y + 18, { color: C.ink, lw: 0.9 });
      y += 18;
    }

    function footerParts() {
      const obs = String(o.obs || '').trim();
      const obsLines = obs ? wrapPara(obs, 9.5, false, CW - 20).slice(0, 10) : [];
      const bandH = qr ? 128 : 98;
      const obsH = obsLines.length ? 22 + obsLines.length * 11.5 : 0;
      const recH = 54;
      // a caixa de totais cresce com desconto e sinal; a faixa inteira acompanha
      const nTot = 1 + (tt.desc > 0 ? 1 : 0) + (tt.pago > 0 ? 2 : 0);
      const bH = Math.max(bandH, nTot * 16 + 34 + 14);
      return { obsLines, bandH: bH, obsH, recH, need: bH + 8 + (obsH ? obsH + 8 : 0) + recH };
    }
    const FP = footerParts();

    function itemsTable() {
      const its = (o.itens || []).filter(it => String(it.desc || '').trim() || Number(it.unit) > 0 || Number(it.qtd) > 0);
      const rows = its.map(it => {
        const lines = wrap(it.desc || '', 9.5, false, dW);
        return { it, lines, h: Math.max(18, 7.5 + lines.length * 11.5) };
      });
      let segTop = y;
      tableHead();
      const closeSeg = () => {
        [cQ, cU, cT].forEach(x => L(x, segTop, x, y, { color: C.ink, lw: 0.8 }));
        R(X0, segTop, CW, y - segTop, { r: 9, stroke: C.ink, lw: 1.3 });
      };
      rows.forEach((r, i) => {
        if (y + r.h > LIMIT) { closeSeg(); newPage(false); segTop = y; tableHead(); }
        else if (i > 0) L(X0, y, X1, y, { color: C.rule, lw: 0.5 });
        const base = y + 12.6;
        T(U.fmtQty(r.it.qtd), (X0 + cQ) / 2, base, 10, { bold: true, align: 'center' });
        r.lines.forEach((l, k) => T(l, cQ + 6, base + k * 11.5, 9.5));
        if (Number(r.it.unit) > 0) T(U.money2(r.it.unit), cT - 6, base, 9.5, { align: 'right' });
        const tot = U.itemTotal(r.it);
        if (tot > 0) T(U.money2(tot), X1 - 6, base, 9.5, { bold: true, align: 'right' });
        y += r.h;
      });
      let n = rows.length;
      while (n < 6 && y + 18 + 8 + FP.need <= LIMIT) {
        if (n > 0) L(X0, y, X1, y, { color: C.rule, lw: 0.5 });
        y += 18;
        n++;
      }
      closeSeg();
      y += 8;
    }

    function band(H) {
      const gap = 8, totW = 200, qrW = qr ? 122 : 0;
      const aW = CW - totW - gap - (qr ? qrW + gap : 0);
      // Caixa da chave PIX + forma de pagamento + prazo
      R(X0, y, aW, H, { r: 9, stroke: C.ink, lw: 1.3 });
      lab('CHAVE PIX:', X0 + 10, y + 16);
      const key = String(c.pixChave || '').trim();
      T(key ? ellipsize(key, 13, true, aW - 20) : '—', X0 + 10, y + 33, 13, { bold: true });
      const info = [key ? U.PIX_TIPOS[c.pixTipo] || '' : '', c.pixNome ? 'Favorecido: ' + c.pixNome : ''].filter(Boolean).join('   ');
      if (info) T(ellipsize(info, 8, false, aW - 20), X0 + 10, y + 45, 8, { color: C.muted });
      if (qr) {
        T('Pague pelo app do banco: Pix, ler QR Code,', X0 + 10, y + 62, 8, { color: C.muted });
        T('ou use o código copia e cola da mensagem.', X0 + 10, y + 72.5, 8, { color: C.muted });
      }
      const ly = y + H - 40, half = aW / 2;
      L(X0, ly, X0 + aW, ly, { color: C.rule, lw: 0.6 });
      L(X0 + half, ly, X0 + half, y + H, { color: C.rule, lw: 0.6 });
      lab('FORMA DE PAGAMENTO', X0 + 10, ly + 14);
      T(ellipsize(o.formaPagamento || '—', 10, false, half - 18), X0 + 10, ly + 30, 10);
      lab('PRAZO DE ENTREGA', X0 + half + 10, ly + 14);
      T(U.fmtDate(o.prazo) || '—', X0 + half + 10, ly + 30, 10.5, { bold: !!o.prazo });

      // QR Code PIX com o valor
      if (qr) {
        const qx = X0 + aW + gap;
        R(qx, y, qrW, H, { r: 9, stroke: C.ink, lw: 1.3 });
        const n = qr.size, ms = Math.floor(((qrW - 24) / n) * 20) / 20, qs = ms * n;
        ops.push({ t: 'qr', m: qr.modules, x: qx + (qrW - qs) / 2, y: y + 9, size: qs });
        T('Pix ' + U.money(pv), qx + qrW / 2, y + 9 + qs + 15, 8.5, { bold: true, color: C.ink, align: 'center' });
      }

      // Totais
      const tx = X1 - totW;
      R(tx, y, totW, H, { r: 9, stroke: C.ink, lw: 1.3 });
      const before = [['SUBTOTAL', U.money(tt.sub)]];
      if (tt.desc > 0) before.push(['DESCONTO', '- ' + U.money(tt.desc)]);
      const after = [];
      if (tt.pago > 0) {
        after.push([tt.rest > 0 ? 'PAGO / SINAL' : 'PAGO', U.money(Math.min(tt.pago, tt.total))]);
        if (tt.rest > 0) after.push(['FALTA PAGAR', U.money(tt.rest), C.text]);
        else after.push(['SITUAÇÃO', 'QUITADO', C.green]);
      }
      const rowH = 16, totH = 34;
      const blockH = before.length * rowH + totH + after.length * rowH;
      let ry = y + Math.max(6, (H - blockH) / 2);
      before.forEach(([l, v]) => { lab(l, tx + 12, ry + 11.5); T(v, X1 - 12, ry + 12, 9.5, { align: 'right' }); ry += rowH; });
      R(tx + 6, ry + 2, totW - 12, totH - 4, { r: 6, fill: C.carbon, stroke: C.ink, lw: 0.9 });
      T('TOTAL R$', tx + 14, ry + 21.5, 9, { bold: true, color: C.ink });
      T(U.money2(tt.total), X1 - 14, ry + 22.5, 15, { bold: true, align: 'right' });
      ry += totH;
      after.forEach(([l, v, col]) => { lab(l, tx + 12, ry + 11.5); T(v, X1 - 12, ry + 12, col ? 10.5 : 9.5, { bold: !!col, color: col || C.text, align: 'right' }); ry += rowH; });
    }

    function received(H) {
      R(X0, y, CW, H, { r: 9, stroke: C.ink, lw: 1.3 });
      const base = y + H - 17;
      const w1 = lab('RECEBIDO POR:', X0 + 10, base);
      const lx1 = X0 + 10 + w1 + 6, lx2 = X0 + CW * 0.66;
      if (o.assinatura && o.assinatura.w && o.assinatura.h) {
        const maxH = H - 22, maxW = (lx2 - lx1) * 0.8, ar = o.assinatura.w / o.assinatura.h;
        let h = maxH, w = h * ar;
        if (w > maxW) { w = maxW; h = w / ar; }
        ops.push({ t: 'img', key: 'sig', x: lx1 + 8, y: base + 1 - h, w, h });
        if (o.recebidoPor) T(ellipsize(o.recebidoPor, 7.5, false, lx2 - lx1), lx2, base + 11, 7.5, { color: C.muted, align: 'right' });
      } else if (o.recebidoPor) {
        T(ellipsize(o.recebidoPor, 11, false, lx2 - lx1 - 8), lx1 + 4, base - 2.5, 11);
      }
      L(lx1, base + 1.5, lx2, base + 1.5, { color: C.ink, lw: 0.7 });
      const dx = X0 + CW * 0.7;
      const w2 = lab('DIA:', dx, base);
      if (o.recebidoEm) T(U.fmtDate(o.recebidoEm), dx + w2 + 8, base - 0.5, 11, { bold: true });
      else T('____/____/________', dx + w2 + 8, base, 9, { color: C.rule });
    }

    function footer() {
      if (y + FP.need > LIMIT) newPage(false);
      band(FP.bandH);
      y += FP.bandH + 8;
      if (FP.obsH) {
        R(X0, y, CW, FP.obsH, { r: 9, stroke: C.ink, lw: 1.1 });
        lab('OBSERVAÇÕES', X0 + 10, y + 15);
        FP.obsLines.forEach((l, i) => T(l, X0 + 10, y + 30 + i * 11.5, 9.5));
        y += FP.obsH + 8;
      }
      received(FP.recH);
      y += FP.recH;
    }

    newPage(true);
    itemsTable();
    footer();
    pages.forEach((p, i) => {
      p.push({ t: 'text', s: `${c.nome || ''}: pedido Nº ${numStr}. Documento sem valor fiscal.`.replace(/^: /, ''), x: X0, y: PAGE.h - M + 4, size: 7, bold: false, color: C.muted, align: 'left' });
      p.push({ t: 'text', s: `Página ${i + 1} de ${pages.length}`, x: X1, y: PAGE.h - M + 4, size: 7, bold: false, color: C.muted, align: 'right' });
    });
    return { pages, pixCode, qr };
  }

  /* ---------- Desenho em canvas (prévia, imagem e impressão) ---------- */
  const FONT = 'Helvetica, Arial, "Liberation Sans", "Nimbus Sans", "Helvetica Neue", sans-serif';
  function canvasRect(ctx, o) {
    const [tl, tr, br, bl] = o.rr || [o.r, o.r, o.r, o.r].map(v => Math.min(v || 0, o.w / 2, o.h / 2));
    const { x, y, w, h } = o;
    ctx.moveTo(x + tl, y);
    ctx.lineTo(x + w - tr, y);
    tr ? ctx.arcTo(x + w, y, x + w, y + tr, tr) : ctx.lineTo(x + w, y);
    ctx.lineTo(x + w, y + h - br);
    br ? ctx.arcTo(x + w, y + h, x + w - br, y + h, br) : ctx.lineTo(x + w, y + h);
    ctx.lineTo(x + bl, y + h);
    bl ? ctx.arcTo(x, y + h, x, y + h - bl, bl) : ctx.lineTo(x, y + h);
    ctx.lineTo(x, y + tl);
    tl ? ctx.arcTo(x, y, x + tl, y, tl) : ctx.lineTo(x, y);
    ctx.closePath();
  }
  function drawCanvas(ctx, ops, scale, imgs = {}) {
    ctx.save();
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, PAGE.w, PAGE.h);
    for (const o of ops) {

        if (o.stroke) { ctx.setLineDash([]); ctx.lineWidth = o.lw; ctx.strokeStyle = o.stroke; ctx.stroke(); }
      } else if (o.t === 'line') {

        ctx.lineTo(o.x2, o.y2);

        ctx.lineWidth = o.lw;
        ctx.strokeStyle = o.color;
        ctx.stroke();
      } else if (o.t === 'text') {

      } else if (o.t === 'qr') {

  const pdfStr = bytes => { let s = ''; for (const b of bytes) s += b === 40 || b === 41 || b === 92 ? '\\' + String.fromCharCode(b) : String.fromCharCode(b); return s; };
  const pdfUtf16 = s => { let h = 'FEFF'; for (let i = 0; i < s.length; i++) h += s.charCodeAt(i).toString(16).padStart(4, '0').toUpperCase(); return '<' + h + '>'; };
  const pdfDate = d => {
    const p = n => String(n).padStart(2, '0');
    const off = -d.getTimezoneOffset(), a = Math.abs(off);
    return `D:${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}${off >= 0 ? '+' : '-'}${p(Math.floor(a / 60))}'${p(a % 60)}'`;
  };
  function pdfRectPath(o, H) {
    const [tl, tr, br, bl] = (o.rr || [o.r, o.r, o.r, o.r]).map(v => Math.min(v || 0, o.w / 2, o.h / 2));
    const x = o.x, y = H - o.y - o.h, w = o.w, h = o.h, k = 0.5523;
    if (!tl && !tr && !br && !bl) return `${f2(x)} ${f2(y)} ${f2(w)} ${f2(h)} re\n`;
    // y aqui é a base (PDF cresce para cima): bl/br embaixo, tl/tr em cima
    let p = `${f2(x + bl)} ${f2(y)} m ${f2(x + w - br)} ${f2(y)} l `;
    if (br) p += `${f2(x + w - br + br * k)} ${f2(y)} ${f2(x + w)} ${f2(y + br - br * k)} ${f2(x + w)} ${f2(y + br)} c `;
    p += `${f2(x + w)} ${f2(y + h - tr)} l `;
    if (tr) p += `${f2(x + w)} ${f2(y + h - tr + tr * k)} ${f2(x + w - tr + tr * k)} ${f2(y + h)} ${f2(x + w - tr)} ${f2(y + h)} c `;
    p += `${f2(x + tl)} ${f2(y + h)} l `;
    if (tl) p += `${f2(x + tl - tl * k)} ${f2(y + h)} ${f2(x)} ${f2(y + h - tl + tl * k)} ${f2(x)} ${f2(y + h - tl)} c `;
    p += `${f2(x)} ${f2(y + bl)} l `;
    if (bl) p += `${f2(x)} ${f2(y + bl - bl * k)} ${f2(x + bl - bl * k)} ${f2(y)} ${f2(x + bl)} ${f2(y)} c `;
    return p + 'h\n';
  }
  function opsToPdf(ops) {
    const H = PAGE.h;
    let s = '';
    for (const o of ops) {
      if (o.t === 'rect') {
        const path = pdfRectPath(o, H);
        if (o.fill && o.stroke) s += `${rgb(o.fill)} rg ${rgb(o.stroke)} RG ${f2(o.lw)} w [] 0 d\n${path}B\n`;
        else if (o.fill) s += `${rgb(o.fill)} rg\n${path}f\n`;
        else if (o.stroke) s += `${rgb(o.stroke)} RG ${f2(o.lw)} w [] 0 d\n${path}S\n`;
      } else if (o.t === 'line') {
        s += `${rgb(o.color)} RG ${f2(o.lw)} w ${o.dash ? `[${o.dash.join(' ')}] 0 d` : '[] 0 d'}\n${f2(o.x1)} ${f2(H - o.y1)} m ${f2(o.x2)} ${f2(H - o.y2)} l S\n`;
      } else if (o.t === 'text') {
        const bytes = toWin(o.s);
        if (!bytes.length) continue;
        const w = widthBytes(bytes, o.size, o.bold);
        let x = o.x;
        if (o.align === 'right') x -= w; else if (o.align === 'center') x -= w / 2;

      } else if (o.t === 'img') {
        s += `q ${f2(o.w)} 0 0 ${f2(o.h)} ${f2(o.x)} ${f2(H - o.y - o.h)} cm /${o.key === 'logo' ? 'ImLogo' : 'ImSig'} Do Q\n`;
      } else if (o.t === 'qr') {
        const n = o.m.length, ms = o.size / n;
        let p = '0 0 0 rg\n';
        for (let r = 0; r < n; r++) {
          let x = 0;
          while (x < n) {
            if (o.m[r][x]) {
              let e = x;
              while (e < n && o.m[r][e]) e++;

            } else x++;
          }

      }
    }

  }

  // imgs: { logo: {bytes,w,h,comps}, sig: {...} } (JPEG)
  function pdf(pages, meta = {}, imgs = {}) {
    const used = new Set();
    pages.forEach(p => p.forEach(o => { if (o.t === 'img' && imgs[o.key]) used.add(o.key); }));
    const keys = [...used];
    const chunks = [];
    let offset = 0;
    const offsets = [];
    const push = b => { chunks.push(b); offset += b.length; };
    const pushS = s => push(latin1(s));
    let n = 6;
    const imgNum = {};
    keys.forEach(k => { imgNum[k] = n++; });
    const pageNums = pages.map(() => [n++, n++]);
    const size = n;
    pushS('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    const obj = (num, body) => { offsets[num] = offset; pushS(`${num} 0 obj\n${body}\nendobj\n`); };
    const objStream = (num, dict, bytes) => {
      offsets[num] = offset;
      pushS(`${num} 0 obj\n${dict.replace(/>>$/, `/Length ${bytes.length} >>`)}\nstream\n`);
      push(bytes);
      pushS('\nendstream\nendobj\n');
    };
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, `<< /Type /Pages /Kids [${pageNums.map(([p]) => p + ' 0 R').join(' ')}] /Count ${pages.length} >>`);
    obj(3, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    obj(4, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    obj(5, `<< /Title ${pdfUtf16(meta.title || 'Pedido')} /Author ${pdfUtf16(meta.author || '')} /Producer (Talao digital de pedidos) /CreationDate (${pdfDate(new Date())}) >>`);
    keys.forEach(k => {
      const im = imgs[k];
      const cs = im.comps === 1 ? 'DeviceGray' : im.comps === 4 ? 'DeviceCMYK' : 'DeviceRGB';
      objStream(imgNum[k], `<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /${cs} /BitsPerComponent 8 /Filter /DCTDecode >>`, im.bytes);
    });
    const xres = keys.length ? `/XObject << ${keys.map(k => `/${k === 'logo' ? 'ImLogo' : 'ImSig'} ${imgNum[k]} 0 R`).join(' ')} >>` : '';
    pages.forEach((ops, i) => {
      const [p, cnum] = pageNums[i];
      const okOps = ops.filter(o => o.t !== 'img' || used.has(o.key));
      obj(p, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PAGE.w} ${PAGE.h}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> ${xres} >> /Contents ${cnum} 0 R >>`);
      objStream(cnum, '<< >>', latin1(opsToPdf(okOps)));
    });
    const xref = offset;
    let x = `xref\n0 ${size}\n0000000000 65535 f \n`;
    for (let i = 1; i < size; i++) x += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
    pushS(x);
    pushS(`trailer\n<< /Size ${size} /Root 1 0 R /Info 5 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
    const out = new Uint8Array(offset);
    let pos = 0;
    for (const ch of chunks) { out.set(ch, pos); pos += ch.length; }
    return out;
  }

  /* ---------- JPEG (logo e assinatura) ---------- */
  function jpegInfo(b) {
    if (!b || b[0] !== 0xff || b[1] !== 0xd8) return null;
    let i = 2;
    while (i + 9 < b.length) {
      if (b[i] !== 0xff) { i++; continue; }
      const m = b[i + 1];
      if (m === 0xff) { i++; continue; }
      if (m === 0xd8 || m === 0x01 || (m >= 0xd0 && m <= 0xd7)) { i += 2; continue; }
      const len = (b[i + 2] << 8) | b[i + 3];
      if ((m >= 0xc0 && m <= 0xc3) || (m >= 0xc5 && m <= 0xc7) || (m >= 0xc9 && m <= 0xcb) || (m >= 0xcd && m <= 0xcf)) {
        return { h: (b[i + 5] << 8) | b[i + 6], w: (b[i + 7] << 8) | b[i + 8], comps: b[i + 9] };
      }
      i += 2 + len;
    }
    return null;
  }
  function dataUrlBytes(src) {
    const b64 = String(src || '').split(',')[1] || '';
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function jpegFromDataUrl(src) {
    try {
      const bytes = dataUrlBytes(src);
      const info = jpegInfo(bytes);
      return info ? { bytes, ...info } : null;
    } catch (e) { return null; }
  }

  return { PAGE, layout, drawCanvas, pdf, jpegFromDataUrl, width, wrap };
})();

/* ===== nuvem.js: backup na nuvem com Firebase (Authentication + Cloud Firestore pela API REST, sem SDK) ===== */
const NUVEM = (() => {
  const EP = {
    auth: 'https://identitytoolkit.googleapis.com/v1',
    token: 'https://securetoken.googleapis.com/v1',
    fs: 'https://firestore.googleapis.com/v1',
  };
  // Testes automáticos podem apontar para um servidor falso definindo window.__NUVEM_EP__ antes do app carregar.
  if (typeof window !== 'undefined' && window.__NUVEM_EP__) Object.assign(EP, window.__NUVEM_EP__);
  // Gravações por envio. As regras consultam "membros" a cada gravação e o Firestore aceita até 20 consultas por envio.
  const LOTE = 10;

  const MSG = {
    INVALID_LOGIN_CREDENTIALS: 'E-mail ou senha incorretos.',
    INVALID_PASSWORD: 'E-mail ou senha incorretos.',
    EMAIL_NOT_FOUND: 'E-mail ou senha incorretos.',
    INVALID_EMAIL: 'Esse e-mail não é válido.',
    MISSING_PASSWORD: 'Digite a senha.',
    USER_DISABLED: 'Este usuário está desativado no Firebase.',
    TOO_MANY_ATTEMPTS_TRY_LATER: 'Muitas tentativas seguidas. Espere alguns minutos e tente de novo.',
    PASSWORD_LOGIN_DISABLED: 'O login por e-mail e senha não está ativado no Firebase (Authentication, Método de login).',
    OPERATION_NOT_ALLOWED: 'O login por e-mail e senha não está ativado no Firebase (Authentication, Método de login).',
    API_KEY_INVALID: 'A apiKey não confere. Copie de novo a configuração do Firebase.',
    CONFIGURATION_NOT_FOUND: 'O Authentication ainda não foi ativado nesse projeto do Firebase.',
    TOKEN_EXPIRED: 'A sessão do backup expirou. Entre de novo em Ajustes.',
    INVALID_REFRESH_TOKEN: 'A sessão do backup expirou. Entre de novo em Ajustes.',
    INVALID_ID_TOKEN: 'A sessão do backup expirou. Entre de novo em Ajustes.',
    USER_NOT_FOUND: 'Esse usuário não existe mais no Firebase. Entre de novo em Ajustes.',
    PERMISSION_DENIED: 'O Firebase recusou a gravação. Confira se as regras foram publicadas e se o usuário está em "membros".',
    NOT_FOUND: 'Banco não encontrado. Confira o projectId e se o Firestore Database foi criado.',
    FAILED_PRECONDITION: 'O Firestore Database ainda não foi criado nesse projeto.',
    RESOURCE_EXHAUSTED: 'O limite gratuito diário do Firebase acabou. O envio volta a funcionar amanhã.',
    UNAVAILABLE: 'O Firebase não respondeu agora. O app tenta de novo sozinho.',
  };
  const SESSAO_MORTA = new Set(['TOKEN_EXPIRED', 'INVALID_REFRESH_TOKEN', 'INVALID_ID_TOKEN', 'USER_NOT_FOUND', 'USER_DISABLED']);

  class Erro extends Error {
    constructor(msg, code, status) { super(msg); this.code = code; this.status = status; }
  }

  async function call(url, opts) {

    try { res = await fetch(url, opts); } catch (e) { throw new Erro('Sem conexão com a internet.', 'OFFLINE', 0); }

    let body = null;
    try { body = txt ? JSON.parse(txt) : null; } catch (e) { body = null; }
    if (!res.ok) {
      const err = (Array.isArray(body) ? body[0] && body[0].error : body && body.error) || {};

    i: x => ({ integerValue: String(Math.round(Number(x) || 0)) }),
    b: x => ({ booleanValue: !!x }),
  };
  const ler = {
    n: f => (f ? Number(f.integerValue ?? f.doubleValue ?? 0) : 0),
    s: f => (f && f.stringValue) || '',
    b: f => !!(f && f.booleanValue),
    t: f => (f && f.timestampValue) || '',
  };
  function decode(doc) {
    const f = doc.fields || {};

    return {
      id: decodeURIComponent(String(doc.name || '').split('/').pop()), name: doc.name,
      numero: ler.n(f.numero), atualizadoEm: ler.n(f.atualizadoEm), excluido: ler.b(f.excluido),

    if (!/^[A-Za-z0-9_-]{20,}$/.test(apiKey)) return 'A apiKey parece incompleta. Copie o bloco firebaseConfig de novo.';
    if (!/^[a-z0-9][a-z0-9-]{3,}$/.test(projectId)) return 'O projectId parece errado. Copie o bloco firebaseConfig de novo.';

    const nome = (col, id) => `projects/${st.projectId}/databases/(default)/documents/${col}/${id}`;

    async function token(force) {

        expiresAt: Date.now() + (Number(b.expiresIn) || 3600) * 1000, membro: null, motivo: '', lastPull: '', ultimoEnvio: 0,
      };

      await verificarMembro();

    async function verificarMembro() {

        await fs(`/membros/${encodeURIComponent(st.uid)}`);

  async function resolverNumerosRepetidos() {
    const grupos = new Map();
    S.orders.forEach(o => { const g = grupos.get(o.numero) || []; g.push(o); grupos.set(o.numero, g); });
    for (const g of grupos.values()) {
      let resto = g.length;
      for (const o of g) {
        if (resto < 2) break;
        if (!Sync.pend.has(o.id)) continue;
        const antigo = o.numero;
        o.numero = nextNumber();
        o.updatedAt = Date.now();
        await Store.putOrder(o);
        resto--;
        toast(`O pedido Nº ${U.fmtNum(antigo)} deste aparelho passou a ser Nº ${U.fmtNum(o.numero)}: outro aparelho já tinha usado esse número.`);
      }
    }
  }
  function redesenharDepoisDaNuvem() {
    if (document.querySelector('.modal-wrap')) return;
    if (S.route === 'pedidos') {
      const q = $('#q');
      if (q && document.activeElement === q) { const s = $('#slips'); if (s) s.innerHTML = slipsHtml(); } else viewList();
    } else if (S.route === 'pedido') {
      if (byId(S.currentId)) viewDetail(S.currentId); else go('#/pedidos');
    }
  }
  async function puxarRapido() {
    if (!nuvemOk() || navigator.onLine === false) return;
    try { await Promise.race([trazerNovidades(), new Promise(r => setTimeout(r, 2500))]); } catch (e) { /* segue com o número deste aparelho */ }
  }
  // Primeira conexão neste aparelho: traz o que está na nuvem e manda o que só existe aqui.
  async function conectarNuvem() {
    setSync('enviando');
    try {
      const docs = await Sync.s.todos();
      await aplicarRemotos(docs, false);
      const remoto = new Map(docs.map(d => [d.id, d.atualizadoEm]));
      S.orders.forEach(o => { if (!remoto.has(o.id) || (o.updatedAt || 0) > remoto.get(o.id)) Sync.pend.add(o.id); });
      let maxT = '';
      docs.forEach(d => { if (NUVEM.tempo(d.servidorEm) > NUVEM.tempo(maxT)) maxT = d.servidorEm; });
      if (maxT) await Sync.s.marcarLeitura(maxT);
      const c = await Sync.s.lerDoc('ajustes', 'empresa');
      if (c && c.atualizadoEm > (S.cfg.updatedAt || 0)) await aplicarAjustes(c, true); else Sync.cfgPend = true;
      persistSync();
    } catch (e) { tratarErroNuvem(e); return false; }
    return sincronizar();
  }

  /* ---------- PIX, mensagens e arquivos ---------- */
  function pixCodeFor(o) {
    const v = U.pixValue(o), c = S.cfg;
    if (!v || !String(c.pixChave || '').trim()) return '';
    return PIX.payload({ tipo: c.pixTipo, chave: c.pixChave, nome: c.pixNome || c.nome, cidade: c.pixCidade, valorCentavos: v, descricao: 'Pedido ' + U.fmtNum(o.numero) });
  }
  const pixAvailable = o => o.status !== 'cancelado' && !!pixCodeFor(o);

  // Nome para a saudação: "Maria Souza" vira "Maria"; "Escola X (Ana)" vira "Ana"; nome de instituição sem contato fica sem nome.
  const ORG_PREFIX = /^(associa|condom|funda[cç]|cooperativ|sindicat|universidad|faculdad|transportador|construtor|supermercad)/i;
  const ORG_WORD = /^(escola|col[eé]gio|creche|igreja|time|clube|empresa|loja|grupo|academia|cl[ií]nica|hospital|restaurante|mercado|farm[aá]cia|prefeitura|secretaria|instituto|centro|projeto|equipe|banda|par[oó]quia|ong|oficina|ateli[eê]|est[uú]dio)(?=[\s,.()-]|$)/i;
  function greetName(nome) {
    const n = String(nome || '').trim();
    const par = n.match(/\(([^)]+)\)/);
    if (par) return par[1].trim().split(/\s+/)[0];
    if (!n || ORG_PREFIX.test(n) || ORG_WORD.test(n)) return '';
    return n.split(/\s+/)[0];
  }
  function msgText(o, plain = false) {
    const c = S.cfg, t = U.totals(o);
    const b = s => (plain ? s : `*${s}*`);
    const first = greetName(o.cliente && o.cliente.nome);
    const L = [];
    L.push(`Olá${first ? ', ' + first : ''}! Segue o seu pedido na ${U.companyName(c) || 'nossa empresa'}.`);
    L.push('');
    L.push(`${b('Pedido Nº ' + U.fmtNum(o.numero))} (${U.fmtDate(o.data)})`);
    (o.itens || []).filter(validItem).forEach(it => {
      const tot = U.itemTotal(it);
      L.push(`• ${U.fmtQty(it.qtd) || '1'} x ${String(it.desc || 'Item').trim()}${tot ? ' = ' + U.money(tot) : ''}`);
    });
    L.push('');
    if (t.desc > 0) { L.push(`Subtotal: ${U.money(t.sub)}`); L.push(`Desconto: ${U.money(t.desc)}`); }
    L.push(b(`Total: ${U.money(t.total)}`));
    if (t.pago > 0) {
      L.push(`Pago: ${U.money(Math.min(t.pago, t.total))}`);
      L.push(t.rest > 0 ? b(`Falta pagar: ${U.money(t.rest)}`) : b('Pedido quitado.'));
    }
    if (o.prazo) L.push(`Prazo de entrega: ${U.fmtDate(o.prazo)}`);
    if (String(o.obs || '').trim()) { L.push(''); L.push(`Obs.: ${String(o.obs).trim()}`); }
    const pv = U.pixValue(o);
    if (o.status !== 'cancelado' && String(c.pixChave || '').trim() && pv > 0) {
      L.push('');
      L.push(`Para pagar ${U.money(pv)} com PIX:`);
      L.push(`Chave PIX (${(U.PIX_TIPOS[c.pixTipo] || '').toLowerCase()}): ${c.pixChave}${c.pixNome ? ` (${c.pixNome})` : ''}`);
      const code = pixCodeFor(o);
      if (c.incluirCopiaCola && code) {
        L.push('Ou copie o código abaixo e cole no app do banco, em Pix copia e cola:');
        L.push(code);
      }
    }
    if (String(c.mensagemFinal || '').trim()) { L.push(''); L.push(String(c.mensagemFinal).trim()); }
    return L.join('\n');
  }

  const fileBase = o => `Pedido-${U.fmtNum(o.numero)}${o.cliente && o.cliente.nome ? '-' + U.slug(o.cliente.nome) : ''}`;
  function pdfImages(o) {
    const out = {};
    if (S.cfg.logo && S.cfg.logo.src) { const j = DOC.jpegFromDataUrl(S.cfg.logo.src); if (j) out.logo = j; }
    if (o.assinatura && o.assinatura.src) { const j = DOC.jpegFromDataUrl(o.assinatura.src); if (j) out.sig = j; }
    return out;
  }
  function makePdf(o) {
    const { pages } = DOC.layout(o, S.cfg);
    const bytes = DOC.pdf(pages, { title: `Pedido ${U.fmtNum(o.numero)} - ${S.cfg.nome || ''}`, author: U.companyName(S.cfg) }, pdfImages(o));
    return new File([bytes], fileBase(o) + '.pdf', { type: 'application/pdf' });
  }
  function imgFor(src) {
    if (!src) return null;
    if (!S.imgs[src]) { const im = new Image(); im.src = src; S.imgs[src] = im; }
    return S.imgs[src];
  }
  async function docImages(o) {
    const out = {};
    for (const [k, src] of [['logo', S.cfg.logo && S.cfg.logo.src], ['sig', o.assinatura && o.assinatura.src]]) {
      if (!src) continue;
      const im = imgFor(src);
      try { await im.decode(); out[k] = im; } catch (e) { /* imagem com problema: segue sem ela */ }
    }
    return out;
  }
  function docImagesSync(o) {
    const out = {};
    for (const [k, src] of [['logo', S.cfg.logo && S.cfg.logo.src], ['sig', o.assinatura && o.assinatura.src]]) {
      const im = src && imgFor(src);
      if (im && im.complete && im.naturalWidth) out[k] = im;
    }
    return out;
  }
  function dataUrlToBytes(u) {
    const bin = atob(String(u).split(',')[1] || '');
    const a = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  function makePngs(o) {
    const { pages } = DOC.layout(o, S.cfg);
    const imgs = docImagesSync(o), sc = 2;
    return pages.map((ops, i) => {
      const cv = document.createElement('canvas');
      cv.width = Math.round(DOC.PAGE.w * sc);
      cv.height = Math.round(DOC.PAGE.h * sc);
      DOC.drawCanvas(cv.getContext('2d'), ops, sc, imgs);
      return new File([dataUrlToBytes(cv.toDataURL('image/png'))], `${fileBase(o)}${pages.length > 1 ? '-pagina-' + (i + 1) : ''}.png`, { type: 'image/png' });
    });
  }
  function downloadFile(file) {
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url;
    a.download = file.name;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }
  const canShare = files => { try { return !!(navigator.canShare && navigator.share && navigator.canShare({ files })); } catch (e) { return false; } };
  const canShareFiles = () => canShare([new File(['%PDF-1.4'], 'teste.pdf', { type: 'application/pdf' })]);
  async function copyText(s) {
    try { await navigator.clipboard.writeText(s); return true; } catch (e) { /* tenta o jeito antigo */ }
    const ta = document.createElement('textarea');
    ta.value = s;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }
  function openUrl(url) {
    const w = window.open(url, '_blank');
    if (w) { try { w.opener = null; } catch (e) { /* ok */ } } else location.href = url;
  }
  async function logEnvio(o, canal) {
    o.envios = (o.envios || []).concat({ canal, em: Date.now() }).slice(-20);
    try { await saveOrder(o); } catch (e) { /* não impede o envio */ }
    const box = $('#envios');
    if (box) box.innerHTML = enviosHtml(o);
  }

  /* ---------- avisos e janelas ---------- */
  function toast(msg, kind = '') {
    const el = $('#toast');
    el.textContent = msg;
    el.className = 'toast show ' + kind;
    clearTimeout(toast.t);
    toast.t = setTimeout(() => { el.className = 'toast'; }, 3400);
  }
  function modal({ title, body = '', actions = [], wide = false, onOpen }) {
    return new Promise(resolve => {
      const wrap = document.createElement('div');
      wrap.className = 'modal-wrap';
      wrap.innerHTML = `<div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="m-title">
        <div class="modal-head"><h2 id="m-title">${esc(title)}</h2><button type="button" class="icon-btn" data-close aria-label="Fechar">${I.x}</button></div>
        <div class="modal-body">${body}</div>
        ${actions.length ? `<div class="modal-actions">${actions.map((a, i) => `<button type="button" class="btn ${a.kind || ''}" data-i="${i}">${a.label}</button>`).join('')}</div>` : ''}
      </div>`;
      document.body.appendChild(wrap);
      const prev = document.activeElement;
      let done = false;
      const close = v => {
        if (done) return;
        done = true;
        wrap.remove();
        document.removeEventListener('keydown', onKey);
        try { prev && prev.focus && prev.focus({ preventScroll: true }); } catch (e) { /* ok */ }
        resolve(v === undefined ? null : v);
      };
      const onKey = e => { if (e.key === 'Escape') close(null); };
      document.addEventListener('keydown', onKey);
      wrap.addEventListener('mousedown', e => { if (e.target === wrap) close(null); });
      wrap.addEventListener('click', async e => {
        if (e.target.closest('[data-close]')) return close(null);
        const b = e.target.closest('[data-i]');
        if (!b) return;
        const a = actions[+b.dataset.i];
        if (a.onClick) {
          const r = await a.onClick(wrap);
          if (r === false) return;
          close(r === undefined ? a.value : r);
        } else close(a.value);
      });
      if (onOpen) onOpen(wrap, close);
      requestAnimationFrame(() => {
        wrap.classList.add('in');
        const f = wrap.querySelector('[autofocus]') || (coarse() ? null : wrap.querySelector('input:not([type=checkbox]), select, textarea')) || wrap.querySelector('.modal-actions .btn.primary') || wrap.querySelector('[data-close]');
        if (f) f.focus({ preventScroll: true });
      });
    });
  }
  const confirmBox = (title, text, ok = 'Confirmar', danger = false) =>
    modal({ title, body: `<p>${text}</p>`, actions: [{ label: 'Voltar', value: false }, { label: ok, value: true, kind: danger ? 'danger-solid' : 'primary' }] }).then(v => !!v);

  function showErr(el, msg) {
    if (!el) return toast(msg, 'err');
    clearErr(el);
    el.setAttribute('aria-invalid', 'true');
    const s = document.createElement('small');
    s.className = 'err';
    s.textContent = msg;
    (el.closest('.fld') || el.parentElement).appendChild(s);
    el.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'center' });
    el.focus({ preventScroll: true });
  }
  function clearErr(el) {
    if (!el || !el.hasAttribute('aria-invalid')) return;
    el.removeAttribute('aria-invalid');
    const s = (el.closest('.fld') || el.parentElement).querySelector('.err');
    if (s) s.remove();
  }

  /* ---------- marca no topo ---------- */
  function updateBrand() {
    const c = S.cfg;
    $('#brand-name').textContent = c.nome || 'Pedidos';
    $('#brand-mark').innerHTML = c.logo && c.logo.src ? `<img src="${esc(c.logo.src)}" alt="">` : esc(U.initials(c.nome, c.atividade));
  }

  /* ---------- rotas ---------- */
  function route() {
    const raw = location.hash.replace(/^#\/?/, '');
    const [path, qs] = raw.split('?');
    const [name, id] = path.split('/');
    S.dirty = false;
    const r = ['novo', 'editar', 'pedido', 'ajustes'].includes(name) ? name : 'pedidos';
    S.route = r;
    document.body.className = 'r-' + (r === 'novo' || r === 'editar' ? 'form' : r);
    const cur = { pedidos: 'pedidos', pedido: 'pedidos', editar: 'pedidos', novo: 'novo', ajustes: 'ajustes' }[r];
    $$('.tabs a').forEach(a => { if (a.dataset.nav === cur) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    window.scrollTo(0, 0);
    if (r === 'novo') viewForm(null);
    else if (r === 'editar') viewForm(id);
    else if (r === 'pedido') viewDetail(id, qs === 'enviar');
    else if (r === 'ajustes') {
      const fb = new URLSearchParams(qs || '').get('fb');
      if (fb) {
        try { const c = JSON.parse(unb64u(fb)); S.fbPrefill = `apiKey: "${c.apiKey}",\nprojectId: "${c.projectId}"`; } catch (e) { toast('Link de configuração inválido.', 'err'); }
        history.replaceState(null, '', '#/ajustes');
      }
      viewSettings();
      if (fb && S.fbPrefill) setTimeout(() => { const b = $('#nuvem-box'); if (b) b.scrollIntoView({ block: 'start' }); toast('Configuração do backup recebida. Agora entre com e-mail e senha.'); }, 60);
    } else viewList();
  }
  async function navGuard(e) {
    const a = e.target.closest && e.target.closest('a[href^="#/"]');
    if (!a || !S.dirty) return;
    e.preventDefault();
    e.stopPropagation();
    if (await confirmBox('Sair sem salvar?', 'As alterações deste pedido ainda não foram salvas.', 'Sair sem salvar', true)) {
      S.dirty = false;
      go(a.getAttribute('href'));
    }
  }

  /* ---------- lista de pedidos ---------- */
  const FILTERS = [
    { id: 'andamento', label: 'Em andamento', fn: o => ['aberto', 'producao', 'pronto'].includes(o.status) },
    { id: 'atrasados', label: 'Atrasados', fn: o => isLate(o) },
    { id: 'receber', label: 'A receber', fn: o => o.status !== 'cancelado' && U.totals(o).rest > 0 },
    { id: 'entregues', label: 'Entregues', fn: o => o.status === 'entregue' },
    { id: 'todos', label: 'Todos', fn: () => true },
  ];
  const curFilter = () => FILTERS.find(x => x.id === S.filter) || FILTERS[0];

  function listOrders() {
    const f = curFilter();
    let arr = S.orders.filter(f.fn);
    const q = U.norm(S.q);
    if (q) {
      const num = q.replace(/[\s()\-.#nº°]/g, '');
      const numeric = /^\d+$/.test(num);
      arr = arr.filter(o => {
        if (numeric && (String(o.numero).includes(String(Number(num))) || U.digits(o.cliente && o.cliente.telefone).includes(num))) return true;
        const hay = U.norm([o.cliente && o.cliente.nome, o.cliente && o.cliente.email, o.cliente && o.cliente.endereco, o.obs, ...(o.itens || []).map(i => i.desc)].join(' '));
        return hay.includes(q);
      });
    }
    const byPrazo = f.id === 'andamento' || f.id === 'atrasados';
    arr.sort((a, b) => (byPrazo ? (a.prazo || '9999-99-99').localeCompare(b.prazo || '9999-99-99') || a.numero - b.numero : b.numero - a.numero));
    return arr;
  }
  function itemsSummary(o) {
    const its = (o.itens || []).filter(validItem);
    if (!its.length) return 'Sem itens';
    const q = its.reduce((a, i) => a + (Number(i.qtd) || 0), 0);
    return `${U.fmtQty(q)} ${q === 1 ? 'peça' : 'peças'}: ${its.map(i => String(i.desc || '').trim()).filter(Boolean).join(', ')}`;
  }
  function slip(o) {
    const t = U.totals(o), st = U.STATUS[o.status] || U.STATUS.aberto;
    const pay = o.status === 'cancelado' || !t.total ? '' : t.rest > 0 ? `<span class="due">falta ${U.money(t.rest)}</span>` : '<span class="paid">pago</span>';
    const when = o.status === 'entregue' ? `Entregue em ${U.fmtDate(o.recebidoEm) || '—'}`
      : o.status === 'cancelado' ? 'Cancelado'
      : o.prazo ? (isLate(o) ? `<span class="late">Atrasado desde ${U.fmtDate(o.prazo)}</span>` : `Entrega em ${U.fmtDate(o.prazo)}`) : 'Sem prazo';
    return `<a class="slip" href="#/pedido/${esc(o.id)}">
      <span class="slip-top"><span class="slip-num">Nº ${U.fmtNum(o.numero)}</span><span class="slip-date">${U.fmtDate(o.data)}</span><span class="pill st-${esc(o.status)}">${st.label}</span></span>
      <span class="slip-client">${esc((o.cliente && o.cliente.nome) || 'Sem nome')}</span>
      <span class="slip-items">${esc(itemsSummary(o))}</span>
      <span class="slip-foot"><span>${when}</span><span class="slip-money"><strong>${U.money(t.total)}</strong>${pay}</span></span>
    </a>`;
  }
  function slipsHtml() {
    if (!S.orders.length) {
      return `<div class="empty"><h2>Nenhum pedido ainda</h2><p>Cada pedido salvo fica guardado aqui, como a via amarela do talão. A via do cliente você manda por WhatsApp ou e-mail.</p><a class="btn primary" href="#/novo">${I.plus}Criar o primeiro pedido</a></div>`;
    }
    const arr = listOrders();
    if (!arr.length) {
      return `<div class="empty"><p>${S.q ? `Nenhum pedido encontrado para “${esc(S.q)}”.` : `Nenhum pedido em “${esc(curFilter().label)}”.`}</p>${S.filter !== 'todos' ? '<button type="button" class="btn" data-act="todos">Ver todos os pedidos</button>' : ''}</div>`;
    }
    return `<div class="slips">${arr.map(slip).join('')}</div>`;
  }
  function summaryHtml() {
    if (!S.orders.length) return '';
    const and = S.orders.filter(FILTERS[0].fn).length, late = S.orders.filter(isLate).length;
    const rec = S.orders.filter(o => o.status !== 'cancelado').reduce((a, o) => a + U.totals(o).rest, 0);
    let s = and === 0 ? 'Nenhum pedido em andamento' : and === 1 ? '1 pedido em andamento' : `${and} pedidos em andamento`;
    if (late) s += `, <b class="late">${late === 1 ? '1 atrasado' : late + ' atrasados'}</b>`;
    s += '. ' + (rec > 0 ? `A receber: <b>${U.money(rec)}</b>.` : 'Nada a receber.');
    return `<p class="summary">${s}</p>`;
  }
  function banners() {
    const b = [];
    if (S.mode === 'memory') b.push('<div class="banner warn">Este navegador não está deixando salvar dados aqui. O que você cadastrar some ao fechar a página. Abra o app pelo endereço publicado para usar de verdade.</div>');
    if (!S.cfg.conferido) b.push('<div class="banner">Antes do primeiro envio, confira os dados da empresa e a chave PIX. <a href="#/ajustes">Conferir ajustes</a></div>');
    else if (!nuvemOk() && S.orders.length >= 3 && (!S.cfg.ultimoBackup || Date.now() - S.cfg.ultimoBackup > 7 * 864e5)) {
      const days = S.cfg.ultimoBackup ? Math.floor((Date.now() - S.cfg.ultimoBackup) / 864e5) : 0;
      b.push(`<div class="banner">${S.cfg.ultimoBackup ? `Seu último backup foi há ${days} dias.` : 'Você ainda não fez backup dos pedidos.'} Eles ficam só neste aparelho. <button type="button" class="link" data-act="backup">Fazer backup agora</button> ou <a href="#/ajustes">ligue o backup na nuvem</a>.</div>`);
    }

  }
  function viewList() {
    setTitle('Pedidos');
    const f = curFilter();
    const page = mount(`
      ${banners()}
      <h1 class="sr-only">Pedidos</h1>
      ${summaryHtml()}
      ${nuvemLigada() ? `<p class="nuvem-linha" id="nuvem-status" aria-live="polite">${linhaNuvemLista()}</p>` : ''}
      ${S.orders.length ? `<label class="search">${I.search}<span class="sr-only">Buscar pedidos</span><input id="q" type="search" enterkeyhint="search" placeholder="Buscar por cliente, nº, telefone ou item" value="${esc(S.q)}" autocomplete="off"></label>
      <div class="chips" role="group" aria-label="Filtrar pedidos">${FILTERS.map(x => `<button type="button" class="chip${x.id === f.id ? ' on' : ''}" data-f="${x.id}" aria-pressed="${x.id === f.id}">${x.label} <span class="n">${S.orders.filter(x.fn).length}</span></button>`).join('')}</div>` : ''}
      <div id="slips">${slipsHtml()}</div>`);
    const q = $('#q', page);
    if (q) q.addEventListener('input', () => { S.q = q.value; $('#slips', page).innerHTML = slipsHtml(); });
    page.addEventListener('click', e => {
      const chip = e.target.closest('[data-f]');
      if (chip) {
        S.filter = chip.dataset.f;
        viewList();
        const c = $(`[data-f="${S.filter}"]`);
        if (c) {
          c.focus({ preventScroll: true });
          const bar = c.parentElement;
          bar.scrollLeft = Math.max(0, c.offsetLeft - (bar.clientWidth - c.offsetWidth) / 2);
        }
        return;
      }
      const b = e.target.closest('[data-act]');
      if (!b) return;
      if (b.dataset.act === 'todos') { S.filter = 'todos'; viewList(); }
      if (b.dataset.act === 'backup') exportBackup();
    });
  }

  /* ---------- formulário (novo / editar) ---------- */
  function itemRow(it, i) {
    return `<div class="item" data-i="${i}">
      <label class="fld i-q"><span>Quant.</span><input name="qtd" inputmode="decimal" enterkeyhint="next" value="${it.qtd ? esc(U.fmtQty(it.qtd)) : ''}" placeholder="0"></label>
      <label class="fld i-d"><span>Discriminação</span><input name="desc" list="dl-itens" enterkeyhint="next" value="${esc(it.desc)}" placeholder="Ex.: camisa polo piquê azul-marinho, tam. M"></label>
      <label class="fld i-u"><span>Vl. unit.</span><input name="unit" inputmode="decimal" enterkeyhint="next" value="${it.unit ? U.money2(it.unit) : ''}" placeholder="0,00"></label>
      <div class="i-t"><span>Vl. total</span><output>${U.money(U.itemTotal(it))}</output></div>
      <button type="button" class="icon-btn i-x" data-act="rm-item" aria-label="Remover item ${i + 1}">${I.trash}</button>

  const sigRowHtml = d => (d.assinatura && d.assinatura.src
    ? `<img class="sig-img" src="${esc(d.assinatura.src)}" alt="Assinatura de quem recebeu"><div class="btn-row"><button type="button" class="btn sm" data-act="sign">${I.pen}Assinar de novo</button><button type="button" class="btn sm ghost" data-act="rm-sign">Remover assinatura</button></div>`
    : `<button type="button" class="btn" data-act="sign">${I.pen}Coletar assinatura</button><p class="hint">A pessoa assina com o dedo na tela. A assinatura sai no campo “Recebido por”.</p>`);

  function updateSums(f, d) {
    const t = U.totals(d);
    $('#sum-total', f).textContent = U.money(t.total);
    let note = '';
    if (t.pago > t.total && t.total > 0) note = 'O valor pago está maior que o total';
    else if (t.pago > 0) note = t.rest > 0 ? `Falta ${U.money(t.rest)}` : 'Quitado';
    else if (t.desc > 0) note = `Com ${U.money(t.desc)} de desconto`;
    const n = $('#sum-note', f);
    n.textContent = note;
    n.classList.toggle('bad', t.pago > t.total && t.total > 0);
    const pv = $('[name=pixValor]', f);
    if (pv) pv.placeholder = t.rest > 0 ? `${U.money2(t.rest)} (o que falta)` : '';

    </form>`);
    const f = $('#f', page);
    const touched = () => {
      if (editing) S.dirty = true;
      else { S.drafts.novo = d; persistDrafts(); }
    };
    const renderItems = () => { $('#items', f).innerHTML = d.itens.map(itemRow).join(''); };

    f.addEventListener('input', e => {
      const el = e.target, name = el.name;
      if (!name) return;
      const row = el.closest('.item');
      if (row) {
        const it = d.itens[+row.dataset.i];
        if (!it) return;
        if (name === 'qtd') it.qtd = U.parseQty(el.value);
        else if (name === 'unit') it.unit = U.parseMoney(el.value);
        else if (name === 'desc') {
          it.desc = el.value;
          const k = cat.get(U.norm(el.value));
          if (k && k.unit && !it.unit) { it.unit = k.unit; $('[name=unit]', row).value = U.money2(k.unit); }
        }
        $('output', row).textContent = U.money(U.itemTotal(it));
      } else if (name.startsWith('c.')) {
        d.cliente[name.slice(2)] = el.value;
        if (name === 'c.nome') {
          const k = cli.get(U.norm(el.value));
          if (k) ['telefone', 'email', 'endereco'].forEach(fl => {
            if (!String(d.cliente[fl] || '').trim() && k[fl]) {
              d.cliente[fl] = k[fl];
              $(`[name="c.${fl}"]`, f).value = fl === 'telefone' ? U.fmtPhone(k[fl]) : k[fl];

          });
        }
      } else if (name === 'desconto' || name === 'pago' || name === 'pixValor') d[name] = U.parseMoney(el.value);
      else if (el.type === 'checkbox') d[name] = el.checked;
      else d[name] = el.value;
      clearErr(el);
      updateSums(f, d);
      touched();
    });
    f.addEventListener('focusout', e => {
      const el = e.target;
      if (['unit', 'desconto', 'pago', 'pixValor'].includes(el.name)) { const v = U.parseMoney(el.value); el.value = v ? U.money2(v) : ''; }
      else if (el.name === 'qtd') { const v = U.parseQty(el.value); el.value = v ? U.fmtQty(v) : ''; }
      else if (el.name === 'c.telefone' && el.value.trim()) el.value = U.fmtPhone(el.value);
    });
    f.addEventListener('keydown', e => {
      if (e.key !== 'Enter' || e.target.tagName !== 'INPUT' || e.target.type === 'checkbox') return;
      e.preventDefault();
      const row = e.target.closest('.item');
      if (row && e.target.name === 'unit' && !row.nextElementSibling) { $('[data-act=add-item]', f).click(); return; }
      const els = $$('input, select, textarea', f).filter(x => !x.disabled && x.offsetParent !== null);
      const i = els.indexOf(e.target);
      if (i >= 0 && els[i + 1]) els[i + 1].focus();
    });
    f.addEventListener('click', async e => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const act = b.dataset.act;
      if (act === 'add-item') {
        d.itens.push(blankItem());
        renderItems();
        updateSums(f, d);
        const last = $$('.item', f).pop();
        $('[name=desc]', last).focus();
        touched();
      } else if (act === 'rm-item') {
        d.itens.splice(+b.closest('.item').dataset.i, 1);
        if (!d.itens.length) d.itens.push(blankItem());
        renderItems();
        updateSums(f, d);
        touched();
      } else if (act === 'discard') {
        delete S.drafts.novo;
        await Store.setKV('drafts', S.drafts).catch(() => {});
        viewForm(null);
      } else if (act === 'save-send') saveForm(d, editing, true);
      else if (act === 'sign') {
        const sig = await signatureModal();
        if (sig) {
          d.assinatura = sig;
          if (!d.recebidoEm) { d.recebidoEm = U.isoLocal(); $('[name=recebidoEm]', f).value = d.recebidoEm; }
          if (!d.recebidoPor && d.cliente.nome) { d.recebidoPor = d.cliente.nome; $('[name=recebidoPor]', f).value = d.recebidoPor; }
          $('#sig-row', f).innerHTML = sigRowHtml(d);
          touched();
        }
      } else if (act === 'rm-sign') {
        d.assinatura = null;
        $('#sig-row', f).innerHTML = sigRowHtml(d);
        touched();
      }
    });
    f.addEventListener('submit', e => { e.preventDefault(); saveForm(d, editing, false); });
    updateSums(f, d);
    if (!editing && !restored && !coarse()) setTimeout(() => { const n = $('[name="c.nome"]', f); if (n) n.focus(); }, 30);
  }

  async function saveForm(d, editing, andSend) {
    const f = $('#f');
    d.cliente.nome = String(d.cliente.nome || '').trim();
    if (!d.cliente.nome) return showErr($('[name="c.nome"]', f), 'Escreva o nome de quem está fazendo o pedido.');
    const its = d.itens.filter(validItem);
    if (!its.length) return showErr($('[name=desc]', f), 'Adicione pelo menos um item com a discriminação.');
    d.itens = its.map(it => ({ qtd: Number(it.qtd) || 0, desc: String(it.desc || '').trim(), unit: Number(it.unit) || 0 }));
    d.cliente.telefone = String(d.cliente.telefone || '').trim();
    d.cliente.email = String(d.cliente.email || '').trim();
    const isNew = !editing;
    if (isNew) {
      await puxarRapido();
      d.numero = nextNumber();
      d.createdAt = Date.now();
      S.cfg.proximoNumero = d.numero + 1;
      await saveCfg().catch(() => {});
    }
    if (d.status === 'entregue' && !d.recebidoEm) d.recebidoEm = U.isoLocal();
    try { await saveOrder(d); } catch (err) { return toast('Não foi possível salvar neste aparelho. Veja se há espaço livre.', 'err'); }
    if (isNew) { delete S.drafts.novo; await Store.setKV('drafts', S.drafts).catch(() => {}); }
    S.dirty = false;
    requestPersist();
    toast(isNew ? `Pedido Nº ${U.fmtNum(d.numero)} salvo` : 'Alterações salvas');
    go(`#/pedido/${d.id}${andSend ? '?enviar' : ''}`);
  }

  /* ---------- assinatura ---------- */
  function makePad(canvas) {
    const ctx = canvas.getContext('2d');
    let has = false, drawing = false, last = null, w = 1, h = 1, dpr = 1, bb = null;
    const setup = () => {
      const r = canvas.getBoundingClientRect();
      dpr = Math.min(window.devicePixelRatio || 1, 3);
      w = Math.max(1, r.width);
      h = Math.max(1, r.height);
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#0b1f5c';
      ctx.lineWidth = 2.6;
      has = false;
      bb = null;
    };
    setup();
    const pos = e => { const r = canvas.getBoundingClientRect(); return { x: ((e.clientX - r.left) * w) / r.width, y: ((e.clientY - r.top) * h) / r.height }; };
    const grow = p => { bb = bb ? { x0: Math.min(bb.x0, p.x), y0: Math.min(bb.y0, p.y), x1: Math.max(bb.x1, p.x), y1: Math.max(bb.y1, p.y) } : { x0: p.x, y0: p.y, x1: p.x, y1: p.y }; };
    canvas.addEventListener('pointerdown', e => {
      e.preventDefault();
      drawing = true;
      has = true;
      last = pos(e);
      grow(last);
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }
      ctx.beginPath();
      ctx.arc(last.x, last.y, 1.3, 0, Math.PI * 2);
      ctx.fillStyle = '#0b1f5c';
      ctx.fill();
    });
    canvas.addEventListener('pointermove', e => {
      if (!drawing) return;
      e.preventDefault();
      const p = pos(e);
      ctx.beginPath();
      ctx.moveTo(last.x, last.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      last = p;
      grow(p);
    });
    const end = () => { drawing = false; };
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => canvas.addEventListener(ev, end));
    return {
      isEmpty: () => !has,
      clear: setup,
      toJpeg: () => {
        const pad = 10;
        const x0 = Math.max(0, bb.x0 - pad), y0 = Math.max(0, bb.y0 - pad), x1 = Math.min(w, bb.x1 + pad), y1 = Math.min(h, bb.y1 + pad);
        const cw = Math.max(20, x1 - x0), ch = Math.max(10, y1 - y0);
        const k = Math.min(3, 600 / cw);
        const out = document.createElement('canvas');
        out.width = Math.round(cw * k);
        out.height = Math.round(ch * k);
        const o2 = out.getContext('2d');
        o2.fillStyle = '#fff';
        o2.fillRect(0, 0, out.width, out.height);
        o2.drawImage(canvas, x0 * dpr, y0 * dpr, cw * dpr, ch * dpr, 0, 0, out.width, out.height);
        return { src: out.toDataURL('image/jpeg', 0.88), w: out.width, h: out.height };
      },
    };
  }
  function signatureModal() {
    return modal({
      title: 'Assinatura de quem recebeu',
      wide: true,
      body: '<p class="muted">Peça para a pessoa assinar com o dedo dentro do quadro.</p><div class="sigpad"><canvas id="sigc" aria-label="Área para assinar"></canvas></div><button type="button" class="link" id="sig-clear">Limpar e assinar de novo</button>',
      actions: [{ label: 'Cancelar', value: null }, { label: 'Usar esta assinatura', kind: 'primary', onClick: w => { if (w._pad.isEmpty()) { toast('Assine dentro do quadro branco.'); return false; } return w._pad.toJpeg(); } }],
      onOpen: w => { w._pad = makePad($('#sigc', w)); $('#sig-clear', w).onclick = () => w._pad.clear(); },
    });
  }
  async function deliveryModal(o) {
    const res = await modal({
      title: 'Registrar entrega',
      wide: true,
      body: `<div class="row2">
          <label class="fld"><span>Recebido por</span><input id="dv-n" value="${esc(o.recebidoPor || (o.cliente && o.cliente.nome) || '')}" autocapitalize="words"></label>
          <label class="fld"><span>Dia</span><input id="dv-d" type="date" value="${esc(o.recebidoEm || U.isoLocal())}"></label>
        </div>
        <div class="fld"><span>Assinatura (opcional)</span><div class="sigpad"><canvas id="dv-c" aria-label="Área para assinar"></canvas></div><button type="button" class="link" id="dv-clear">Limpar assinatura</button></div>`,
      actions: [{ label: 'Cancelar', value: null }, {
        label: 'Confirmar entrega', kind: 'primary', onClick: w => {
          const n = $('#dv-n', w).value.trim();
          if (!n) { showErr($('#dv-n', w), 'Escreva quem recebeu.'); return false; }
          return { n, d: $('#dv-d', w).value || U.isoLocal(), sig: w._pad.isEmpty() ? null : w._pad.toJpeg() };
        },
      }],
      onOpen: w => { w._pad = makePad($('#dv-c', w)); $('#dv-clear', w).onclick = () => w._pad.clear(); },
    });
    if (!res) return false;
    o.status = 'entregue';
    o.recebidoPor = res.n;
    o.recebidoEm = res.d;
    if (res.sig) o.assinatura = res.sig;
    return true;
  }

  /* ---------- detalhe do pedido ---------- */
  function deliveryLine(o) {
    if (o.status === 'entregue') return `Entregue${o.recebidoEm ? ' em ' + U.fmtDate(o.recebidoEm) : ''}${o.recebidoPor ? ', recebido por ' + esc(o.recebidoPor) : ''}${o.assinatura ? ', com assinatura' : ''}.`;
    if (o.status === 'cancelado') return 'Pedido cancelado.';
    if (!o.prazo) return 'Sem prazo de entrega definido.';
    return isLate(o) ? `<span class="late">Atrasado: o prazo era ${U.fmtDate(o.prazo)}.</span>` : `Prazo de entrega: ${U.fmtDate(o.prazo)}.`;
  }
  function paymentsHtml(o) {
    const list = o.pagamentos || [];
    if (!list.length) return '';
    const before = (Number(o.pago) || 0) - list.reduce((a, p) => a + (Number(p.valor) || 0), 0);
    const rows = (before > 0 ? [`<li><span>No pedido</span><span>Sinal ou entrada</span><b>${U.money(before)}</b></li>`] : [])
      .concat(list.map(p => `<li><span>${U.fmtDate(p.data)}</span><span>${esc(p.forma)}</span><b>${U.money(p.valor)}</b></li>`));
    return `<ul class="pays">${rows.join('')}</ul>`;
  }
  const enviosHtml = o => (o.envios && o.envios.length
    ? `<p class="hint sent">Último envio: ${esc(o.envios[o.envios.length - 1].canal)}, ${U.fmtDateTime(o.envios[o.envios.length - 1].em)}.</p>` : '');

    const fileShare = canShareFiles();
    const page = mount(`
    <div class="detail">
