  }

  /* ---------- lista de pedidos ---------- */
  const FILTERS = [
    { id: 'andamento', label: 'Em andamento', fn: o => ['aberto', 'producao', 'pronto'].includes(o.status) },
    { id: 'atrasados', label: 'Atrasados', fn: o => isLate(o) },
    { id: 'receber', label: 'A receber', fn: o => o.status !== 'cancelado' && U.totals(o).rest > 0 },
    { id: 'entregues', label: 'Entregues', fn: o => o.status === 'entregue' },
    { id: 'todos', label: 'Todos', fn: () => true },
  ];
  const curFilter = () => FILTERS.find(x => x.id === S.filter) || FILTERS[0];

  function listOrders() {
    const f = curFilter();
    let arr = S.orders.filter(f.fn);
    const q = U.norm(S.q);
    if (q) {
      const num = q.replace(/[\s()\-.#nº°]/g, '');
      const numeric = /^\d+$/.test(num);
      arr = arr.filter(o => {
        if (numeric && (String(o.numero).includes(String(Number(num))) || U.digits(o.cliente && o.cliente.telefone).includes(num))) return true;
        const hay = U.norm([o.cliente && o.cliente.nome, o.cliente && o.cliente.email, o.cliente && o.cliente.endereco, o.obs, ...(o.itens || []).map(i => i.desc)].join(' '));
        return hay.includes(q);
      });
    }
    const byPrazo = f.id === 'andamento' || f.id === 'atrasados';
    arr.sort((a, b) => (byPrazo ? (a.prazo || '9999-99-99').localeCompare(b.prazo || '9999-99-99') || a.numero - b.numero : b.numero - a.numero));
    return arr;
  }
  function itemsSummary(o) {
    const its = (o.itens || []).filter(validItem);
    if (!its.length) return 'Sem itens';
    const q = its.reduce((a, i) => a + (Number(i.qtd) || 0), 0);
    return `${U.fmtQty(q)} ${q === 1 ? 'peça' : 'peças'}: ${its.map(i => String(i.desc || '').trim()).filter(Boolean).join(', ')}`;
  }
  function slip(o) {
    const t = U.totals(o), st = U.STATUS[o.status] || U.STATUS.aberto;
    const pay = o.status === 'cancelado' || !t.total ? '' : t.rest > 0 ? `<span class="due">falta ${U.money(t.rest)}</span>` : '<span class="paid">pago</span>';
    const when = o.status === 'entregue' ? `Entregue em ${U.fmtDate(o.recebidoEm) || '—'}`
      : o.status === 'cancelado' ? 'Cancelado'
      : o.prazo ? (isLate(o) ? `<span class="late">Atrasado desde ${U.fmtDate(o.prazo)}</span>` : `Entrega em ${U.fmtDate(o.prazo)}`) : 'Sem prazo';
    return `<a class="slip" href="#/pedido/${esc(o.id)}">
      <span class="slip-top"><span class="slip-num">Nº ${U.fmtNum(o.numero)}</span><span class="slip-date">${U.fmtDate(o.data)}</span><span class="pill st-${esc(o.status)}">${st.label}</span></span>
      <span class="slip-client">${esc((o.cliente && o.cliente.nome) || 'Sem nome')}</span>
      <span class="slip-items">${esc(itemsSummary(o))}</span>
      <span class="slip-foot"><span>${when}</span><span class="slip-money"><strong>${U.money(t.total)}</strong>${pay}</span></span>
    </a>`;
  }
  function slipsHtml() {
    if (!S.orders.length) {
      return `<div class="empty"><h2>Nenhum pedido ainda</h2><p>Cada pedido salvo fica guardado aqui, como a via amarela do talão. A via do cliente você manda por WhatsApp ou e-mail.</p><a class="btn primary" href="#/novo">${I.plus}Criar o primeiro pedido</a></div>`;
    }
    const arr = listOrders();
    if (!arr.length) {
      return `<div class="empty"><p>${S.q ? `Nenhum pedido encontrado para “${esc(S.q)}”.` : `Nenhum pedido em “${esc(curFilter().label)}”.`}</p>${S.filter !== 'todos' ? '<button type="button" class="btn" data-act="todos">Ver todos os pedidos</button>' : ''}</div>`;
    }
    return `<div class="slips">${arr.map(slip).join('')}</div>`;
  }
  function summaryHtml() {
    if (!S.orders.length) return '';
    const and = S.orders.filter(FILTERS[0].fn).length, late = S.orders.filter(isLate).length;
    const rec = S.orders.filter(o => o.status !== 'cancelado').reduce((a, o) => a + U.totals(o).rest, 0);
    let s = and === 0 ? 'Nenhum pedido em andamento' : and === 1 ? '1 pedido em andamento' : `${and} pedidos em andamento`;
    if (late) s += `, <b class="late">${late === 1 ? '1 atrasado' : late + ' atrasados'}</b>`;
    s += '. ' + (rec > 0 ? `A receber: <b>${U.money(rec)}</b>.` : 'Nada a receber.');
    return `<p class="summary">${s}</p>`;
  }
  function banners() {
    const b = [];
    if (S.mode === 'memory') b.push('<div class="banner warn">Este navegador não está deixando salvar dados aqui. O que você cadastrar some ao fechar a página. Abra o app pelo endereço publicado para usar de verdade.</div>');
    if (!S.cfg.conferido) b.push('<div class="banner">Antes do primeiro envio, confira os dados da empresa e a chave PIX. <a href="#/ajustes">Conferir ajustes</a></div>');
    else if (!nuvemOk() && S.orders.length >= 3 && (!S.cfg.ultimoBackup || Date.now() - S.cfg.ultimoBackup > 7 * 864e5)) {
      const days = S.cfg.ultimoBackup ? Math.floor((Date.now() - S.cfg.ultimoBackup) / 864e5) : 0;
      b.push(`<div class="banner">${S.cfg.ultimoBackup ? `Seu último backup foi há ${days} dias.` : 'Você ainda não fez backup dos pedidos.'} Eles ficam só neste aparelho. <button type="button" class="link" data-act="backup">Fazer backup agora</button> ou <a href="#/ajustes">ligue o backup na nuvem</a>.</div>`);
    }
    return b.join('');
  }
  function viewList() {
    setTitle('Histórico');
    const f = curFilter();
    const page = mount(`
      ${banners()}
      <div class="page-head"><h1>Histórico de pedidos</h1><a class="btn primary sm" href="#/novo">${I.plus}Novo pedido</a></div>
      ${summaryHtml()}
      ${nuvemLigada() ? `<p class="nuvem-linha" id="nuvem-status" aria-live="polite">${linhaNuvemLista()}</p>` : ''}
      ${S.orders.length ? `<label class="search">${I.search}<span class="sr-only">Buscar pedidos</span><input id="q" type="search" enterkeyhint="search" placeholder="Buscar por cliente, nº, telefone ou item" value="${esc(S.q)}" autocomplete="off"></label>
      <div class="chips" role="group" aria-label="Filtrar pedidos">${FILTERS.map(x => `<button type="button" class="chip${x.id === f.id ? ' on' : ''}" data-f="${x.id}" aria-pressed="${x.id === f.id}">${x.label} <span class="n">${S.orders.filter(x.fn).length}</span></button>`).join('')}</div>` : ''}
      <div id="slips">${slipsHtml()}</div>`);
    const q = $('#q', page);
    if (q) q.addEventListener('input', () => { S.q = q.value; $('#slips', page).innerHTML = slipsHtml(); });
    page.addEventListener('click', e => {
      const chip = e.target.closest('[data-f]');
      if (chip) {
        S.filter = chip.dataset.f;
        viewList();
        const c = $(`[data-f="${S.filter}"]`);
        if (c) {
          c.focus({ preventScroll: true });
          const bar = c.parentElement;
          bar.scrollLeft = Math.max(0, c.offsetLeft - (bar.clientWidth - c.offsetWidth) / 2);
        }
        return;
      }
      const b = e.target.closest('[data-act]');
      if (!b) return;
      if (b.dataset.act === 'todos') { S.filter = 'todos'; viewList(); }
      if (b.dataset.act === 'backup') exportBackup();
    });
  }

  /* ---------- folha do talão (novo pedido e pedido salvo) ---------- */
  const MIN_LINHAS = 5;
  const linhaVazia = () => ({ qtd: 0, desc: '', unit: 0 });
  function linhaHtml(it, i) {
    return `<div class="pt-row" data-i="${i}">
      <label class="cell c-q"><small>Quant.</small><input name="qtd" inputmode="decimal" autocomplete="off" placeholder="0" value="${it.qtd ? esc(U.fmtQty(it.qtd)) : ''}" aria-label="Quantidade, linha ${i + 1}"></label>
      <label class="cell c-d"><small>Discriminação</small><input name="desc" list="dl-itens" autocomplete="off" placeholder="Ex: Camisa polo personalizada / Calça brim..." value="${esc(it.desc)}" aria-label="Discriminação, linha ${i + 1}"></label>
      <label class="cell c-u"><small>Vl. unit.</small><input name="unit" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${it.unit ? U.money2(it.unit) : ''}" aria-label="Valor unitário, linha ${i + 1}"></label>
      <div class="cell c-t"><small>Vl. total</small><output>${U.money2(U.itemTotal(it))}</output><button type="button" class="c-x" data-act="rm-item" aria-label="Apagar linha ${i + 1}">${I.trash}</button></div>
    </div>`;
  }
  const assinaturaHtml = d => (d.assinatura && d.assinatura.src
    ? `<img class="sig-img" src="${esc(d.assinatura.src)}" alt="Assinatura de quem recebeu"><button type="button" class="pad-btn" data-act="sign">${I.pen}Assinar de novo</button><button type="button" class="pad-btn ghost" data-act="rm-sign">Remover</button>`
    : `<button type="button" class="pad-btn" data-act="sign">${I.pen}Colher assinatura na tela</button>`);

  function folhaHtml(d, num) {
    const c = S.cfg;
    const marca = c.logo && c.logo.src
      ? `<img class="pad-logo" src="${esc(c.logo.src)}" alt="${esc(c.nome || 'Logo')}">`
      : `<div class="pad-name"><strong>${esc(c.nome || 'Sua empresa')}</strong>${c.atividade ? `<span>${esc(c.atividade)}</span>` : ''}</div>`;
    const tipo = c.pixChave ? (U.PIX_TIPOS[c.pixTipo] || '').toLowerCase() : '';
    return `<article class="sheet" id="sheet" aria-label="Folha do pedido">
      <header class="pad-head">
        <div class="pad-brand">
          ${marca}
          <address class="pad-addr">
            ${c.endereco1 ? `<span>${esc(c.endereco1)}</span>` : ''}
            ${c.endereco2 ? `<span>${esc(c.endereco2)}</span>` : ''}
            ${c.email ? `<span>E-mail: <u>${esc(c.email)}</u></span>` : ''}
            ${c.telefone ? `<b class="pad-tel">${esc(U.fmtPhone(c.telefone))}${c.whatsapp ? I.chat : ''}</b>` : ''}
          </address>
        </div>
        <div class="pad-num">
          <div class="pad-title"><span>PEDIDO</span><span class="pad-no">Nº <b>${U.fmtNum(num)}</b></span></div>
          <label class="pad-date"><span>DATA:</span><input type="date" name="data" value="${esc(d.data)}"></label>
        </div>
      </header>
      <section class="pad-box">
        <label class="pad-row"><span>Responsável pelo pedido:</span><input name="c.nome" list="dl-cli" autocapitalize="words" enterkeyhint="next" placeholder="Nome do cliente ou empresa solicitante" value="${esc(d.cliente.nome)}"></label>
        <label class="pad-row"><span>Endereço cliente:</span><input name="c.endereco" autocapitalize="words" enterkeyhint="next" placeholder="Rua, número, bairro, cidade..." value="${esc(d.cliente.endereco)}"></label>
        <div class="pad-row pad-split">
          <label><span>Tel./Whats:</span><input name="c.telefone" type="tel" inputmode="tel" enterkeyhint="next" placeholder="(71) 90000-0000" value="${esc(U.fmtPhone(d.cliente.telefone))}"></label>
          <label><span>E-mail cliente:</span><input name="c.email" type="email" inputmode="email" autocapitalize="off" enterkeyhint="next" placeholder="cliente@email.com (para envio)" value="${esc(d.cliente.email)}"></label>
        </div>
      </section>
      <section class="pad-table" aria-label="Itens do pedido">
        <div class="pt-head" aria-hidden="true"><span>Quant.</span><span>Discriminação</span><span>Vl. unit.</span><span>Vl. total</span></div>
        <div id="items">${d.itens.map(linhaHtml).join('')}</div>
        <div class="pt-foot"><button type="button" class="pad-btn" data-act="add-item">${I.plusCircle}Adicionar Item / Linha</button><small>* Os valores totais são calculados automaticamente</small></div>
      </section>
      <label class="pad-box pad-row pad-obs"><span>Observações / Grade:</span><textarea name="obs" rows="1" placeholder="Ex: Tamanhos (2 P, 5 M, 3 G), cor azul marinho, prazo de entrega...">${esc(d.obs)}</textarea></label>
      <section class="pad-bottom">
        <div class="pad-box pad-left">
          <div class="pad-pix">
            <p><span class="lbl">Chave PIX:</span> <b>${esc(c.pixChave || 'não cadastrada')}</b>${tipo ? ` <small>(${esc(tipo)})</small>` : ''}</p>
            ${c.pixChave ? `<div class="pix-opts">
              <label class="pad-check"><input type="checkbox" name="mostrarQr"${d.mostrarQr !== false ? ' checked' : ''}> QR Code com o valor no PDF</label>
              <label class="pix-valor"><span>Cobrar no PIX:</span><input name="pixValor" inputmode="decimal" value="${d.pixValor ? U.money2(d.pixValor) : ''}" aria-label="Valor a cobrar no PIX"></label>
            </div>` : '<p class="hint">Cadastre a chave em Ajustes.</p>'}
          </div>
          <div class="pad-row pad-split pad-mini">
            <label><span>Prazo de entrega:</span><input type="date" name="prazo" value="${esc(d.prazo)}"></label>
            <label><span>Pagamento:</span><select name="formaPagamento">${U.FORMAS.map(x => `<option${x === d.formaPagamento ? ' selected' : ''}>${x}</option>`).join('')}</select></label>
          </div>
        </div>
        <div class="pad-box pad-total">
          <div class="tt-row"><span>Subtotal</span><output id="t-sub">0,00</output></div>
          <label class="tt-row"><span>Desconto</span><input name="desconto" inputmode="decimal" placeholder="0,00" value="${d.desconto ? U.money2(d.desconto) : ''}"></label>
          <div class="tt-main"><span>TOTAL R$</span><output id="t-total">0,00</output></div>
          <label class="tt-row"><span>Sinal / pago</span><input name="pago" inputmode="decimal" placeholder="0,00" value="${d.pago ? U.money2(d.pago) : ''}"></label>
          <div class="tt-row tt-falta"><span>Falta pagar</span><output id="t-falta">0,00</output></div>
        </div>
      </section>
      ${d.status === 'entregue' ? `<section class="pad-box pad-receb">
        <div class="pad-row pad-split">
          <label><span>Recebido por:</span><input name="recebidoPor" autocapitalize="words" placeholder="Nome de quem recebeu" value="${esc(d.recebidoPor)}"></label>
          <label class="pr-dia"><span>Dia:</span><input type="date" name="recebidoEm" value="${esc(d.recebidoEm)}"></label>
        </div>
        <div class="pad-sig" id="sig-row">${assinaturaHtml(d)}</div>
      </section>` : ''}
    </article>`;
  }

  function atualizarTotais(d) {
    const t = U.totals(d);
    const set = (id, v) => { const el = $(id); if (el) el.textContent = v; };
    set('#t-sub', U.money2(t.sub));
    set('#t-total', U.money2(t.total));
    set('#t-falta', U.money2(t.rest));
    const f = $('.tt-falta');
    if (f) f.classList.toggle('quitado', t.total > 0 && t.rest === 0);
    const pv = $('[name=pixValor]');
    if (pv) pv.placeholder = t.rest > 0 ? U.money2(t.rest) : '0,00';
    const pg = $('[name=pago]');
    if (pg) pg.toggleAttribute('aria-invalid', t.pago > t.total && t.total > 0);
  }

  function barraSituacao(d) {
    const idx = U.FLOW.indexOf(d.status);
    return `<div class="sheet-bar">
      <div class="st-chips" role="group" aria-label="Situação do pedido">${U.FLOW.map((s, i) => `<button type="button" data-status="${s}" class="${s === d.status ? 'on' : i < idx ? 'done' : ''}" aria-pressed="${s === d.status}">${U.STATUS[s].label}</button>`).join('')}</div>
      <p class="sheet-note">${d.status === 'cancelado' ? '<b class="bad">Pedido cancelado.</b> <button type="button" class="link" data-act="reopen">Reabrir</button>' : deliveryLine(d)}</p>
    </div>`;
  }
  const bannerConferir = () => (S.cfg.conferido ? '' : '<div class="banner">Antes do primeiro envio, confira os dados da empresa e a chave PIX. <a href="#/ajustes">Conferir ajustes</a></div>');

  function viewSheet(id, opts = {}) {
    const saved = id ? byId(id) : null;
    if (id && !saved) return go('#/novo');
    let d, restored = false;
    if (!saved && S.drafts.novo) { d = clone(S.drafts.novo); restored = hasContent(d); }
    else d = saved ? clone(saved) : newOrder();
    d.cliente = Object.assign({ nome: '', telefone: '', email: '', endereco: '' }, d.cliente || {});
    d.itens = (Array.isArray(d.itens) ? d.itens : []).filter(it => it && typeof it === 'object');
    while (d.itens.length < MIN_LINHAS) d.itens.push(linhaVazia());
    S.folha = { d };
    S.currentId = saved ? saved.id : null;
    S.dirty = false;
    const num = d.numero || nextNumber();
    setTitle(saved ? `Pedido ${U.fmtNum(num)}` : 'Novo pedido');
    const y = window.scrollY;
    const cat = catalog(), cli = clients();
    const page = mount(`
      ${saved ? barraSituacao(d) : `<div class="sheet-bar"><p class="sheet-note">${restored ? 'Este é o pedido que ficou pela metade. <button type="button" class="link" data-act="discard">Começar outro em branco</button>' : 'Preencha como no talão de papel. Use <b>Salvar</b> no alto da tela.'}</p></div>`}
      ${bannerConferir()}
      <form id="sheet-form" class="sheet-form" novalidate autocomplete="off">${folhaHtml(d, num)}</form>
      <div class="send-bar" role="group" aria-label="Enviar ao cliente">
        <button type="button" class="sb wa" data-act="wa">${I.chat}Enviar no WhatsApp</button>
        <button type="button" class="sb" data-act="share-pdf">${I.share}Enviar PDF</button>
        <button type="button" class="sb" data-act="email">${I.mail}E-mail</button>
        <button type="button" class="sb" data-act="print">${I.print}Imprimir</button>
        <button type="button" class="sb" data-act="more" aria-label="Mais opções">${I.more}Mais</button>
      </div>
      <p class="send-hint">O WhatsApp abre a conversa do cliente com o resumo e o PIX. Para mandar o PDF junto, use <b>Enviar PDF</b> e escolha a mesma conversa. Enviar também salva o pedido.</p>
      <div id="envios">${enviosHtml(d)}</div>
      <datalist id="dl-cli">${[...cli.values()].map(c => `<option value="${esc(c.nome)}"></option>`).join('')}</datalist>
      <datalist id="dl-itens">${[...cat.values()].map(c => `<option value="${esc(c.desc)}">${c.unit ? U.money(c.unit) : ''}</option>`).join('')}</datalist>`);
    ligarFolha(page, d, cat, cli);
    atualizarTotais(d);
    $$('.pad-obs textarea', page).forEach(autoAltura);
    if (opts.keepScroll) window.scrollTo(0, y);
    else if (!saved && !restored && !coarse()) setTimeout(() => { const n = $('[name="c.nome"]', page); if (n) n.focus({ preventScroll: true }); }, 30);
  }
  function autoAltura(t) { t.style.height = 'auto'; t.style.height = Math.max(36, t.scrollHeight) + 'px'; }

  function ligarFolha(page, d, cat, cli) {
    const f = $('#sheet-form', page);
    const tocou = () => {
      if (byId(d.id)) S.dirty = true;
      else { S.drafts.novo = d; persistDrafts(); }
    };
    const redesenharLinhas = () => { $('#items', f).innerHTML = d.itens.map(linhaHtml).join(''); };
    f.addEventListener('input', e => {
      const el = e.target, name = el.name;
      if (!name) return;
      const row = el.closest('.pt-row');
      if (row) {
        const it = d.itens[+row.dataset.i];
        if (!it) return;
        if (name === 'qtd') it.qtd = U.parseQty(el.value);
        else if (name === 'unit') it.unit = U.parseMoney(el.value);
        else if (name === 'desc') {
          it.desc = el.value;
          const k = cat.get(U.norm(el.value));
          if (k && k.unit && !it.unit) { it.unit = k.unit; $('[name=unit]', row).value = U.money2(k.unit); }
          if (it.desc.trim() && !it.qtd) { it.qtd = 1; $('[name=qtd]', row).value = '1'; }
        }
        $('output', row).textContent = U.money2(U.itemTotal(it));
      } else if (name.startsWith('c.')) {
        d.cliente[name.slice(2)] = el.value;
        if (name === 'c.nome') {
          const k = cli.get(U.norm(el.value));
          if (k) ['telefone', 'email', 'endereco'].forEach(fl => {
            if (!String(d.cliente[fl] || '').trim() && k[fl]) {
              d.cliente[fl] = k[fl];
              $(`[name="c.${fl}"]`, f).value = fl === 'telefone' ? U.fmtPhone(k[fl]) : k[fl];
            }
          });
        }
      } else if (name === 'desconto' || name === 'pago' || name === 'pixValor') d[name] = U.parseMoney(el.value);
      else if (el.type === 'checkbox') d[name] = el.checked;
      else d[name] = el.value;
      if (el.tagName === 'TEXTAREA') autoAltura(el);
      clearErr(el);
      atualizarTotais(d);
      tocou();
    });
    f.addEventListener('focusout', e => {
      const el = e.target;
      if (['unit', 'desconto', 'pago', 'pixValor'].includes(el.name)) { const v = U.parseMoney(el.value); el.value = v ? U.money2(v) : ''; }
      else if (el.name === 'qtd') { const v = U.parseQty(el.value); el.value = v ? U.fmtQty(v) : ''; }
      else if (el.name === 'c.telefone' && el.value.trim()) el.value = U.fmtPhone(el.value);
    });
    f.addEventListener('keydown', e => {
      if (e.key !== 'Enter' || e.target.tagName !== 'INPUT' || e.target.type === 'checkbox') return;
      e.preventDefault();
      const row = e.target.closest('.pt-row');
      if (row && e.target.name === 'unit' && !row.nextElementSibling) { $('[data-act=add-item]', f).click(); return; }
      const els = $$('input, select, textarea', f).filter(x => !x.disabled && x.offsetParent !== null);
      const i = els.indexOf(e.target);
      if (i >= 0 && els[i + 1]) els[i + 1].focus();
    });
    f.addEventListener('submit', e => { e.preventDefault(); salvarFolha(d); });
    page.addEventListener('click', async e => {
      const st = e.target.closest('[data-status]');
      if (st) return mudarSituacao(d, st.dataset.status);
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const act = b.dataset.act;
      if (act === 'add-item') {
        d.itens.push(linhaVazia());
        redesenharLinhas();
        $('[name=desc]', $$('.pt-row', f).pop()).focus();
        tocou();
      } else if (act === 'rm-item') {
        d.itens.splice(+b.closest('.pt-row').dataset.i, 1);
        while (d.itens.length < MIN_LINHAS) d.itens.push(linhaVazia());
        redesenharLinhas();
        atualizarTotais(d);
        tocou();
      } else if (act === 'discard') {
        delete S.drafts.novo;
        await Store.setKV('drafts', S.drafts).catch(() => {});
        viewSheet(null);
      } else if (act === 'sign') {
        const sig = await signatureModal();
        if (sig) {
          d.assinatura = sig;
          if (!d.recebidoEm) { d.recebidoEm = U.isoLocal(); $('[name=recebidoEm]', f).value = d.recebidoEm; }
          if (!d.recebidoPor && d.cliente.nome) { d.recebidoPor = d.cliente.nome; $('[name=recebidoPor]', f).value = d.recebidoPor; }
          $('#sig-row', f).innerHTML = assinaturaHtml(d);
          tocou();
        }
      } else if (act === 'rm-sign') {
        d.assinatura = null;
        $('#sig-row', f).innerHTML = assinaturaHtml(d);
        tocou();
      } else if (act === 'reopen') {
        d.status = 'aberto';
        await salvarFolha(d, { silencioso: true });
        toast('Pedido reaberto');
      } else if (act === 'wa') enviar(d, sendWhatsApp);
      else if (act === 'share-pdf') enviar(d, sharePdf);
      else if (act === 'email') enviar(d, emailModal);
      else if (act === 'print') enviar(d, printOrder);
      else if (act === 'more') moreMenu(d);
    });
  }

  /* ---------- salvar a folha ---------- */
  function validarFolha(d) {
    d.cliente.nome = String(d.cliente.nome || '').trim();
    if (!d.cliente.nome) { showErr($('[name="c.nome"]'), 'Escreva o nome de quem está fazendo o pedido.'); return false; }
    if (!d.itens.some(validItem)) { showErr($('#items [name=desc]'), 'Preencha pelo menos uma linha com a discriminação.'); return false; }
    return true;
  }
  // Parte síncrona: arruma os dados e dá o número (o envio precisa disso na hora do toque).
  function fecharFolha(d, novo) {
    d.itens = d.itens.filter(validItem).map(it => ({ qtd: Number(it.qtd) || 1, desc: String(it.desc || '').trim(), unit: Number(it.unit) || 0 }));
    d.cliente.telefone = String(d.cliente.telefone || '').trim();
    d.cliente.email = String(d.cliente.email || '').trim();
    if (novo) {
      d.numero = nextNumber();
      d.createdAt = Date.now();
      S.cfg.proximoNumero = d.numero + 1;
    }
    if (d.status === 'entregue' && !d.recebidoEm) d.recebidoEm = U.isoLocal();
  }
  async function gravarFolha(d, novo) {
    if (novo) await saveCfg().catch(() => {});
    await saveOrder(d);
    if (novo) { delete S.drafts.novo; await Store.setKV('drafts', S.drafts).catch(() => {}); }
    S.dirty = false;
    requestPersist();
  }
  async function salvarFolha(d, opts = {}) {
    if (!validarFolha(d)) return false;
    const novo = !byId(d.id);
    if (novo) await puxarRapido();
    fecharFolha(d, novo);
    try { await gravarFolha(d, novo); } catch (e) { toast('Não foi possível salvar neste aparelho. Veja se há espaço livre.', 'err'); return false; }
    if (!opts.silencioso) toast(novo ? `Pedido Nº ${U.fmtNum(d.numero)} salvo` : 'Pedido salvo');
    if (novo) virarPedidoSalvo(d);
    viewSheet(d.id, { keepScroll: true });
    return true;
  }
  // Envio: tudo o que abre outro app precisa acontecer no toque; a gravação vem logo depois.
  function enviar(d, acao) {
    if (!validarFolha(d)) return;
    const novo = !byId(d.id);
    const precisa = novo || S.dirty;
    if (precisa) fecharFolha(d, novo);
    acao(d);
    if (precisa) {
      gravarFolha(d, novo)
        .then(() => {
          if (novo) virarPedidoSalvo(d);
          quandoSemModal(() => { if (S.folha && S.folha.d === d) viewSheet(d.id, { keepScroll: true }); });
        })
        .catch(() => toast('Não foi possível salvar neste aparelho.', 'err'));
    }
  }
  async function mudarSituacao(d, s) {
    if (s === d.status) return;
    if (s === 'entregue') { if (!(await deliveryModal(d))) return; } else d.status = s;
    if (await salvarFolha(d, { silencioso: true })) toast(`Situação: ${U.STATUS[s].label}`);
  }

  /* ---------- assinatura ---------- */
  function makePad(canvas) {
    const ctx = canvas.getContext('2d');
    let has = false, drawing = false, last = null, w = 1, h = 1, dpr = 1, bb = null;
    const setup = () => {
      const r = canvas.getBoundingClientRect();
      dpr = Math.min(window.devicePixelRatio || 1, 3);
      w = Math.max(1, r.width);
      h = Math.max(1, r.height);
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#0b1f5c';
      ctx.lineWidth = 2.6;
      has = false;
      bb = null;
    };
    setup();
    const pos = e => { const r = canvas.getBoundingClientRect(); return { x: ((e.clientX - r.left) * w) / r.width, y: ((e.clientY - r.top) * h) / r.height }; };
    const grow = p => { bb = bb ? { x0: Math.min(bb.x0, p.x), y0: Math.min(bb.y0, p.y), x1: Math.max(bb.x1, p.x), y1: Math.max(bb.y1, p.y) } : { x0: p.x, y0: p.y, x1: p.x, y1: p.y }; };
    canvas.addEventListener('pointerdown', e => {
      e.preventDefault();
      drawing = true;
      has = true;
      last = pos(e);
      grow(last);
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }
      ctx.beginPath();
      ctx.arc(last.x, last.y, 1.3, 0, Math.PI * 2);
      ctx.fillStyle = '#0b1f5c';
      ctx.fill();
    });
    canvas.addEventListener('pointermove', e => {
      if (!drawing) return;
      e.preventDefault();
      const p = pos(e);
      ctx.beginPath();
      ctx.moveTo(last.x, last.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      last = p;
      grow(p);
    });
    const end = () => { drawing = false; };
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => canvas.addEventListener(ev, end));
    return {
      isEmpty: () => !has,
      clear: setup,
      toJpeg: () => {
        const pad = 10;
        const x0 = Math.max(0, bb.x0 - pad), y0 = Math.max(0, bb.y0 - pad), x1 = Math.min(w, bb.x1 + pad), y1 = Math.min(h, bb.y1 + pad);
        const cw = Math.max(20, x1 - x0), ch = Math.max(10, y1 - y0);
        const k = Math.min(3, 600 / cw);
        const out = document.createElement('canvas');
        out.width = Math.round(cw * k);
        out.height = Math.round(ch * k);
        const o2 = out.getContext('2d');
        o2.fillStyle = '#fff';
        o2.fillRect(0, 0, out.width, out.height);
        o2.drawImage(canvas, x0 * dpr, y0 * dpr, cw * dpr, ch * dpr, 0, 0, out.width, out.height);
        return { src: out.toDataURL('image/jpeg', 0.88), w: out.width, h: out.height };
      },
    };
  }
  function signatureModal() {
    return modal({
      title: 'Assinatura de quem recebeu',
      wide: true,
      body: '<p class="muted">Peça para a pessoa assinar com o dedo dentro do quadro.</p><div class="sigpad"><canvas id="sigc" aria-label="Área para assinar"></canvas></div><button type="button" class="link" id="sig-clear">Limpar e assinar de novo</button>',
      actions: [{ label: 'Cancelar', value: null }, { label: 'Usar esta assinatura', kind: 'primary', onClick: w => { if (w._pad.isEmpty()) { toast('Assine dentro do quadro branco.'); return false; } return w._pad.toJpeg(); } }],
      onOpen: w => { w._pad = makePad($('#sigc', w)); $('#sig-clear', w).onclick = () => w._pad.clear(); },
    });
  }
  async function deliveryModal(o) {
    const res = await modal({
      title: 'Registrar entrega',
      wide: true,
      body: `<div class="row2">
          <label class="fld"><span>Recebido por</span><input id="dv-n" value="${esc(o.recebidoPor || (o.cliente && o.cliente.nome) || '')}" autocapitalize="words"></label>
          <label class="fld"><span>Dia</span><input id="dv-d" type="date" value="${esc(o.recebidoEm || U.isoLocal())}"></label>
        </div>
        <div class="fld"><span>Assinatura (opcional)</span><p class="muted dv-dica">Só se a pessoa estiver aí com você: ela assina com o dedo no quadro. Se a entrega foi por motoboy ou transportadora, deixe em branco.</p><div class="sigpad"><canvas id="dv-c" aria-label="Área para assinar"></canvas></div><button type="button" class="link" id="dv-clear">Limpar assinatura</button></div>`,
      actions: [{ label: 'Cancelar', value: null }, {
        label: 'Confirmar entrega', kind: 'primary', onClick: w => {
          const n = $('#dv-n', w).value.trim();
          if (!n) { showErr($('#dv-n', w), 'Escreva quem recebeu.'); return false; }
          return { n, d: $('#dv-d', w).value || U.isoLocal(), sig: w._pad.isEmpty() ? null : w._pad.toJpeg() };
        },
      }],
      onOpen: w => { w._pad = makePad($('#dv-c', w)); $('#dv-clear', w).onclick = () => w._pad.clear(); },
    });
    if (!res) return false;
    o.status = 'entregue';
    o.recebidoPor = res.n;
    o.recebidoEm = res.d;
    if (res.sig) o.assinatura = res.sig;
    return true;
  }

  /* ---------- situação, menu e envios ---------- */
  function deliveryLine(o) {
    if (o.status === 'entregue') return `Entregue${o.recebidoEm ? ' em ' + U.fmtDate(o.recebidoEm) : ''}${o.recebidoPor ? ', recebido por ' + esc(o.recebidoPor) : ''}${o.assinatura ? ', com assinatura' : ''}.`;
    if (o.status === 'cancelado') return 'Pedido cancelado.';
    if (!o.prazo) return 'Sem prazo de entrega definido.';
    return isLate(o) ? `<span class="late">Atrasado: o prazo era ${U.fmtDate(o.prazo)}.</span>` : `Entrega até ${U.fmtDate(o.prazo)}.`;
  }
  const enviosHtml = o => (o.envios && o.envios.length
    ? `<p class="hint sent">Último envio: ${esc(o.envios[o.envios.length - 1].canal)}, ${U.fmtDateTime(o.envios[o.envios.length - 1].em)}.</p>` : '');

  async function moreMenu(d) {
    const salvo = !!byId(d.id);
    const pix = U.pixValue(d) > 0 && String(S.cfg.pixChave || '').trim() && d.status !== 'cancelado';
    const choice = await modal({
      title: salvo ? `Pedido Nº ${U.fmtNum(d.numero)}` : 'Mais opções',
      body: `<div class="choice-list">
        <button type="button" class="choice" data-choice="dl-pdf"><b>Baixar PDF</b><small>Salva o arquivo neste aparelho.</small></button>
        <button type="button" class="choice" data-choice="png"><b>Mandar como imagem</b><small>Uma foto do pedido, boa para ver direto no WhatsApp.</small></button>
        <button type="button" class="choice" data-choice="copy-msg"><b>Copiar a mensagem</b><small>O mesmo texto que vai no WhatsApp.</small></button>
        ${pix ? '<button type="button" class="choice" data-choice="copy-pix"><b>Copiar PIX copia e cola</b><small>Código com o valor, para colar no app do banco.</small></button>' : ''}
        ${salvo ? `<button type="button" class="choice" data-choice="dup"><b>Duplicar pedido</b><small>Abre um pedido novo com o mesmo cliente e os mesmos itens.</small></button>
        ${d.status === 'cancelado'
          ? '<button type="button" class="choice" data-choice="reopen"><b>Reabrir pedido</b><small>Volta para a situação Aberto.</small></button>'
          : '<button type="button" class="choice" data-choice="cancel"><b>Cancelar pedido</b><small>Continua no histórico, marcado como cancelado.</small></button>'}
        <button type="button" class="choice danger" data-choice="del"><b>Excluir pedido</b><small>Apaga de vez deste aparelho.</small></button>`
        : '<button type="button" class="choice danger" data-choice="discard"><b>Limpar a folha</b><small>Apaga o que foi preenchido e começa de novo.</small></button>'}
      </div>`,
      onOpen: (w, close) => w.addEventListener('click', e => {
        const b = e.target.closest('[data-choice]');
        if (!b) return;
        const c = b.dataset.choice;
        // Ações que abrem outro app ou baixam arquivo precisam rodar no próprio toque.
        if (c === 'dl-pdf') enviar(d, o => { downloadFile(makePdf(o)); logEnvio(o, 'PDF baixado'); });
        else if (c === 'png') enviar(d, shareImages);
        // Copiar também salva antes: a mensagem e o PIX levam o número do pedido.
        else if (c === 'copy-msg') enviar(d, o => copyText(msgText(o)).then(ok => toast(ok ? 'Mensagem copiada' : 'Não foi possível copiar aqui')));
        else if (c === 'copy-pix') enviar(d, o => copyText(pixCodeFor(o)).then(ok => toast(ok ? 'Código PIX copiado' : 'Não foi possível copiar aqui')));
        close(c);
      }),
    });
    if (choice === 'dup') {
      const n = clone(d);
      Object.assign(n, { id: uid(), numero: null, data: U.isoLocal(), status: 'aberto', pago: 0, pagamentos: [], prazo: '', recebidoPor: '', recebidoEm: '', assinatura: null, envios: [], pixValor: 0 });
      n.itens = n.itens.filter(validItem);
      delete n.createdAt;
      delete n.updatedAt;
      S.drafts.novo = n;
      await Store.setKV('drafts', S.drafts).catch(() => {});
      go('#/novo');
      toast('Cópia pronta. Confira e salve.');
    } else if (choice === 'cancel' || choice === 'reopen') {
      d.status = choice === 'cancel' ? 'cancelado' : 'aberto';
      if (await salvarFolha(d, { silencioso: true })) toast(choice === 'cancel' ? 'Pedido cancelado' : 'Pedido reaberto');
    } else if (choice === 'del') {
      if (!(await confirmBox(`Excluir o pedido Nº ${U.fmtNum(d.numero)}?`, 'Ele some deste aparelho e não dá para desfazer. Se quiser manter o histórico, use Cancelar pedido.', 'Excluir pedido', true))) return;
      const o = byId(d.id);
      marcarExclusao(o);
      await Store.delOrder(o.id);
      S.orders = S.orders.filter(x => x.id !== o.id);
      S.dirty = false;
      toast(`Pedido Nº ${U.fmtNum(o.numero)} excluído`);
      go('#/historico');
    } else if (choice === 'discard') {
      if (!(await confirmBox('Limpar a folha?', 'O que foi preenchido neste pedido novo será apagado.', 'Limpar', true))) return;
      delete S.drafts.novo;
      await Store.setKV('drafts', S.drafts).catch(() => {});
      viewSheet(null);
    }
  }

  /* ---------- envio ---------- */
  function sendWhatsApp(o) {
    const phone = U.waPhone(o.cliente && o.cliente.telefone, S.cfg.ddd);
    openUrl(`https://wa.me/${phone}?text=${encodeURIComponent(msgText(o))}`);

    logEnvio(o, 'WhatsApp');
  }
  function sharePdf(o) {
    const file = makePdf(o);
    if (canShare([file])) {
      navigator.share({ files: [file], title: file.name })
        .then(() => logEnvio(o, 'PDF compartilhado'))
        .catch(err => { if (!err || err.name !== 'AbortError') { downloadFile(file); toast('Não deu para compartilhar daqui. O PDF foi baixado.'); } });
    } else {
      downloadFile(file);
      toast('PDF baixado. Anexe na conversa ou no e-mail do cliente.');
      logEnvio(o, 'PDF baixado');
    }
  }
  function shareImages(o) {
    const files = makePngs(o);
    if (canShare(files)) {
      navigator.share({ files, title: files[0].name })
        .then(() => logEnvio(o, 'imagem compartilhada'))
        .catch(err => { if (!err || err.name !== 'AbortError') files.forEach(downloadFile); });
    } else {
      files.forEach(downloadFile);
      toast(files.length > 1 ? 'Imagens baixadas' : 'Imagem baixada');
    }
  }
  function emailModal(o) {
    const to = String((o.cliente && o.cliente.email) || '').trim();
    const subject = `Pedido Nº ${U.fmtNum(o.numero)} - ${U.companyName(S.cfg)}`;
    const body = msgText(o, true);
    const enc = encodeURIComponent;
    const share = canShareFiles();
    const urls = {
      gmail: `https://mail.google.com/mail/?view=cm&fs=1&to=${enc(to)}&su=${enc(subject)}&body=${enc(body)}`,
      outlook: `https://outlook.live.com/mail/0/deeplink/compose?to=${enc(to)}&subject=${enc(subject)}&body=${enc(body)}`,
      mailto: `mailto:${enc(to).replace(/%40/g, '@')}?subject=${enc(subject)}&body=${enc(body)}`,
    };

    const opts = [

      { id: 'gmail', t: 'Gmail', s: att },
      { id: 'outlook', t: 'Outlook ou Hotmail', s: att },
      { id: 'mailto', t: 'Outro app de e-mail', s: share ? 'Usa o app de e-mail deste aparelho.' : 'Usa o app de e-mail deste computador. O PDF é baixado para você anexar.' },
    ].filter(Boolean);
    modal({
      title: 'Enviar por e-mail',
      body: `${to ? `<p>Para: <b>${esc(to)}</b></p>` : '<p class="warn-text">Este cliente não tem e-mail cadastrado. Você vai digitar o endereço no app de e-mail.</p>'}
        <div class="choice-list">${opts.map(x => `<button type="button" class="choice" data-choice="${x.id}"><b>${x.t}</b><small>${x.s}</small></button>`).join('')}</div>`,
      onOpen: (w, close) => w.addEventListener('click', e => {
        const b = e.target.closest('[data-choice]');
        if (!b) return;
        const id = b.dataset.choice;
        if (id === 'share') sharePdf(o);
        else {
          if (!share) downloadFile(makePdf(o));
          if (id === 'mailto') location.href = urls.mailto; else openUrl(urls[id]);
          logEnvio(o, 'e-mail');
        }
        close(id);
      }),
    });
  }
  async function printOrder(o) {
    const pa = $('#print-area');
    const { pages } = DOC.layout(o, S.cfg);
    const imgs = await docImages(o);
    pa.innerHTML = '';
    const waits = pages.map(ops => {
      const cv = document.createElement('canvas'), sc = 2.5;
      cv.width = Math.round(DOC.PAGE.w * sc);
      cv.height = Math.round(DOC.PAGE.h * sc);
      DOC.drawCanvas(cv.getContext('2d'), ops, sc, imgs);
      const im = new Image();
      im.alt = '';
      im.src = cv.toDataURL('image/png');
      pa.appendChild(im);
      return im.decode().catch(() => {});
    });
    await Promise.all(waits);
    try { window.print(); } catch (e) { toast('A impressão não abriu aqui. Baixe o PDF e imprima por ele.'); }
  }

  /* ---------- ajustes ---------- */
  function drawQrCanvas(cv, text) {
    let q;
    try { q = QR.encode(text, 'M'); } catch (e) { return false; }
    const n = q.size, quiet = 4, px = Math.max(2, Math.floor(280 / (n + quiet * 2)));
    cv.width = cv.height = (n + quiet * 2) * px;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#000';
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.modules[y][x]) ctx.fillRect((x + quiet) * px, (y + quiet) * px, px, px);
    return true;
  }
  const logoPreview = () => (S.cfg.logo && S.cfg.logo.src ? `<img src="${esc(S.cfg.logo.src)}" alt="Logo atual">` : esc(U.initials(S.cfg.nome, S.cfg.atividade)));

  function passosFirebaseHtml() {

  async function acaoNuvem(act, b) {
    const st = Sync.s && Sync.s.estado;
    if (act === 'fb-regras') return toast((await copyText(REGRAS)) ? 'Regras copiadas. Cole na aba Regras do Firestore.' : 'Não foi possível copiar aqui');
    if (act === 'fb-copiar-uid') return toast((await copyText(st.uid)) ? 'UID copiado' : 'Não foi possível copiar aqui');
    if (act === 'fb-link') {
      const link = location.href.split('#')[0] + '#/ajustes?fb=' + b64u(JSON.stringify({ apiKey: st.apiKey, projectId: st.projectId }));
      return toast((await copyText(link)) ? 'Link copiado. Abra no outro aparelho.' : 'Não foi possível copiar aqui');
    }
    if (act === 'fb-sair') {
      if (!(await confirmBox('Desligar o backup na nuvem?', 'Este aparelho para de enviar e de receber pedidos da nuvem. Os pedidos continuam aqui e no Firebase.', 'Desligar'))) return;
      await Sync.s.sair();
      Sync.pend.clear();
      Sync.tumulos = {};
      Sync.cfgPend = false;
      persistSync();
      setSync('off');
      return redesenharNuvemBox();
    }
    b.disabled = true;
    try {
      if (act === 'fb-verificar') {
        if (await Sync.s.verificarMembro()) { await conectarNuvem(); toast('Usuário liberado. Backup ligado.'); }
        else toast(st.motivo === 'sem-regras' ? 'O Firebase ainda recusa o acesso. Confira as regras.' : 'Ainda não liberado. Confira o ID do documento em membros.', 'err');
      } else if (act === 'fb-enviar') {
        S.orders.forEach(o => Sync.pend.add(o.id));
        Sync.cfgPend = true;
        persistSync();
        const ok = await sincronizar();
        toast(ok && !Sync.problema ? `${S.orders.length} ${S.orders.length === 1 ? 'pedido enviado' : 'pedidos enviados'} para a nuvem` : statusNuvemTexto().replace(/<[^>]+>/g, ''), ok && !Sync.problema ? '' : 'err');
      } else if (act === 'fb-trazer') {
        const docs = await Sync.s.todos();

        toast(n ? `${n} ${n === 1 ? 'pedido atualizado' : 'pedidos atualizados'} com a nuvem` : 'Este aparelho já está igual à nuvem');
      }
    } catch (e) {
      tratarErroNuvem(e);
      toast(e.message || 'Não deu certo agora.', 'err');
    } finally {
      redesenharNuvemBox();
    }
  }
  async function entrarNuvem(form) {

    if (problema) return showErr(form.fbcfg, problema);
    const email = form.fbemail.value.trim();

    if (!form.fbsenha.value) return showErr(form.fbsenha, 'Digite a senha.');
    const btn = form.querySelector('button[type=submit]');

  async function processLogo(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = new Image();
      img.src = url;
      await img.decode();
      let w = img.naturalWidth || 300, h = img.naturalHeight || 300;
      const k = Math.min(1, 480 / Math.max(w, h));
      w = Math.max(1, Math.round(w * k));
      h = Math.max(1, Math.round(h * k));
      const cv = document.createElement('canvas');
      cv.width = w;
      cv.height = h;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      return { src: cv.toDataURL('image/jpeg', 0.9), w, h };
    } finally { URL.revokeObjectURL(url); }
  }

  function sanitizeOrder(x) {
    if (!x || typeof x !== 'object' || !x.id) return null;
    const o = Object.assign(newOrder(), x);
    o.id = String(x.id);
    o.numero = Number(x.numero) || 0;
    o.status = U.STATUS[o.status] ? o.status : 'aberto';
    o.cliente = Object.assign({ nome: '', telefone: '', email: '', endereco: '' }, x.cliente || {});
    o.itens = (Array.isArray(x.itens) ? x.itens : []).map(it => ({ qtd: Number(it && it.qtd) || 0, desc: String((it && it.desc) || ''), unit: Number(it && it.unit) || 0 }));
    ['desconto', 'pago', 'pixValor'].forEach(k => { o[k] = Math.max(0, Number(x[k]) || 0); });
    return o.numero ? o : null;
  }
  async function importBackup(file) {
    let data;
    try { data = JSON.parse(await file.text()); } catch (e) { return toast('Esse arquivo não é um backup válido.', 'err'); }
    if (!data || data.app !== 'talao-digital' || !Array.isArray(data.pedidos)) return toast('Esse arquivo não é um backup deste app.', 'err');
    const incoming = data.pedidos.map(sanitizeOrder).filter(Boolean);
    const when = data.exportadoEm ? U.fmtDateTime(Date.parse(data.exportadoEm)) : 'data desconhecida';
    const mode = await modal({
      title: 'Restaurar backup',
      body: `<p>Backup de ${when}, com <b>${incoming.length} ${incoming.length === 1 ? 'pedido' : 'pedidos'}</b>. Neste aparelho há ${S.orders.length}.</p>
        <div class="choice-list">
          <button type="button" class="choice" data-choice="merge"><b>Juntar com os pedidos deste aparelho</b><small>Mantém o que já está aqui. Quando o mesmo pedido existe nos dois, fica a versão mais recente.</small></button>
          <button type="button" class="choice danger" data-choice="replace"><b>Trocar tudo pelo backup</b><small>Apaga os pedidos e ajustes deste aparelho e usa os do arquivo.</small></button>
        </div>`,
      onOpen: (w, close) => w.addEventListener('click', e => { const b = e.target.closest('[data-choice]'); if (b) close(b.dataset.choice); }),
    });
    if (!mode) return;
    if (mode === 'replace') {
      await Store.clearOrders();
      S.orders = [];
      if (data.cfg && typeof data.cfg === 'object') S.cfg = Object.assign(clone(DEFAULT_CFG), data.cfg);
    }
    let n = 0;
    for (const o of incoming) {
      const cur = byId(o.id);
      if (cur && (cur.updatedAt || 0) >= (o.updatedAt || 0)) continue;
      await Store.putOrder(o);
      if (cur) S.orders[S.orders.indexOf(cur)] = o; else S.orders.push(o);
      if (nuvemLigada()) Sync.pend.add(o.id);
      n++;
    }
    if (n && nuvemLigada()) { persistSync(); agendarSync(); }
    S.cfg.proximoNumero = nextNumber();
    await saveCfg();
    updateBrand();
    toast(`${n} ${n === 1 ? 'pedido restaurado' : 'pedidos restaurados'}`);
    viewSettings();
  }
  function exportCSV() {
    if (!S.orders.length) return toast('Ainda não há pedidos para exportar.');
    const cell = v => {
      let s = String(v ?? '');
      if (/^[=+\-@]/.test(s)) s = "'" + s;
      return /[";\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const head = ['Nº', 'Data', 'Cliente', 'Telefone', 'E-mail', 'Endereço', 'Itens', 'Subtotal', 'Desconto', 'Total', 'Pago', 'Falta', 'Forma de pagamento', 'Prazo', 'Situação', 'Recebido por', 'Recebido em', 'Observações'];
    const rows = [...S.orders].sort((a, b) => a.numero - b.numero).map(o => {
      const t = U.totals(o), c = o.cliente || {};
      return [U.fmtNum(o.numero), U.fmtDate(o.data), c.nome, U.fmtPhone(c.telefone), c.email, c.endereco,
        (o.itens || []).filter(validItem).map(i => `${U.fmtQty(i.qtd)} x ${i.desc} (${U.money2(i.unit)})`).join(' | '),
        U.money2(t.sub), U.money2(t.desc), U.money2(t.total), U.money2(Math.min(t.pago, t.total)), U.money2(t.rest),
        o.formaPagamento, U.fmtDate(o.prazo), (U.STATUS[o.status] || {}).label, o.status === 'entregue' ? o.recebidoPor : '', o.status === 'entregue' ? U.fmtDate(o.recebidoEm) : '', String(o.obs || '').replace(/\s+/g, ' ')];
    });
    const csv = '﻿' + [head, ...rows].map(r => r.map(cell).join(';')).join('\r\n');
    downloadFile(new File([csv], `pedidos-${U.isoLocal()}.csv`, { type: 'text/csv;charset=utf-8' }));
    toast('Planilha exportada');
  }

    S.mode = await Store.init();
    try { const c = await Store.getKV('cfg'); if (c) S.cfg = Object.assign(clone(DEFAULT_CFG), c); } catch (e) { /* usa o padrão */ }
    try { S.orders = ((await Store.allOrders()) || []).filter(o => o && o.id); } catch (e) { S.orders = []; }
    try { S.drafts = (await Store.getKV('drafts')) || {}; } catch (e) { S.drafts = {}; }
    try { S.persisted = !!(navigator.storage && navigator.storage.persisted && (await navigator.storage.persisted())); } catch (e) { /* ok */ }
    let est = null;
    try { est = await Store.getKV('nuvem'); } catch (e) { est = null; }
    Sync.s = NUVEM.sessao(est || null, st => Store.setKV('nuvem', st).catch(() => {}));
    try {
      const p = await Store.getKV('nuvemPend');
      if (p) { Sync.pend = new Set(p.pend || []); Sync.tumulos = p.tumulos || {}; Sync.cfgPend = !!p.cfgPend; }
    } catch (e) { /* começa sem pendências */ }
    if (nuvemOk()) { Sync.at = (est && est.ultimoEnvio) || 0; Sync.status = 'ok'; } else if (nuvemLigada()) Sync.status = 'bloqueado';
    updateBrand();
    window.addEventListener('hashchange', route);
    $('#tb-salvar').addEventListener('click', () => { if (S.folha) salvarFolha(S.folha.d); });
    $('[data-nav=novo]').addEventListener('click', async e => {
      if (S.route !== 'novo' || !S.folha || !hasContent(S.folha.d)) return;
      e.preventDefault();
      if (!(await confirmBox('Começar outro pedido?', 'O que está preenchido nesta folha será apagado.', 'Começar outro', true))) return;
      delete S.drafts.novo;
      await Store.setKV('drafts', S.drafts).catch(() => {});
      viewSheet(null);
    });
    document.addEventListener('keydown', e => {
      if (S.folha && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); salvarFolha(S.folha.d); }
    });
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; if (S.route === 'ajustes') viewSettings(); });
    window.addEventListener('appinstalled', () => { S.installEvt = null; toast('App instalado'); });
    window.addEventListener('beforeunload', e => { descarregarRascunho(); if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
    window.addEventListener('pagehide', descarregarRascunho);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') descarregarRascunho(); });
    document.addEventListener('click', navGuard, true);
    window.addEventListener('online', () => { sincronizar(); });
    window.addEventListener('offline', () => { if (nuvemOk()) setSync('offline'); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sincronizar(); });
    setInterval(() => { if (document.visibilityState === 'visible') sincronizar(); }, 5 * 60 * 1000);
    route();
    registerSW();
    if (nuvemOk()) setTimeout(() => { sincronizar(); }, 600);
  }

  window.TALAO = { S, Sync, makePdf, makePngs, msgText, pixCodeFor, sincronizar, nuvemEndpoints: NUVEM.setEndpoints };
  boot();
})();

</script>
</body>
</html>
