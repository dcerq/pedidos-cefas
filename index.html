/* ===== Talão digital: a tela é a própria folha do talão (estilo pedido pela cliente, como a versão feita no Gemini) ===== */
:root {
  --navy: #1e3a6e;       /* barra do topo */
  --navy-2: #172d56;
  --ink: #1f3566;        /* tinta do talão: bordas e rótulos */
  --line: #c9d1e1;       /* linhas finas */
  --head: #f1f4f9;       /* fundo do cabeçalho da tabela */
  --bg: #eceef2;         /* fundo da página */
  --paper: #ffffff;
  --text: #1f2937;
  --muted: #6b7280;
  --ph: #a0a7b4;         /* texto de exemplo */
  --blue: #2563eb;       /* salvar */
  --blue-2: #1d4ed8;
  --red: #dc2626;        /* numerador */
  --green: #16a34a;      /* WhatsApp, pago */
  --green-2: #15803d;
  --amber: #b45309;
  --soft: #f5f7fb;
  --font: "InterVar", Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; font-family: var(--font); font-size: 15px; line-height: 1.45; color: var(--text);
  background: var(--bg); font-feature-settings: "tnum" 1, "cv11" 1; -webkit-tap-highlight-color: rgba(30, 58, 110, .12);
}
button, input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; }
svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
a { color: var(--blue); }
h1, h2 { margin: 0; color: var(--ink); line-height: 1.2; font-weight: 700; }
h1 { font-size: 22px; letter-spacing: -.01em; }
h2 { font-size: 17px; margin-bottom: 10px; }
p { margin: 0 0 10px; }
.muted { color: var(--muted); }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.topbar :focus-visible { outline-color: #fff; }

/* ---------- barra do topo ---------- */
.topbar { position: sticky; top: 0; z-index: 30; background: var(--navy); color: #fff; padding-top: env(safe-area-inset-top); box-shadow: 0 1px 0 rgba(0, 0, 0, .18); }
.topbar-in { max-width: 820px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 9px 16px; }
.brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; min-width: 0; margin-right: auto; }
.brand-mark {
  width: 32px; height: 32px; border-radius: 5px; background: #fff; color: var(--navy); display: grid; place-items: center; flex: none;
  font: 700 15px/1 Georgia, "Times New Roman", serif; letter-spacing: -.02em; overflow: hidden;
}
.brand-mark img { width: 100%; height: 100%; object-fit: contain; }
.brand-text { min-width: 0; line-height: 1.15; }
.brand-text strong { display: block; font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-text small { display: block; font-size: 11px; color: #c4cee6; }
.tb-nav { display: flex; align-items: center; gap: 6px; }
.tb {
  position: relative; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 6px;
  border: 0; font-size: 13.5px; font-weight: 600; text-decoration: none; cursor: pointer; white-space: nowrap;
}
.tb svg { width: 16px; height: 16px; }
.tb-novo { background: rgba(255, 255, 255, .12); color: #fff; }
.tb-novo:hover { background: rgba(255, 255, 255, .2); }
.tb-salvar { background: var(--blue); color: #fff; }
.tb-salvar:hover { background: var(--blue-2); }
.tb-salvar[hidden] { display: none; }
.tb-hist { background: #fff; color: var(--navy); }
.tb-hist:hover { background: #e8edf7; }
.tb-cfg { background: transparent; color: #dfe6f5; padding: 0 8px; }
.tb-cfg:hover, .tb-cfg[aria-current="page"] { background: rgba(255, 255, 255, .14); color: #fff; }
.tb-novo[aria-current="page"] { box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .5); }
.tb-dot { position: absolute; top: 5px; right: 4px; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--navy); background: #9ca3af; }
.tb-dot.ok { background: #22c55e; } .tb-dot.wait { background: #f59e0b; } .tb-dot.bad { background: #ef4444; }
.tb-dot[hidden] { display: none; }
@media (max-width: 560px) {
  .brand-text { display: none; }
  .topbar-in { padding: 8px 10px; gap: 8px; }
  .tb { padding: 0 10px; font-size: 13px; }
}
@media (max-width: 360px) { .tb-novo span, .tb-hist span { display: none; } .tb-novo, .tb-hist { padding: 0 9px; } }

main { max-width: 820px; margin: 0 auto; padding: 16px 16px 56px; outline: none; }
.loading { color: var(--muted); }
@media (max-width: 560px) { main { padding: 10px 8px 48px; } }

/* ---------- a folha do talão ---------- */
.sheet { background: var(--paper); border-radius: 10px; box-shadow: 0 1px 3px rgba(16, 24, 40, .1), 0 1px 2px rgba(16, 24, 40, .06); padding: 18px; color: var(--ink); }
.pad-head { display: grid; grid-template-columns: minmax(0, 1fr) 236px; border: 2px solid var(--ink); border-radius: 4px; }
.pad-brand { display: flex; align-items: center; gap: 22px; padding: 12px 16px; border-right: 2px solid var(--ink); min-width: 0; }
.pad-logo { max-width: 120px; max-height: 66px; object-fit: contain; flex: none; }
.pad-name { flex: none; max-width: 150px; line-height: 1.05; }
.pad-name strong { display: block; font: 700 25px/1 Georgia, "Times New Roman", serif; color: var(--ink); letter-spacing: -.01em; }
.pad-name span { display: block; font: italic 13px/1.15 Georgia, "Times New Roman", serif; color: var(--ink); margin-top: 3px; }
.pad-addr { font-style: normal; font-size: 12.5px; line-height: 1.5; color: var(--ink); min-width: 0; }
.pad-addr span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pad-tel { display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 800; margin-top: 2px; }
.pad-tel svg { width: 13px; height: 13px; stroke-width: 2.4; }
.pad-num { display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 10px 14px; }
.pad-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-bottom: 9px; border-bottom: 1px solid var(--line); }
.pad-title > span:first-child { font-size: 27px; font-weight: 800; letter-spacing: .01em; color: var(--ink); }
.pad-no { display: inline-flex; align-items: center; gap: 12px; border: 1px solid #9aa6bf; border-radius: 3px; padding: 2px 9px; font-size: 11.5px; font-weight: 700; color: var(--ink); }
.pad-no b { color: var(--red); font-size: 14px; font-weight: 800; }
.pad-date { display: flex; align-items: center; gap: 8px; }
.pad-date span { font-size: 11.5px; font-weight: 800; color: var(--ink); }
.pad-date input { flex: 1; min-width: 0; height: 34px; border: 1px solid #9aa6bf; border-radius: 3px; text-align: center; font-weight: 600; color: var(--text); background: #fff; padding: 0 6px; }

.pad-box { display: block; border: 2px solid var(--ink); border-radius: 4px; margin-top: 10px; background: #fff; }
.pad-row { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; cursor: text; }
.pad-row + .pad-row { border-top: 1.5px solid var(--ink); }
.pad-row > span, .pad-split > label > span, .tt-row > span, .tt-main > span, .pad-pix .lbl, .pix-valor > span {
  font-size: 11px; font-weight: 800; color: var(--ink); text-transform: uppercase; letter-spacing: .02em; white-space: nowrap;
}
.pad-row input, .pad-row textarea, .pad-row select, .pad-split input, .pad-split select {
  flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 14.5px; color: var(--text); height: 38px; padding: 0;
}
.pad-row textarea { resize: none; line-height: 1.45; padding: 9px 0; height: 38px; overflow: hidden; }
.pad-row select { cursor: pointer; }
input::placeholder, textarea::placeholder { color: var(--ph); opacity: 1; }
.pad-row:focus-within, .pad-split > label:focus-within { background: #f4f7ff; }
.pad-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); padding: 0; gap: 0; }
.pad-split > label { display: flex; align-items: center; gap: 10px; padding: 0 10px; min-height: 40px; cursor: text; min-width: 0; }
.pad-split > label + label { border-left: 1.5px solid var(--ink); }
[aria-invalid="true"] { box-shadow: inset 0 -2px 0 var(--red); }

/* tabela de itens */

.pt-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 7px 8px; border-top: 1.5px solid var(--ink); background: #fbfcfe; }

.pad-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 1px solid #b9c2d5; border-radius: 6px;
  background: #fff; color: var(--ink); font-size: 13px; font-weight: 700; cursor: pointer;
}
.pad-btn:hover { background: var(--soft); border-color: var(--ink); }

.pad-btn svg { width: 16px; height: 16px; }

.pad-obs { align-items: flex-start; }
.pad-obs > span { padding-top: 12px; }

/* PIX e totais */
.pad-bottom { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 10px; margin-top: 10px; align-items: stretch; }
.pad-bottom > .pad-box { margin-top: 0; display: flex; flex-direction: column; }

.pad-check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }

.pix-valor input { width: 96px; height: 30px; border: 1px solid #b9c2d5; border-radius: 4px; padding: 0 8px; text-align: right; font-size: 13.5px; color: var(--text); background: #fff; }
.pad-mini { border-top: 1.5px solid var(--ink); }
.pad-mini > label { flex-direction: column; align-items: stretch; justify-content: center; gap: 0; min-height: 50px; padding: 5px 10px 2px; }
.pad-mini > label > span { font-size: 10px; }
.pad-mini input, .pad-mini select { height: 28px; width: 100%; font-weight: 600; }
.pad-total .tt-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 32px; padding: 0 12px; }
.pad-total .tt-row + .tt-row, .pad-total .tt-main + .tt-row { border-top: 1px solid var(--line); }

/* recebido por */

/* acima e abaixo da folha */

@media (max-width: 680px) {

  .pad-bottom { grid-template-columns: 1fr; }

  .sb { flex: 1 1 calc(50% - 8px); justify-content: center; padding: 0 10px; }
  .sb.wa { flex-basis: 100%; }
}

/* ---------- botões e campos (ajustes, janelas) ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px;

.fld { display: block; margin: 0 0 12px; min-width: 0; position: relative; }

.fld input, .fld select, .fld textarea {
  display: block; width: 100%; font-size: 15px; background: #fff; border: 1px solid #c5ccd9; border-radius: 6px;

}
.fld textarea { resize: vertical; min-height: 80px; line-height: 1.4; }

.err { display: block; color: var(--red); font-size: 13px; font-weight: 600; margin-top: 4px; }
.hint { font-size: 13px; color: var(--muted); margin: 4px 0 10px; display: block; }
.hint.bad, .bad { color: var(--red); font-weight: 600; }
.hint.warnt { color: var(--amber); font-weight: 600; }
.hint.okt { color: var(--green); }
.warn-text { color: var(--amber); font-weight: 600; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.check { display: flex; align-items: center; gap: 10px; margin: 4px 0 12px; font-size: 14.5px; cursor: pointer; }

@media (max-width: 480px) { .row2 { grid-template-columns: 1fr; } }

/* painéis brancos (histórico e ajustes) */
.box { background: #fff; border: 0; border-radius: 10px; box-shadow: 0 1px 3px rgba(16, 24, 40, .1), 0 1px 2px rgba(16, 24, 40, .06); padding: 16px 18px; margin: 0 0 14px; min-width: 0; }
fieldset.box { padding-top: 14px; }

.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 4px 0 10px; }

.search:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37, 99, 235, .18); }
.search input { border: 0; outline: 0; flex: 1; background: transparent; min-width: 0; height: 100%; font-size: 15px; color: var(--text); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 2px 12px; margin: 0 -2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid #c9d0dd; background: #fff; color: var(--ink); border-radius: 999px; padding: 6px 13px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
.chip:hover { border-color: var(--ink); }
.chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.chip .n { font-weight: 500; opacity: .75; }

@media (min-width: 700px) { .slips { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.slip {
  display: block; background: #fff; border-radius: 10px; padding: 12px 14px; color: inherit; text-decoration: none; min-width: 0;
  box-shadow: 0 1px 3px rgba(16, 24, 40, .1), 0 1px 2px rgba(16, 24, 40, .06); border: 1px solid transparent; border-top: 3px solid var(--ink);
}
.slip:hover { border-color: #c9d0dd; border-top-color: var(--ink); }
.slip > span { display: block; }
.slip-top { display: flex !important; align-items: baseline; gap: 10px; }
.slip-num { color: var(--red); font-weight: 800; font-size: 16px; }
.slip-date { color: var(--muted); font-size: 13px; }

.pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 700; border: 1px solid transparent; white-space: nowrap; }
.st-aberto { background: #fef3c7; color: #92400e; border-color: #fde68a; }

.empty { background: #fff; border-radius: 10px; padding: 24px 20px; box-shadow: 0 1px 3px rgba(16, 24, 40, .1); }
.empty h2 { font-size: 18px; text-transform: none; letter-spacing: 0; }

.logo-row { display: flex; align-items: center; gap: 14px; margin: 0 0 12px; }

}

/* ---------- janelas e avisos ---------- */
.modal-wrap {

  padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); box-shadow: 0 20px 40px -12px rgba(15, 23, 42, .4);
}

@media (min-width: 680px) { .modal-wrap { align-items: center; padding: 20px; } .modal { border-radius: 12px; padding-bottom: 18px; } }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }

.choice-list { display: grid; gap: 8px; margin-top: 4px; }
.choice { text-align: left; border: 1px solid #d5dbe6; background: #fff; border-radius: 10px; padding: 11px 14px; color: var(--text); cursor: pointer; }
.choice:hover { border-color: var(--ink); background: var(--soft); }
.choice b { display: block; color: var(--ink); font-size: 15px; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 16px); background: #111827; color: #fff;
  padding: 11px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  z-index: 200; width: max-content; max-width: calc(100% - 32px); box-shadow: 0 10px 24px -10px rgba(0, 0, 0, .5);
}

body:has(.modal-wrap) .toast { top: calc(16px + env(safe-area-inset-top)); bottom: auto; }

@media (prefers-reduced-motion: reduce) { .modal-wrap, .toast { transition: none; } }

/* ---------- impressão ---------- */
#print-area { display: none; }
@media print {
  @page { size: A4; margin: 0; }
  body { background: #fff; }

}

<script>
/* ===== util.js: formatação, cálculos e regras de negócio (sem DOM) ===== */
const U = (() => {
  const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  const DEC2 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const DECQ = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 3 });

  // Valores sempre em centavos (inteiros) para não ter erro de arredondamento.
  const money = c => BRL.format((Number(c) || 0) / 100);
  const money2 = c => DEC2.format((Number(c) || 0) / 100);

  function parseDecimal(s) {
    s = String(s ?? '').trim().replace(/\s/g, '').replace(/[^\d,.]/g, '');
    if (!s) return 0;
    let n;
    if (s.includes(',')) n = parseFloat(s.replace(/\./g, '').replace(',', '.'));
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) n = parseFloat(s.replace(/\./g, ''));
    else n = parseFloat(s);
    return isFinite(n) && n > 0 ? n : 0;
  }
  const parseMoney = s => Math.round(parseDecimal(s) * 100);
  const parseQty = s => Math.round(parseDecimal(s) * 1000) / 1000;
  const fmtQty = q => (Number(q) ? DECQ.format(Number(q)) : '');

  const itemTotal = it => Math.round((Number(it && it.qtd) || 0) * (Number(it && it.unit) || 0));
  function totals(o) {
    const sub = ((o && o.itens) || []).reduce((a, it) => a + itemTotal(it), 0);
    const desc = Math.min(sub, Math.max(0, Number(o && o.desconto) || 0));
    const total = Math.max(0, sub - desc);
    const pago = Math.max(0, Number(o && o.pago) || 0);
    const rest = Math.max(0, total - pago);
    return { sub, desc, total, pago, rest };
  }
  // Valor que vai no QR/copia e cola: o que falta pagar, ou um valor menor informado (ex.: sinal).
  function pixValue(o) {
    const { rest } = totals(o);
    if (rest <= 0) return 0;
    const v = Number(o && o.pixValor) || 0;
    return v > 0 ? Math.min(v, rest) : rest;
  }

  const pad2 = n => String(n).padStart(2, '0');
  const isoLocal = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const fmtDate = iso => {
    if (!iso || !/^\d{4}-\d{2}-\d{2}/.test(iso)) return '';
    const [y, m, d] = String(iso).slice(0, 10).split('-');
    return `${d}/${m}/${y}`;
  };
  const fmtDateTime = ts => {
    const d = new Date(ts);
    return `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()} às ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  };
  const fmtNum = n => (n == null || n === '' ? '' : String(n).padStart(4, '0'));

  const digits = s => String(s ?? '').replace(/\D/g, '');
  function fmtPhone(s) {
    let d = digits(s);
    if (d.startsWith('55') && (d.length === 12 || d.length === 13)) d = d.slice(2);
    if (d.length === 11) return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
    if (d.length === 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
    if (d.length === 9) return `${d.slice(0, 5)}-${d.slice(5)}`;
    if (d.length === 8) return `${d.slice(0, 4)}-${d.slice(4)}`;
    return String(s ?? '').trim();
  }
  // Número no formato do wa.me (55 + DDD + número). Usa o DDD padrão se o cliente vier sem DDD.
  function waPhone(s, ddd) {
    let d = digits(s).replace(/^0+/, '');
    if (!d) return '';
    if (d.startsWith('55') && (d.length === 12 || d.length === 13)) return d;
    if (d.length === 10 || d.length === 11) return '55' + d;
    const dd = digits(ddd);
    if ((d.length === 8 || d.length === 9) && dd.length === 2) return '55' + dd + d;
    return '';
  }

  const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  const slug = s => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
  function initials(nome, atividade) {
    const stop = new Set(['e', 'de', 'da', 'do', 'das', 'dos', '&', 'ltda', 'me', 'epp']);
    let w = String(nome || '').trim().split(/\s+/).filter(x => x && !stop.has(x.toLowerCase()));
    if (w.length < 2) w = w.concat(String(atividade || '').trim().split(/\s+/).filter(x => x && !stop.has(x.toLowerCase())));
    if (!w.length) return '?';
    return (w[0][0] + (w[1] ? w[1][0] : '')).toUpperCase();
  }

  const STATUS = {
    aberto: { label: 'Aberto' },
    producao: { label: 'Em produção' },
    pronto: { label: 'Pronto' },
    entregue: { label: 'Entregue' },
    cancelado: { label: 'Cancelado' },
  };
  const FLOW = ['aberto', 'producao', 'pronto', 'entregue'];
  const PIX_TIPOS = { celular: 'Celular', cpf: 'CPF', cnpj: 'CNPJ', email: 'E-mail', aleatoria: 'Chave aleatória' };
  const FORMAS = ['PIX', 'Dinheiro', 'Cartão de crédito', 'Cartão de débito', 'Transferência', 'Boleto', 'A combinar'];

  const companyName = c => [c && c.nome, c && c.atividade].filter(Boolean).join(' ').trim();

  return {
    money, money2, parseMoney, parseQty, fmtQty, itemTotal, totals, pixValue,
    isoLocal, fmtDate, fmtDateTime, fmtNum, digits, fmtPhone, waPhone, norm, slug, initials,
    STATUS, FLOW, PIX_TIPOS, FORMAS, companyName,
  };
})();

/* ===== qr.js: gerador de QR Code (modo byte, níveis L/M/Q/H, versões 1–40).
   Segue o algoritmo de referência do "QR Code generator library" de Project Nayuki (licença MIT). ===== */
const QR = (() => {
  const ECL = { L: 0, M: 1, Q: 2, H: 3 };
  const FORMAT = [1, 0, 3, 2];
  const ECC_PER_BLOCK = [
    [-1, 7, 10, 15, 20, 26, 18, 20, 24, 30, 18, 20, 24, 26, 30, 22, 24, 28, 30, 28, 28, 28, 28, 30, 30, 26, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
    [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28],
    [-1, 13, 22, 18, 26, 18, 24, 18, 22, 20, 24, 28, 26, 24, 20, 30, 24, 28, 28, 26, 30, 28, 30, 30, 30, 30, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
    [-1, 17, 28, 22, 16, 22, 28, 26, 26, 24, 28, 24, 28, 22, 24, 24, 30, 28, 28, 26, 28, 30, 24, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
  ];
  const NUM_BLOCKS = [
    [-1, 1, 1, 1, 1, 1, 2, 2, 2, 2, 4, 4, 4, 4, 4, 6, 6, 6, 6, 7, 8, 8, 9, 9, 10, 12, 12, 12, 13, 14, 15, 16, 17, 18, 19, 19, 20, 21, 22, 24, 25],
    [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49],
    [-1, 1, 1, 2, 2, 4, 4, 6, 6, 8, 8, 8, 10, 12, 16, 12, 17, 16, 18, 21, 20, 23, 23, 25, 27, 29, 34, 34, 35, 38, 40, 43, 45, 48, 51, 53, 56, 59, 62, 65, 68],
    [-1, 1, 1, 2, 4, 4, 4, 5, 6, 8, 8, 11, 11, 16, 16, 18, 16, 19, 21, 25, 25, 25, 34, 30, 32, 35, 37, 40, 42, 45, 48, 51, 54, 57, 60, 63, 66, 70, 74, 77, 81],
  ];

  const getBit = (x, i) => ((x >>> i) & 1) !== 0;

  function rawModules(ver) {
    let r = (16 * ver + 128) * ver + 64;
    if (ver >= 2) {
      const na = Math.floor(ver / 7) + 2;
      r -= (25 * na - 10) * na - 55;
      if (ver >= 7) r -= 36;
    }
    return r;
  }
  const dataCodewords = (ver, ecl) => Math.floor(rawModules(ver) / 8) - ECC_PER_BLOCK[ecl][ver] * NUM_BLOCKS[ecl][ver];

  function rsMul(x, y) {
    let z = 0;
    for (let i = 7; i >= 0; i--) {
      z = (z << 1) ^ ((z >>> 7) * 0x11d);
      z ^= ((y >>> i) & 1) * x;
    }
    return z;
  }
  function rsDivisor(degree) {
    const res = new Array(degree).fill(0);
    res[degree - 1] = 1;
    let root = 1;
    for (let i = 0; i < degree; i++) {
      for (let j = 0; j < res.length; j++) {
        res[j] = rsMul(res[j], root);
        if (j + 1 < res.length) res[j] ^= res[j + 1];
      }
      root = rsMul(root, 0x02);
    }
    return res;
  }
  function rsRemainder(data, div) {
    const res = div.map(() => 0);
    for (const b of data) {
      const f = b ^ res.shift();
      res.push(0);
      div.forEach((c, i) => { res[i] ^= rsMul(c, f); });
    }
    return res;
  }

  function addEcc(data, ver, ecl) {
    const nb = NUM_BLOCKS[ecl][ver], eccLen = ECC_PER_BLOCK[ecl][ver];
    const raw = Math.floor(rawModules(ver) / 8);
    const numShort = nb - (raw % nb);
    const shortLen = Math.floor(raw / nb);
    const div = rsDivisor(eccLen);
    const blocks = [];
    for (let i = 0, k = 0; i < nb; i++) {
      const dat = data.slice(k, k + shortLen - eccLen + (i < numShort ? 0 : 1));
      k += dat.length;
      const ecc = rsRemainder(dat, div);
      if (i < numShort) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    const out = [];
    for (let i = 0; i < blocks[0].length; i++) {
      blocks.forEach((b, j) => {
        if (i !== shortLen - eccLen || j >= numShort) out.push(b[i]);
      });
    }
    return out;
  }

  function encode(text, eclName = 'M') {
    const ecl = ECL[eclName] ?? 1;
    const bytes = Array.from(new TextEncoder().encode(String(text)));
    let ver = 1, cap = 0;
    for (; ver <= 40; ver++) {
      cap = dataCodewords(ver, ecl) * 8;
      if (4 + (ver < 10 ? 8 : 16) + bytes.length * 8 <= cap) break;
    }
    if (ver > 40) throw new Error('Texto longo demais para um QR Code');

    const bb = [];
    const put = (v, len) => { for (let i = len - 1; i >= 0; i--) bb.push((v >>> i) & 1); };
    put(4, 4);
    put(bytes.length, ver < 10 ? 8 : 16);
    bytes.forEach(b => put(b, 8));
    put(0, Math.min(4, cap - bb.length));
    put(0, (8 - (bb.length % 8)) % 8);
    for (let pad = 0xec; bb.length < cap; pad ^= 0xec ^ 0x11) put(pad, 8);
    const cw = [];
    for (let i = 0; i < bb.length; i += 8) {
      let v = 0;
      for (let j = 0; j < 8; j++) v = (v << 1) | bb[i + j];
      cw.push(v);
    }
    const all = addEcc(cw, ver, ecl);

    const size = ver * 4 + 17;
    const mod = Array.from({ length: size }, () => new Array(size).fill(false));
    const fn = Array.from({ length: size }, () => new Array(size).fill(false));
    const setFn = (x, y, dark) => { mod[y][x] = dark; fn[y][x] = true; };

    for (let i = 0; i < size; i++) { setFn(6, i, i % 2 === 0); setFn(i, 6, i % 2 === 0); }
    const finder = (cx, cy) => {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const d = Math.max(Math.abs(dx), Math.abs(dy)), x = cx + dx, y = cy + dy;
        if (x >= 0 && x < size && y >= 0 && y < size) setFn(x, y, d !== 2 && d !== 4);
      }
    };
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);

    if (ver > 1) {
      const na = Math.floor(ver / 7) + 2;
      const step = Math.floor((ver * 8 + na * 3 + 5) / (na * 4 - 4)) * 2;
      const pos = [6];
      for (let p = size - 7; pos.length < na; p -= step) pos.splice(1, 0, p);
      for (let i = 0; i < na; i++) for (let j = 0; j < na; j++) {
        if ((i === 0 && j === 0) || (i === 0 && j === na - 1) || (i === na - 1 && j === 0)) continue;
        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++)
          setFn(pos[i] + dx, pos[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
      }
    }

    const drawFormat = mask => {
      const data = (FORMAT[ecl] << 3) | mask;
      let rem = data;
      for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      const bits = ((data << 10) | rem) ^ 0x5412;
      for (let i = 0; i <= 5; i++) setFn(8, i, getBit(bits, i));
      setFn(8, 7, getBit(bits, 6));
      setFn(8, 8, getBit(bits, 7));
      setFn(7, 8, getBit(bits, 8));
      for (let i = 9; i < 15; i++) setFn(14 - i, 8, getBit(bits, i));
      for (let i = 0; i < 8; i++) setFn(size - 1 - i, 8, getBit(bits, i));
      for (let i = 8; i < 15; i++) setFn(8, size - 15 + i, getBit(bits, i));
      setFn(8, size - 8, true);
    };
    drawFormat(0);
    if (ver >= 7) {
      let rem = ver;
      for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1f25);
      const bits = (ver << 12) | rem;
      for (let i = 0; i < 18; i++) {
        const b = getBit(bits, i), a = size - 11 + (i % 3), c = Math.floor(i / 3);
        setFn(a, c, b); setFn(c, a, b);
      }
    }

    let bit = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) {
        for (let j = 0; j < 2; j++) {
          const x = right - j;
          const up = ((right + 1) & 2) === 0;
          const y = up ? size - 1 - vert : vert;
          if (!fn[y][x] && bit < all.length * 8) {
            mod[y][x] = getBit(all[bit >>> 3], 7 - (bit & 7));
            bit++;
          }
        }
      }
    }

    const maskFn = [
      (x, y) => (x + y) % 2 === 0,
      (x, y) => y % 2 === 0,
      (x) => x % 3 === 0,
      (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,
      (x, y) => ((x * y) % 2) + ((x * y) % 3) === 0,
      (x, y) => (((x * y) % 2) + ((x * y) % 3)) % 2 === 0,
      (x, y) => (((x + y) % 2) + ((x * y) % 3)) % 2 === 0,
    ];
    const applyMask = m => {
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++)
        if (!fn[y][x] && maskFn[m](x, y)) mod[y][x] = !mod[y][x];
    };

    const P1 = [true, false, true, true, true, false, true, false, false, false, false];
    const P2 = [false, false, false, false, true, false, true, true, true, false, true];
    const penalty = () => {
      let s = 0;
      for (let pass = 0; pass < 2; pass++) {
        for (let a = 0; a < size; a++) {
          let run = 0, color = null;
          const line = [];
          for (let b = 0; b < size; b++) {
            const c = pass === 0 ? mod[a][b] : mod[b][a];
            line.push(c);
            if (c === color) { run++; if (run === 5) s += 3; else if (run > 5) s++; }
            else { color = c; run = 1; }
          }
          for (let b = 0; b + 11 <= size; b++) {
            let m1 = true, m2 = true;
            for (let k = 0; k < 11; k++) {
              if (line[b + k] !== P1[k]) m1 = false;
              if (line[b + k] !== P2[k]) m2 = false;
            }
            if (m1) s += 40;
            if (m2) s += 40;
          }
        }
      }
      for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++) {
        const c = mod[y][x];
        if (c === mod[y][x + 1] && c === mod[y + 1][x] && c === mod[y + 1][x + 1]) s += 3;
      }
      let dark = 0;
      for (const row of mod) for (const c of row) if (c) dark++;
      const total = size * size;
      s += (Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1) * 10;
      return s;
    };

    let best = 0, bestScore = Infinity;
    for (let m = 0; m < 8; m++) {
      applyMask(m);
      drawFormat(m);
      const sc = penalty();
      if (sc < bestScore) { best = m; bestScore = sc; }
      applyMask(m);
    }
    applyMask(best);
    drawFormat(best);
    return { version: ver, size, mask: best, modules: mod };
  }

  return { encode };
})();

/* ===== pix.js: código PIX "copia e cola" (BR Code estático, padrão EMV do Banco Central) ===== */
const PIX = (() => {
  const strip = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '');
  const clean = (s, max) => strip(s).replace(/[^A-Za-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim().toUpperCase().slice(0, max).trim();
  const field = (id, v) => id + String(v.length).padStart(2, '0') + v;

  function crc16(s) {
    let crc = 0xffff;
    for (let i = 0; i < s.length; i++) {
      crc ^= s.charCodeAt(i) << 8;
      for (let j = 0; j < 8; j++) crc = crc & 0x8000 ? ((crc << 1) ^ 0x1021) & 0xffff : (crc << 1) & 0xffff;
    }
    return crc.toString(16).toUpperCase().padStart(4, '0');
  }

  function validCPF(d) {
    d = String(d).replace(/\D/g, '');
    if (d.length !== 11 || /^(\d)\1{10}$/.test(d)) return false;
    const calc = n => {
      let s = 0;
      for (let i = 0; i < n; i++) s += Number(d[i]) * (n + 1 - i);
      const r = (s * 10) % 11;
      return r === 10 ? 0 : r;
    };
    return calc(9) === Number(d[9]) && calc(10) === Number(d[10]);
  }
  function validCNPJ(d) {
    d = String(d).replace(/\D/g, '');
    if (d.length !== 14 || /^(\d)\1{13}$/.test(d)) return false;
    const calc = n => {
      const w = n === 12 ? [5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2] : [6, 5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2];
      let s = 0;
      for (let i = 0; i < n; i++) s += Number(d[i]) * w[i];
      const r = s % 11;
      return r < 2 ? 0 : 11 - r;
    };
    return calc(12) === Number(d[12]) && calc(13) === Number(d[13]);
  }
  const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

  // Converte a chave para o formato exigido no BR Code (celular com +55, CPF/CNPJ só números...).
  function normKey(tipo, chave) {
    const raw = String(chave ?? '').trim();
    if (!raw) return '';
    const d = raw.replace(/\D/g, '');
    switch (tipo) {
      case 'celular': {
        const n = d.replace(/^0+/, '');
        if (n.startsWith('55') && (n.length === 12 || n.length === 13)) return '+' + n;
        if (n.length === 10 || n.length === 11) return '+55' + n;
        return '';
      }
      case 'cpf': return d.length === 11 ? d : '';
      case 'cnpj': return d.length === 14 ? d : '';
      case 'email': return raw.includes('@') ? raw.toLowerCase() : '';
      case 'aleatoria': return UUID.test(raw) ? raw.toLowerCase() : '';
      default: return '';
    }
  }

  // Confere a chave e devolve um aviso em português (ou '' se estiver ok).
  function checkKey(tipo, chave) {
    const raw = String(chave ?? '').trim();
    if (!raw) return 'Sem chave PIX: o pedido sai sem QR Code.';
    const d = raw.replace(/\D/g, '');
    switch (tipo) {
      case 'celular': return normKey(tipo, raw) ? '' : 'Celular precisa ter DDD + número (ex.: 71 98675-2251).';
      case 'cpf': return validCPF(d) ? '' : 'Esse CPF não é válido. Confira os números.';
      case 'cnpj': return validCNPJ(d) ? '' : 'Esse CNPJ não é válido. Confira os números.';
      case 'email': return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(raw) ? '' : 'E-mail inválido.';

  function guessTipo(chave) {
    const raw = String(chave ?? '').trim(), d = raw.replace(/\D/g, '');
    if (!raw) return '';
    if (raw.includes('@')) return 'email';
    if (UUID.test(raw)) return 'aleatoria';
    if (raw.startsWith('+')) return 'celular';
    if (d.length === 14) return 'cnpj';
    if (d.length === 11) return validCPF(d) ? 'cpf' : 'celular';
    if (d.length === 10 || d.length === 12 || d.length === 13) return 'celular';
    return '';
  }

  function payload({ tipo, chave, nome, cidade, valorCentavos, descricao }) {
    const key = normKey(tipo, chave);
    if (!key) return '';
    let mai = field('00', 'br.gov.bcb.pix') + field('01', key);
    const desc = strip(descricao).replace(/[^A-Za-z0-9 ]/g, '').trim();
    const room = 99 - mai.length - 4;
    if (desc && room > 0) mai += field('02', desc.slice(0, room));

    p += field('62', field('05', '***'));
    p += '6304';
    return p + crc16(p);
  }

  return { payload, crc16, normKey, checkKey, guessTipo, validCPF, validCNPJ };
})();

    }

    function received(H) {

      } else if (ent && o.recebidoPor) {

      else T('____/____/________', dx + w2 + 8, base, 9, { color: C.rule });

    function footer() {

      band(FP.bandH);
      y += FP.bandH + 8;

        lab('OBSERVAÇÕES', X0 + 10, y + 15);
        FP.obsLines.forEach((l, i) => T(l, X0 + 10, y + 30 + i * 11.5, 9.5));

    newPage(true);

    pages.forEach((p, i) => {
      p.push({ t: 'text', s: `${c.nome || ''}: pedido Nº ${numStr}. Documento sem valor fiscal.`.replace(/^: /, ''), x: X0, y: PAGE.h - M + 4, size: 7, bold: false, color: C.muted, align: 'left' });
      p.push({ t: 'text', s: `Página ${i + 1} de ${pages.length}`, x: X1, y: PAGE.h - M + 4, size: 7, bold: false, color: C.muted, align: 'right' });
    });
    return { pages, pixCode, qr };
  }

  /* ---------- Desenho em canvas (prévia, imagem e impressão) ---------- */
  const FONT = 'Helvetica, Arial, "Liberation Sans", "Nimbus Sans", "Helvetica Neue", sans-serif';
  function canvasRect(ctx, o) {
    const [tl, tr, br, bl] = o.rr || [o.r, o.r, o.r, o.r].map(v => Math.min(v || 0, o.w / 2, o.h / 2));
    const { x, y, w, h } = o;
    ctx.moveTo(x + tl, y);
    ctx.lineTo(x + w - tr, y);
    tr ? ctx.arcTo(x + w, y, x + w, y + tr, tr) : ctx.lineTo(x + w, y);
    ctx.lineTo(x + w, y + h - br);
    br ? ctx.arcTo(x + w, y + h, x + w - br, y + h, br) : ctx.lineTo(x + w, y + h);
    ctx.lineTo(x + bl, y + h);
    bl ? ctx.arcTo(x, y + h, x, y + h - bl, bl) : ctx.lineTo(x, y + h);
    ctx.lineTo(x, y + tl);
    tl ? ctx.arcTo(x, y, x + tl, y, tl) : ctx.lineTo(x, y);
    ctx.closePath();
  }
  function drawCanvas(ctx, ops, scale, imgs = {}) {
    ctx.save();
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, PAGE.w, PAGE.h);
    for (const o of ops) {
      if (o.t === 'rect') {
        ctx.beginPath();
        canvasRect(ctx, o);
        if (o.fill) { ctx.fillStyle = o.fill; ctx.fill(); }
        if (o.stroke) { ctx.setLineDash([]); ctx.lineWidth = o.lw; ctx.strokeStyle = o.stroke; ctx.stroke(); }
      } else if (o.t === 'line') {
        ctx.beginPath();
        ctx.moveTo(o.x1, o.y1);
        ctx.lineTo(o.x2, o.y2);
        ctx.setLineDash(o.dash || []);
        ctx.lineWidth = o.lw;
        ctx.strokeStyle = o.color;
        ctx.stroke();
      } else if (o.t === 'text') {
        ctx.font = `${o.bold ? 700 : 400} ${o.size}px ${FONT}`;
        ctx.fillStyle = o.color;
        ctx.textAlign = o.align || 'left';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText(o.s, o.x, o.y, Math.max(1, width(o.s, o.size, o.bold) * 1.04 + 0.5));
      } else if (o.t === 'img') {
        const im = imgs[o.key];
        if (im && (im.complete === undefined || im.complete)) { try { ctx.drawImage(im, o.x, o.y, o.w, o.h); } catch (e) { /* imagem indisponível */ } }
      } else if (o.t === 'qr') {
        const n = o.m.length, ms = o.size / n;
        ctx.fillStyle = '#000';
        for (let r = 0; r < n; r++) {
          let x = 0;
          while (x < n) {
            if (o.m[r][x]) {
              let e = x;
              while (e < n && o.m[r][e]) e++;
              ctx.fillRect(o.x + x * ms, o.y + r * ms, (e - x) * ms + 0.04, ms + 0.04);
              x = e;
            } else x++;
          }
        }
      }
    }
    ctx.restore();
  }

  /* ---------- PDF vetorial (Helvetica, sem bibliotecas) ---------- */
  const f2 = v => { const r = Math.round(v * 100) / 100; return Object.is(r, -0) ? '0' : String(r); };
  const rgb = hex => {
    const h = String(hex).replace('#', '');
    const n = parseInt(h.length === 3 ? h.replace(/./g, ch => ch + ch) : h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => f2(v / 255)).join(' ');
  };
  const latin1 = s => { const a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i) & 255; return a; };
  const pdfStr = bytes => { let s = ''; for (const b of bytes) s += b === 40 || b === 41 || b === 92 ? '\\' + String.fromCharCode(b) : String.fromCharCode(b); return s; };
  const pdfUtf16 = s => { let h = 'FEFF'; for (let i = 0; i < s.length; i++) h += s.charCodeAt(i).toString(16).padStart(4, '0').toUpperCase(); return '<' + h + '>'; };
  const pdfDate = d => {
    const p = n => String(n).padStart(2, '0');
    const off = -d.getTimezoneOffset(), a = Math.abs(off);
    return `D:${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}${off >= 0 ? '+' : '-'}${p(Math.floor(a / 60))}'${p(a % 60)}'`;
  };
  function pdfRectPath(o, H) {
    const [tl, tr, br, bl] = (o.rr || [o.r, o.r, o.r, o.r]).map(v => Math.min(v || 0, o.w / 2, o.h / 2));
    const x = o.x, y = H - o.y - o.h, w = o.w, h = o.h, k = 0.5523;
    if (!tl && !tr && !br && !bl) return `${f2(x)} ${f2(y)} ${f2(w)} ${f2(h)} re\n`;
    // y aqui é a base (PDF cresce para cima): bl/br embaixo, tl/tr em cima
    let p = `${f2(x + bl)} ${f2(y)} m ${f2(x + w - br)} ${f2(y)} l `;
    if (br) p += `${f2(x + w - br + br * k)} ${f2(y)} ${f2(x + w)} ${f2(y + br - br * k)} ${f2(x + w)} ${f2(y + br)} c `;
    p += `${f2(x + w)} ${f2(y + h - tr)} l `;
    if (tr) p += `${f2(x + w)} ${f2(y + h - tr + tr * k)} ${f2(x + w - tr + tr * k)} ${f2(y + h)} ${f2(x + w - tr)} ${f2(y + h)} c `;
    p += `${f2(x + tl)} ${f2(y + h)} l `;
    if (tl) p += `${f2(x + tl - tl * k)} ${f2(y + h)} ${f2(x)} ${f2(y + h - tl + tl * k)} ${f2(x)} ${f2(y + h - tl)} c `;
    p += `${f2(x)} ${f2(y + bl)} l `;
    if (bl) p += `${f2(x)} ${f2(y + bl - bl * k)} ${f2(x + bl - bl * k)} ${f2(y)} ${f2(x + bl)} ${f2(y)} c `;
    return p + 'h\n';
  }
  function opsToPdf(ops) {
    const H = PAGE.h;
    let s = '';
    for (const o of ops) {
      if (o.t === 'rect') {
        const path = pdfRectPath(o, H);
        if (o.fill && o.stroke) s += `${rgb(o.fill)} rg ${rgb(o.stroke)} RG ${f2(o.lw)} w [] 0 d\n${path}B\n`;
        else if (o.fill) s += `${rgb(o.fill)} rg\n${path}f\n`;
        else if (o.stroke) s += `${rgb(o.stroke)} RG ${f2(o.lw)} w [] 0 d\n${path}S\n`;
      } else if (o.t === 'line') {
        s += `${rgb(o.color)} RG ${f2(o.lw)} w ${o.dash ? `[${o.dash.join(' ')}] 0 d` : '[] 0 d'}\n${f2(o.x1)} ${f2(H - o.y1)} m ${f2(o.x2)} ${f2(H - o.y2)} l S\n`;
      } else if (o.t === 'text') {
        const bytes = toWin(o.s);
        if (!bytes.length) continue;
        const w = widthBytes(bytes, o.size, o.bold);
        let x = o.x;
        if (o.align === 'right') x -= w; else if (o.align === 'center') x -= w / 2;
        s += `BT /${o.bold ? 'F2' : 'F1'} ${f2(o.size)} Tf ${rgb(o.color)} rg ${f2(x)} ${f2(H - o.y)} Td (${pdfStr(bytes)}) Tj ET\n`;
      } else if (o.t === 'img') {
        s += `q ${f2(o.w)} 0 0 ${f2(o.h)} ${f2(o.x)} ${f2(H - o.y - o.h)} cm /${o.key === 'logo' ? 'ImLogo' : 'ImSig'} Do Q\n`;
      } else if (o.t === 'qr') {
        const n = o.m.length, ms = o.size / n;
        let p = '0 0 0 rg\n';
        for (let r = 0; r < n; r++) {
          let x = 0;
          while (x < n) {
            if (o.m[r][x]) {
              let e = x;
              while (e < n && o.m[r][e]) e++;
              p += `${f2(o.x + x * ms)} ${f2(H - o.y - (r + 1) * ms)} ${f2((e - x) * ms)} ${f2(ms)} re\n`;
              x = e;
            } else x++;
          }
        }
        s += p + 'f\n';
      }
    }
    return s;
  }

  // imgs: { logo: {bytes,w,h,comps}, sig: {...} } (JPEG)
  function pdf(pages, meta = {}, imgs = {}) {
    const used = new Set();
    pages.forEach(p => p.forEach(o => { if (o.t === 'img' && imgs[o.key]) used.add(o.key); }));
    const keys = [...used];
    const chunks = [];
    let offset = 0;
    const offsets = [];
    const push = b => { chunks.push(b); offset += b.length; };
    const pushS = s => push(latin1(s));
    let n = 6;
    const imgNum = {};
    keys.forEach(k => { imgNum[k] = n++; });
    const pageNums = pages.map(() => [n++, n++]);
    const size = n;
    pushS('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    const obj = (num, body) => { offsets[num] = offset; pushS(`${num} 0 obj\n${body}\nendobj\n`); };
    const objStream = (num, dict, bytes) => {
      offsets[num] = offset;
      pushS(`${num} 0 obj\n${dict.replace(/>>$/, `/Length ${bytes.length} >>`)}\nstream\n`);
      push(bytes);
      pushS('\nendstream\nendobj\n');
    };
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, `<< /Type /Pages /Kids [${pageNums.map(([p]) => p + ' 0 R').join(' ')}] /Count ${pages.length} >>`);
    obj(3, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    obj(4, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    obj(5, `<< /Title ${pdfUtf16(meta.title || 'Pedido')} /Author ${pdfUtf16(meta.author || '')} /Producer (Talao digital de pedidos) /CreationDate (${pdfDate(new Date())}) >>`);
    keys.forEach(k => {
      const im = imgs[k];
      const cs = im.comps === 1 ? 'DeviceGray' : im.comps === 4 ? 'DeviceCMYK' : 'DeviceRGB';
      objStream(imgNum[k], `<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /${cs} /BitsPerComponent 8 /Filter /DCTDecode >>`, im.bytes);
    });
    const xres = keys.length ? `/XObject << ${keys.map(k => `/${k === 'logo' ? 'ImLogo' : 'ImSig'} ${imgNum[k]} 0 R`).join(' ')} >>` : '';
    pages.forEach((ops, i) => {
      const [p, cnum] = pageNums[i];
      const okOps = ops.filter(o => o.t !== 'img' || used.has(o.key));
      obj(p, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PAGE.w} ${PAGE.h}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> ${xres} >> /Contents ${cnum} 0 R >>`);
      objStream(cnum, '<< >>', latin1(opsToPdf(okOps)));
    });
    const xref = offset;
    let x = `xref\n0 ${size}\n0000000000 65535 f \n`;
    for (let i = 1; i < size; i++) x += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
    pushS(x);
    pushS(`trailer\n<< /Size ${size} /Root 1 0 R /Info 5 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
    const out = new Uint8Array(offset);
    let pos = 0;
    for (const ch of chunks) { out.set(ch, pos); pos += ch.length; }
    return out;
  }

  /* ---------- JPEG (logo e assinatura) ---------- */
  function jpegInfo(b) {
    if (!b || b[0] !== 0xff || b[1] !== 0xd8) return null;
    let i = 2;
    while (i + 9 < b.length) {
      if (b[i] !== 0xff) { i++; continue; }
      const m = b[i + 1];
      if (m === 0xff) { i++; continue; }
      if (m === 0xd8 || m === 0x01 || (m >= 0xd0 && m <= 0xd7)) { i += 2; continue; }
      const len = (b[i + 2] << 8) | b[i + 3];
      if ((m >= 0xc0 && m <= 0xc3) || (m >= 0xc5 && m <= 0xc7) || (m >= 0xc9 && m <= 0xcb) || (m >= 0xcd && m <= 0xcf)) {
        return { h: (b[i + 5] << 8) | b[i + 6], w: (b[i + 7] << 8) | b[i + 8], comps: b[i + 9] };
      }
      i += 2 + len;
    }
    return null;
  }
  function dataUrlBytes(src) {
    const b64 = String(src || '').split(',')[1] || '';
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function jpegFromDataUrl(src) {
    try {
      const bytes = dataUrlBytes(src);
      const info = jpegInfo(bytes);
      return info ? { bytes, ...info } : null;
    } catch (e) { return null; }
  }

  return { PAGE, layout, drawCanvas, pdf, jpegFromDataUrl, width, wrap };
})();

/* ===== nuvem.js: backup na nuvem com Firebase (Authentication + Cloud Firestore pela API REST, sem SDK) ===== */
const NUVEM = (() => {
  const EP = {
    auth: 'https://identitytoolkit.googleapis.com/v1',
    token: 'https://securetoken.googleapis.com/v1',
    fs: 'https://firestore.googleapis.com/v1',
  };
  // Testes automáticos podem apontar para um servidor falso definindo window.__NUVEM_EP__ antes do app carregar.
  if (typeof window !== 'undefined' && window.__NUVEM_EP__) Object.assign(EP, window.__NUVEM_EP__);
  // Gravações por envio. As regras consultam "membros" a cada gravação e o Firestore aceita até 20 consultas por envio.
  const LOTE = 10;

  const MSG = {
    INVALID_LOGIN_CREDENTIALS: 'E-mail ou senha incorretos.',
    INVALID_PASSWORD: 'E-mail ou senha incorretos.',
    EMAIL_NOT_FOUND: 'E-mail ou senha incorretos.',
    INVALID_EMAIL: 'Esse e-mail não é válido.',
    MISSING_PASSWORD: 'Digite a senha.',
    USER_DISABLED: 'Este usuário está desativado no Firebase.',
    TOO_MANY_ATTEMPTS_TRY_LATER: 'Muitas tentativas seguidas. Espere alguns minutos e tente de novo.',
    PASSWORD_LOGIN_DISABLED: 'O login por e-mail e senha não está ativado no Firebase (Authentication, Método de login).',
    OPERATION_NOT_ALLOWED: 'O login por e-mail e senha não está ativado no Firebase (Authentication, Método de login).',
    API_KEY_INVALID: 'A apiKey não confere. Copie de novo a configuração do Firebase.',
    CONFIGURATION_NOT_FOUND: 'O Authentication ainda não foi ativado nesse projeto do Firebase.',
    TOKEN_EXPIRED: 'A sessão do backup expirou. Entre de novo em Ajustes.',
    INVALID_REFRESH_TOKEN: 'A sessão do backup expirou. Entre de novo em Ajustes.',
    INVALID_ID_TOKEN: 'A sessão do backup expirou. Entre de novo em Ajustes.',
    USER_NOT_FOUND: 'Esse usuário não existe mais no Firebase. Entre de novo em Ajustes.',
    PERMISSION_DENIED: 'O Firebase recusou a gravação. Confira se as regras foram publicadas e se o usuário está em "membros".',
    NOT_FOUND: 'Banco não encontrado. Confira o projectId e se o Firestore Database foi criado.',
    FAILED_PRECONDITION: 'O Firestore Database ainda não foi criado nesse projeto.',
    RESOURCE_EXHAUSTED: 'O limite gratuito diário do Firebase acabou. O envio volta a funcionar amanhã.',
    UNAVAILABLE: 'O Firebase não respondeu agora. O app tenta de novo sozinho.',
  };
  const SESSAO_MORTA = new Set(['TOKEN_EXPIRED', 'INVALID_REFRESH_TOKEN', 'INVALID_ID_TOKEN', 'USER_NOT_FOUND', 'USER_DISABLED']);

  class Erro extends Error {
    constructor(msg, code, status) { super(msg); this.code = code; this.status = status; }
  }

  async function call(url, opts) {
    let res;
    try { res = await fetch(url, opts); } catch (e) { throw new Erro('Sem conexão com a internet.', 'OFFLINE', 0); }
    const txt = await res.text();
    let body = null;
    try { body = txt ? JSON.parse(txt) : null; } catch (e) { body = null; }
    if (!res.ok) {
      const err = (Array.isArray(body) ? body[0] && body[0].error : body && body.error) || {};
      const code = String(err.status || err.message || res.status).trim().split(/[\s:]/)[0];
      throw new Erro(MSG[code] || `Erro do Firebase (${res.status}): ${err.message || code}`, code, res.status);
    }
    return body;
  }

  const V = {
    s: x => ({ stringValue: String(x ?? '') }),
    i: x => ({ integerValue: String(Math.round(Number(x) || 0)) }),
    b: x => ({ booleanValue: !!x }),
  };
  const ler = {
    n: f => (f ? Number(f.integerValue ?? f.doubleValue ?? 0) : 0),
    s: f => (f && f.stringValue) || '',
    b: f => !!(f && f.booleanValue),
    t: f => (f && f.timestampValue) || '',
  };
  function decode(doc) {
    const f = doc.fields || {};
    let dados = null;
    try { dados = JSON.parse(ler.s(f.json) || 'null'); } catch (e) { dados = null; }
    return {
      id: decodeURIComponent(String(doc.name || '').split('/').pop()), name: doc.name,
      numero: ler.n(f.numero), atualizadoEm: ler.n(f.atualizadoEm), excluido: ler.b(f.excluido),
      servidorEm: ler.t(f.servidorEm), por: ler.s(f.por), dados,
    };
  }
  const tempo = s => { const t = Date.parse(s); return isNaN(t) ? 0 : t; };

  // Aceita o bloco "firebaseConfig" copiado do console (JS ou JSON) e tira só o que o app usa.
  function lerConfig(txt) {
    const s = String(txt || '');
    const pick = k => { const m = s.match(new RegExp(`["']?${k}["']?\\s*[:=]\\s*["'\`]([^"'\`\\s]+)["'\`]`)); return m ? m[1].trim() : ''; };
    return { apiKey: pick('apiKey'), projectId: pick('projectId') };
  }
  function conferirConfig({ apiKey, projectId }) {
    if (!apiKey || !projectId) return 'Não achei apiKey e projectId no texto colado. Copie o bloco firebaseConfig inteiro.';
    if (!/^[A-Za-z0-9_-]{20,}$/.test(apiKey)) return 'A apiKey parece incompleta. Copie o bloco firebaseConfig de novo.';
    if (!/^[a-z0-9][a-z0-9-]{3,}$/.test(projectId)) return 'O projectId parece errado. Copie o bloco firebaseConfig de novo.';
    return '';
  }

  // Uma sessão de backup. "estado" é guardado pelo app (salvar) e volta na próxima abertura.
  function sessao(estado, salvar) {
    let st = estado || null;
    const save = () => salvar(st);
    const base = () => `${EP.fs}/projects/${encodeURIComponent(st.projectId)}/databases/(default)/documents`;
    const nome = (col, id) => `projects/${st.projectId}/databases/(default)/documents/${col}/${id}`;

    async function token(force) {
      if (!st || !st.refreshToken) throw new Erro('Entre na conta do backup em Ajustes.', 'SEM_SESSAO', 0);
      if (!force && st.idToken && Date.now() < st.expiresAt - 120000) return st.idToken;
      let b;
      try {
        b = await call(`${EP.token}/token?key=${encodeURIComponent(st.apiKey)}`, {
          method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(st.refreshToken),
        });
      } catch (e) {
        if (SESSAO_MORTA.has(e.code)) { st.idToken = ''; st.refreshToken = ''; st.motivo = 'sessao'; await save(); }
        throw e;
      }
      st.idToken = b.id_token;
      st.refreshToken = b.refresh_token || st.refreshToken;
      st.expiresAt = Date.now() + (Number(b.expires_in) || 3600) * 1000;
      await save();
      return st.idToken;
    }
    async function fs(path, opts = {}, retry = true) {
      const t = await token(false);
      try {
        return await call(base() + path, { ...opts, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + t } });
      } catch (e) {
        if (retry && e.status === 401) { await token(true); return fs(path, opts, false); }
        throw e;
      }
    }

    async function entrar({ apiKey, projectId, email, senha }) {
      const b = await call(`${EP.auth}/accounts:signInWithPassword?key=${encodeURIComponent(apiKey)}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password: senha, returnSecureToken: true }),
      });
      st = {
        apiKey, projectId, email: b.email || email, uid: b.localId, idToken: b.idToken, refreshToken: b.refreshToken,
        expiresAt: Date.now() + (Number(b.expiresIn) || 3600) * 1000, membro: null, motivo: '', lastPull: '', ultimoEnvio: 0,
      };
      await save();
      await verificarMembro();
      return st;
    }
    // Só quem tem um documento em "membros" com o próprio UID acessa os pedidos.
    async function verificarMembro() {
      try {
        await fs(`/membros/${encodeURIComponent(st.uid)}`);
        st.membro = true;
        st.motivo = '';
      } catch (e) {
        if (e.status === 404) { st.membro = false; st.motivo = 'nao-liberado'; }
        else if (e.status === 403) { st.membro = false; st.motivo = 'sem-regras'; }
        else throw e;
      }
      await save();
      return st.membro;
    }

    function escrita(x) {
      return {
        update: { name: nome(x.col, x.id), fields: { ...x.fields, por: V.s(st.email) } },
        updateTransforms: [{ fieldPath: 'servidorEm', setToServerValue: 'REQUEST_TIME' }],
      };
    }
    // itens: [{ col, id, fields, ... }] -> { ok: [...itens], recusados: [...itens] }
    async function gravar(itens) {
      const ok = [], recusados = [];
      const commit = writes => fs(':commit', { method: 'POST', body: JSON.stringify({ writes }) });
      for (let i = 0; i < itens.length; i += LOTE) {
        const lote = itens.slice(i, i + LOTE);
        try {
          await commit(lote.map(escrita));
          ok.push(...lote);
        } catch (e) {
          if (e.code !== 'PERMISSION_DENIED') throw e;
          for (const x of lote) {
            try { await commit([escrita(x)]); ok.push(x); } catch (e2) { if (e2.code === 'PERMISSION_DENIED') recusados.push(x); else throw e2; }
          }
        }
      }
      if (recusados.length && !(await verificarMembro())) {
        throw new Erro(st.motivo === 'sem-regras' ? MSG.PERMISSION_DENIED : 'Seu usuário ainda não foi liberado no Firebase (coleção "membros").', 'NAO_LIBERADO', 403);
      }
      if (ok.length) { st.ultimoEnvio = Date.now(); await save(); }
      return { ok, recusados };
    }
    async function lerDoc(col, id) {
      try { return decode(await fs(`/${col}/${encodeURIComponent(id)}`)); } catch (e) { if (e.status === 404) return null; throw e; }
    }
    // Pedidos alterados na nuvem desde a última busca (com folga de 15 s).
    async function novidades() {
      const desde = st.lastPull ? new Date(Math.max(0, tempo(st.lastPull) - 15000)).toISOString() : '1970-01-01T00:00:00Z';
      const out = [];
      let cursor = null, max = st.lastPull || '';
      for (let pag = 0; pag < 200; pag++) {
        const q = {
          structuredQuery: {
            from: [{ collectionId: 'pedidos' }],
            where: { fieldFilter: { field: { fieldPath: 'servidorEm' }, op: 'GREATER_THAN', value: { timestampValue: desde } } },
            orderBy: [{ field: { fieldPath: 'servidorEm' }, direction: 'ASCENDING' }, { field: { fieldPath: '__name__' }, direction: 'ASCENDING' }],
            limit: 100,
          },
        };
        if (cursor) q.structuredQuery.startAt = { values: [{ timestampValue: cursor.t }, { referenceValue: cursor.name }], before: false };
        const res = await fs(':runQuery', { method: 'POST', body: JSON.stringify(q) });
        const docs = (Array.isArray(res) ? res : []).map(r => r && r.document).filter(Boolean).map(decode);
        out.push(...docs);
        docs.forEach(d => { if (tempo(d.servidorEm) > tempo(max)) max = d.servidorEm; });
        if (docs.length < 100) break;
        const last = docs[docs.length - 1];
        cursor = { t: last.servidorEm, name: last.name };
      }
      if (max) st.lastPull = max;
      await save();
      return out;
    }
    // Todos os pedidos da nuvem (para restaurar num aparelho novo).
    async function todos() {
      const out = [];
      let tok = '';
      for (let pag = 0; pag < 500; pag++) {
        const res = await fs(`/pedidos?pageSize=200${tok ? '&pageToken=' + encodeURIComponent(tok) : ''}`);
        ((res && res.documents) || []).forEach(d => out.push(decode(d)));
        tok = res && res.nextPageToken;
        if (!tok) break;
      }
      return out;
    }
    async function marcarLeitura(ts) { if (tempo(ts) > tempo(st.lastPull)) { st.lastPull = ts; await save(); } }
    async function sair() { st = null; await save(); }

    return {
      get estado() { return st; },
      ligado: () => !!(st && st.refreshToken),
      liberado: () => !!(st && st.refreshToken && st.membro),
      entrar, verificarMembro, gravar, lerDoc, novidades, todos, marcarLeitura, sair,
    };
  }

  return { sessao, lerConfig, conferirConfig, V, Erro, tempo, setEndpoints: e => Object.assign(EP, e) };
})();

  function statusNuvemTexto() {
    const n = pendentesN();
    switch (Sync.status) {
      case 'enviando': return 'Enviando para a nuvem…';
      case 'offline': return n ? `Sem internet: ${n} ${n === 1 ? 'alteração espera' : 'alterações esperam'} para ir para a nuvem.` : 'Sem internet agora. O backup continua quando a conexão voltar.';
      case 'erro': return `<span class="bad">${esc(Sync.msg || 'O backup na nuvem falhou.')}</span>`;
      case 'bloqueado': return '<span class="bad">Usuário ainda não liberado no Firebase.</span>';
      case 'ok': return n ? `${n} ${n === 1 ? 'alteração esperando' : 'alterações esperando'} envio.` : `Tudo na nuvem${Sync.at ? ', ' + desde(Sync.at) : ''}.`;
      default: return '';
    }
  }
  function linhaNuvemLista() {
    if (!nuvemLigada()) return '';
    const aviso = Sync.status === 'erro' || Sync.status === 'bloqueado' ? ' <a href="#/ajustes">Ver ajustes</a>' : '';
    return `${I.cloud}<span>${statusNuvemTexto()}${aviso}</span>`;
  }
  function tratarErroNuvem(e) {
    if (e && e.code === 'OFFLINE') return setSync('offline');
    if (e && e.code === 'NAO_LIBERADO') return setSync('bloqueado', e.message);
    setSync('erro', (e && e.message) || 'O backup na nuvem falhou.');
  }

  async function sincronizar() {
    if (!nuvemOk()) { setSync(nuvemLigada() ? 'bloqueado' : 'off'); return false; }
    if (Sync.busy) { Sync.again = true; return false; }
    if (navigator.onLine === false) { setSync('offline'); return false; }
    Sync.busy = true;
    setSync('enviando');
    try {
      // Primeiro traz o que mudou nos outros aparelhos (resolve número repetido antes de enviar), depois envia.
      await trazerNovidades();
      await enviarPendentes();
      if (Sync.problema) setSync('erro', Sync.problema); else setSync('ok');
      return true;
    } catch (e) {
      tratarErroNuvem(e);
      return false;
    } finally {
      Sync.busy = false;
      if (Sync.again) { Sync.again = false; agendarSync(); }
    }
  }
  async function enviarPendentes() {
    const itens = [];
    for (const id of [...Sync.pend]) {
      const o = byId(id);
      if (o) itens.push({ col: 'pedidos', id, ref: id, at: o.updatedAt || 0, fields: camposPedido(o, false) });
      else Sync.pend.delete(id);
    }
    for (const [id, o] of Object.entries(Sync.tumulos)) itens.push({ col: 'pedidos', id, ref: id, at: o.updatedAt || 0, tumulo: true, fields: camposPedido(o, true) });
    if (Sync.cfgPend) itens.push({ col: 'ajustes', id: 'empresa', ref: 'cfg', at: S.cfg.updatedAt || 0, fields: camposAjustes() });
    Sync.problema = '';
    if (!itens.length) return;
    const { ok, recusados } = await Sync.s.gravar(itens);
    ok.forEach(x => {
      if (x.ref === 'cfg') Sync.cfgPend = (S.cfg.updatedAt || 0) !== x.at;
      else if (x.tumulo) delete Sync.tumulos[x.ref];
      else if (((byId(x.ref) || {}).updatedAt || 0) === x.at) Sync.pend.delete(x.ref);
    });
    for (const x of recusados) {
      const remoto = await Sync.s.lerDoc(x.col, x.id);
      if (remoto && remoto.atualizadoEm >= x.at) {
        // A nuvem já tem uma versão mais nova, feita em outro aparelho: fica a da nuvem.
        if (x.ref === 'cfg') { Sync.cfgPend = false; await aplicarAjustes(remoto, true); }
        else { delete Sync.tumulos[x.ref]; Sync.pend.delete(x.ref); await aplicarRemotos([remoto], true); }
      } else {
        const num = (byId(x.ref) || Sync.tumulos[x.ref] || {}).numero;
        Sync.problema = x.ref === 'cfg' ? 'Os ajustes não puderam ir para a nuvem.' : `O pedido Nº ${U.fmtNum(num)} não pôde ir para a nuvem.`;
      }
    }
    persistSync();
  }
  async function trazerNovidades() {
    const docs = await Sync.s.novidades();
    await aplicarRemotos(docs, true);
    const c = await Sync.s.lerDoc('ajustes', 'empresa');
    if (c) await aplicarAjustes(c, false);
  }
  async function aplicarAjustes(c, forcar) {
    if (!c || !c.dados || typeof c.dados !== 'object') return false;
    if (!forcar && (Sync.cfgPend || c.atualizadoEm <= (S.cfg.updatedAt || 0))) return false;
    const local = {};
    LOCAL_CFG.forEach(k => { local[k] = S.cfg[k]; });
    S.cfg = Object.assign(clone(DEFAULT_CFG), c.dados, local, { updatedAt: c.atualizadoEm });
    await saveCfg();
    updateBrand();
    if (S.route === 'ajustes' && !document.querySelector('.modal-wrap')) viewSettings();
    return true;
  }
  async function aplicarRemotos(docs, redesenhar) {
    let mudou = 0;
    for (const d of docs) {
      if (!d || !d.id || !d.dados) continue;
      const local = byId(d.id);
      const localAt = local ? local.updatedAt || 0 : -1;
      const tumulo = Sync.tumulos[d.id];
      if (tumulo && (tumulo.updatedAt || 0) >= d.atualizadoEm) continue;
      if (Sync.pend.has(d.id) && localAt > d.atualizadoEm) continue;
      if (d.excluido) {
        if (local && localAt <= d.atualizadoEm) {
          await Store.delOrder(d.id);
          S.orders = S.orders.filter(x => x.id !== d.id);
          Sync.pend.delete(d.id);
          mudou++;
        }
        continue;
      }
      if (!local || d.atualizadoEm > localAt) {
        const o = sanitizeOrder(d.dados);
        if (!o) continue;
        o.updatedAt = d.atualizadoEm;
        await Store.putOrder(o);
        const i = S.orders.findIndex(x => x.id === o.id);
        if (i >= 0) S.orders[i] = o; else S.orders.push(o);
        Sync.pend.delete(o.id);
        mudou++;
      }
    }
    if (mudou) {
      await resolverNumerosRepetidos();
      persistSync();
      if (redesenhar) redesenharDepoisDaNuvem();
    }
    return mudou;
  }
  // Dois aparelhos sem internet podem dar o mesmo número. O pedido que ainda não subiu para a nuvem cede o número.
  async function resolverNumerosRepetidos() {
    const grupos = new Map();
    S.orders.forEach(o => { const g = grupos.get(o.numero) || []; g.push(o); grupos.set(o.numero, g); });
    for (const g of grupos.values()) {
      let resto = g.length;
      for (const o of g) {
        if (resto < 2) break;
        if (!Sync.pend.has(o.id)) continue;
        const antigo = o.numero;
        o.numero = nextNumber();
        o.updatedAt = Date.now();
        await Store.putOrder(o);
        resto--;
        toast(`O pedido Nº ${U.fmtNum(antigo)} deste aparelho passou a ser Nº ${U.fmtNum(o.numero)}: outro aparelho já tinha usado esse número.`);
      }
    }
  }
  function redesenharDepoisDaNuvem() {
    if (document.querySelector('.modal-wrap')) return;
    if (S.route === 'historico') {
      const q = $('#q');
      if (q && document.activeElement === q) { const s = $('#slips'); if (s) s.innerHTML = slipsHtml(); } else viewList();
    } else if (S.route === 'pedido' && !S.dirty) {
      if (byId(S.currentId)) viewSheet(S.currentId, { keepScroll: true }); else go('#/historico');
    }
  }
  async function puxarRapido() {
    if (!nuvemOk() || navigator.onLine === false) return;
    try { await Promise.race([trazerNovidades(), new Promise(r => setTimeout(r, 2500))]); } catch (e) { /* segue com o número deste aparelho */ }
  }
  // Primeira conexão neste aparelho: traz o que está na nuvem e manda o que só existe aqui.
  async function conectarNuvem() {
    setSync('enviando');
    try {
      const docs = await Sync.s.todos();
      await aplicarRemotos(docs, false);
      const remoto = new Map(docs.map(d => [d.id, d.atualizadoEm]));
      S.orders.forEach(o => { if (!remoto.has(o.id) || (o.updatedAt || 0) > remoto.get(o.id)) Sync.pend.add(o.id); });
      let maxT = '';
      docs.forEach(d => { if (NUVEM.tempo(d.servidorEm) > NUVEM.tempo(maxT)) maxT = d.servidorEm; });
      if (maxT) await Sync.s.marcarLeitura(maxT);
      const c = await Sync.s.lerDoc('ajustes', 'empresa');
      if (c && c.atualizadoEm > (S.cfg.updatedAt || 0)) await aplicarAjustes(c, true); else Sync.cfgPend = true;
      persistSync();
    } catch (e) { tratarErroNuvem(e); return false; }
    return sincronizar();
  }

  /* ---------- PIX, mensagens e arquivos ---------- */
  function pixCodeFor(o) {
    const v = U.pixValue(o), c = S.cfg;
    if (!v || !String(c.pixChave || '').trim()) return '';
    return PIX.payload({ tipo: c.pixTipo, chave: c.pixChave, nome: c.pixNome || c.nome, cidade: c.pixCidade, valorCentavos: v, descricao: 'Pedido ' + U.fmtNum(o.numero) });
  }
  const pixAvailable = o => o.status !== 'cancelado' && !!pixCodeFor(o);

  // Nome para a saudação: "Maria Souza" vira "Maria"; "Escola X (Ana)" vira "Ana"; nome de instituição sem contato fica sem nome.
  const ORG_PREFIX = /^(associa|condom|funda[cç]|cooperativ|sindicat|universidad|faculdad|transportador|construtor|supermercad)/i;
  const ORG_WORD = /^(escola|col[eé]gio|creche|igreja|time|clube|empresa|loja|grupo|academia|cl[ií]nica|hospital|restaurante|mercado|farm[aá]cia|prefeitura|secretaria|instituto|centro|projeto|equipe|banda|par[oó]quia|ong|oficina|ateli[eê]|est[uú]dio)(?=[\s,.()-]|$)/i;
  function greetName(nome) {
    const n = String(nome || '').trim();
    const par = n.match(/\(([^)]+)\)/);
    if (par) return par[1].trim().split(/\s+/)[0];
    if (!n || ORG_PREFIX.test(n) || ORG_WORD.test(n)) return '';
    return n.split(/\s+/)[0];
  }
  function msgText(o, plain = false) {
    const c = S.cfg, t = U.totals(o);
    const b = s => (plain ? s : `*${s}*`);
    const first = greetName(o.cliente && o.cliente.nome);
    const L = [];
    L.push(`Olá${first ? ', ' + first : ''}! Segue o seu pedido na ${U.companyName(c) || 'nossa empresa'}.`);
    L.push('');
    L.push(`${b('Pedido Nº ' + U.fmtNum(o.numero))} (${U.fmtDate(o.data)})`);
    (o.itens || []).filter(validItem).forEach(it => {
      const tot = U.itemTotal(it);
      L.push(`• ${U.fmtQty(it.qtd) || '1'} x ${String(it.desc || 'Item').trim()}${tot ? ' = ' + U.money(tot) : ''}`);
    });
    L.push('');
    if (t.desc > 0) { L.push(`Subtotal: ${U.money(t.sub)}`); L.push(`Desconto: ${U.money(t.desc)}`); }
    L.push(b(`Total: ${U.money(t.total)}`));
    if (t.pago > 0) {
      L.push(`Pago: ${U.money(Math.min(t.pago, t.total))}`);
      L.push(t.rest > 0 ? b(`Falta pagar: ${U.money(t.rest)}`) : b('Pedido quitado.'));
    }
    if (o.prazo) L.push(`Prazo de entrega: ${U.fmtDate(o.prazo)}`);
    if (String(o.obs || '').trim()) { L.push(''); L.push(`Obs.: ${String(o.obs).trim()}`); }
    const pv = U.pixValue(o);
    if (o.status !== 'cancelado' && String(c.pixChave || '').trim() && pv > 0) {
      L.push('');
      L.push(`Para pagar ${U.money(pv)} com PIX:`);
      L.push(`Chave PIX (${(U.PIX_TIPOS[c.pixTipo] || '').toLowerCase()}): ${c.pixChave}${c.pixNome ? ` (${c.pixNome})` : ''}`);
      const code = pixCodeFor(o);
      if (c.incluirCopiaCola && code) {
        L.push('Ou copie o código abaixo e cole no app do banco, em Pix copia e cola:');
        L.push(code);
      }
    }
    if (String(c.mensagemFinal || '').trim()) { L.push(''); L.push(String(c.mensagemFinal).trim()); }
    return L.join('\n');
  }

  const fileBase = o => `Pedido-${U.fmtNum(o.numero)}${o.cliente && o.cliente.nome ? '-' + U.slug(o.cliente.nome) : ''}`;
  function pdfImages(o) {
    const out = {};
    if (S.cfg.logo && S.cfg.logo.src) { const j = DOC.jpegFromDataUrl(S.cfg.logo.src); if (j) out.logo = j; }
    if (o.assinatura && o.assinatura.src) { const j = DOC.jpegFromDataUrl(o.assinatura.src); if (j) out.sig = j; }
    return out;
  }
  function makePdf(o) {
    const { pages } = DOC.layout(o, S.cfg);
    const bytes = DOC.pdf(pages, { title: `Pedido ${U.fmtNum(o.numero)} - ${S.cfg.nome || ''}`, author: U.companyName(S.cfg) }, pdfImages(o));
    return new File([bytes], fileBase(o) + '.pdf', { type: 'application/pdf' });
  }
  function imgFor(src) {
    if (!src) return null;
    if (!S.imgs[src]) { const im = new Image(); im.src = src; S.imgs[src] = im; }
    return S.imgs[src];
  }
  async function docImages(o) {
    const out = {};
    for (const [k, src] of [['logo', S.cfg.logo && S.cfg.logo.src], ['sig', o.assinatura && o.assinatura.src]]) {
      if (!src) continue;
      const im = imgFor(src);
      try { await im.decode(); out[k] = im; } catch (e) { /* imagem com problema: segue sem ela */ }
    }
    return out;
  }
  function docImagesSync(o) {
    const out = {};
    for (const [k, src] of [['logo', S.cfg.logo && S.cfg.logo.src], ['sig', o.assinatura && o.assinatura.src]]) {
      const im = src && imgFor(src);
      if (im && im.complete && im.naturalWidth) out[k] = im;
    }
    return out;
  }
  function dataUrlToBytes(u) {
    const bin = atob(String(u).split(',')[1] || '');
    const a = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  function makePngs(o) {
    const { pages } = DOC.layout(o, S.cfg);
    const imgs = docImagesSync(o), sc = 2;
    return pages.map((ops, i) => {
      const cv = document.createElement('canvas');
      cv.width = Math.round(DOC.PAGE.w * sc);
      cv.height = Math.round(DOC.PAGE.h * sc);
      DOC.drawCanvas(cv.getContext('2d'), ops, sc, imgs);
      return new File([dataUrlToBytes(cv.toDataURL('image/png'))], `${fileBase(o)}${pages.length > 1 ? '-pagina-' + (i + 1) : ''}.png`, { type: 'image/png' });
    });
  }
  function downloadFile(file) {
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url;
    a.download = file.name;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }
  const canShare = files => { try { return !!(navigator.canShare && navigator.share && navigator.canShare({ files })); } catch (e) { return false; } };
  const canShareFiles = () => canShare([new File(['%PDF-1.4'], 'teste.pdf', { type: 'application/pdf' })]);
  async function copyText(s) {
    try { await navigator.clipboard.writeText(s); return true; } catch (e) { /* tenta o jeito antigo */ }
    const ta = document.createElement('textarea');
    ta.value = s;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }
  function openUrl(url) {
    const w = window.open(url, '_blank');
    if (w) { try { w.opener = null; } catch (e) { /* ok */ } } else location.href = url;
  }
  async function logEnvio(o, canal) {
    o.envios = (o.envios || []).concat({ canal, em: Date.now() }).slice(-20);
    try { await saveOrder(o); } catch (e) { /* não impede o envio */ }
    const box = $('#envios');
    if (box) box.innerHTML = enviosHtml(o);
  }

  /* ---------- avisos e janelas ---------- */
  function toast(msg, kind = '') {
    const el = $('#toast');
    el.textContent = msg;
    el.className = 'toast show ' + kind;
    clearTimeout(toast.t);
    toast.t = setTimeout(() => { el.className = 'toast'; }, 3400);
  }
  function modal({ title, body = '', actions = [], wide = false, onOpen }) {
    return new Promise(resolve => {
      const wrap = document.createElement('div');
      wrap.className = 'modal-wrap';
      wrap.innerHTML = `<div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="m-title">
        <div class="modal-head"><h2 id="m-title">${esc(title)}</h2><button type="button" class="icon-btn" data-close aria-label="Fechar">${I.x}</button></div>
        <div class="modal-body">${body}</div>
        ${actions.length ? `<div class="modal-actions">${actions.map((a, i) => `<button type="button" class="btn ${a.kind || ''}" data-i="${i}">${a.label}</button>`).join('')}</div>` : ''}
      </div>`;
      document.body.appendChild(wrap);
      const prev = document.activeElement;
      let done = false;
      const close = v => {
        if (done) return;
        done = true;
        wrap.remove();
        document.removeEventListener('keydown', onKey);
        try { prev && prev.focus && prev.focus({ preventScroll: true }); } catch (e) { /* ok */ }
        resolve(v === undefined ? null : v);
      };
      const onKey = e => { if (e.key === 'Escape') close(null); };
      document.addEventListener('keydown', onKey);
      wrap.addEventListener('mousedown', e => { if (e.target === wrap) close(null); });
      wrap.addEventListener('click', async e => {
        if (e.target.closest('[data-close]')) return close(null);
        const b = e.target.closest('[data-i]');
        if (!b) return;
        const a = actions[+b.dataset.i];
        if (a.onClick) {
          const r = await a.onClick(wrap);
          if (r === false) return;
          close(r === undefined ? a.value : r);
        } else close(a.value);
      });
      if (onOpen) onOpen(wrap, close);
      requestAnimationFrame(() => {
        wrap.classList.add('in');
        const f = wrap.querySelector('[autofocus]') || (coarse() ? null : wrap.querySelector('input:not([type=checkbox]), select, textarea')) || wrap.querySelector('.modal-actions .btn.primary') || wrap.querySelector('[data-close]');
        if (f) f.focus({ preventScroll: true });
      });
    });
  }
  const confirmBox = (title, text, ok = 'Confirmar', danger = false) =>
    modal({ title, body: `<p>${text}</p>`, actions: [{ label: 'Voltar', value: false }, { label: ok, value: true, kind: danger ? 'danger-solid' : 'primary' }] }).then(v => !!v);

  function showErr(el, msg) {
    if (!el) return toast(msg, 'err');
    clearErr(el);
    el.setAttribute('aria-invalid', 'true');
    const s = document.createElement('small');
    s.className = 'err';
    s.textContent = msg;
    (el.closest('.fld') || el.parentElement).appendChild(s);
    el.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'center' });
    el.focus({ preventScroll: true });
  }
  function clearErr(el) {
    if (!el || !el.hasAttribute('aria-invalid')) return;
    el.removeAttribute('aria-invalid');
    const s = (el.closest('.fld') || el.parentElement).querySelector('.err');
    if (s) s.remove();
  }

  /* ---------- marca no topo ---------- */
  function updateBrand() {
    const c = S.cfg;
    $('#brand-name').textContent = U.companyName(c) || 'Pedidos';
    $('#brand-mark').innerHTML = c.logo && c.logo.src ? `<img src="${esc(c.logo.src)}" alt="">` : esc(U.initials(c.nome, c.atividade));

  /* ---------- rotas ---------- */
  function route() {
    const raw = location.hash.replace(/^#\/?/, '');
    const [path, qs] = raw.split('?');
    const [name, id] = path.split('/');
    S.dirty = false;
    let r = name === 'pedidos' ? 'historico' : name === 'editar' ? 'pedido' : name;
    if (!['novo', 'pedido', 'historico', 'ajustes'].includes(r)) r = 'novo';
    marcarRota(r);
    S.folha = null;
    window.scrollTo(0, 0);
    if (r === 'novo') viewSheet(null);
    else if (r === 'pedido') viewSheet(id);
    else if (r === 'ajustes') {
      const fb = new URLSearchParams(qs || '').get('fb');
      if (fb) {
        try { const c = JSON.parse(unb64u(fb)); S.fbPrefill = `apiKey: "${c.apiKey}",\nprojectId: "${c.projectId}"`; } catch (e) { toast('Link de configuração inválido.', 'err'); }
        history.replaceState(null, '', '#/ajustes');
      }
      viewSettings();
      if (fb && S.fbPrefill) setTimeout(() => { const b = $('#nuvem-box'); if (b) b.scrollIntoView({ block: 'start' }); toast('Configuração do backup recebida. Agora entre com e-mail e senha.'); }, 60);
    } else viewList();
  }
  function marcarRota(r) {
    S.route = r;
    document.body.className = 'r-' + r;
    const cur = { novo: 'novo', pedido: 'historico', historico: 'historico', ajustes: 'ajustes' }[r];
    $$('[data-nav]').forEach(a => { if (a.dataset.nav === cur) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    const sv = $('#tb-salvar');
    if (sv) sv.hidden = !(r === 'novo' || r === 'pedido');
  }
  // O pedido novo acabou de ganhar número: a tela passa a ser a do pedido salvo (sem recarregar a folha).
  function virarPedidoSalvo(d) {
    history.replaceState(null, '', `#/pedido/${d.id}`);
    marcarRota('pedido');
  }
  function quandoSemModal(fn) {
    if (!document.querySelector('.modal-wrap')) { fn(); return; }
    const mo = new MutationObserver(() => { if (!document.querySelector('.modal-wrap')) { mo.disconnect(); fn(); } });
    mo.observe(document.body, { childList: true });

  async function navGuard(e) {
    const a = e.target.closest && e.target.closest('a[href^="#/"]');
    if (!a || !S.dirty) return;
    e.preventDefault();
    e.stopPropagation();
    if (await confirmBox('Sair sem salvar?', 'As alterações deste pedido ainda não foram salvas.', 'Sair sem salvar', true)) {
      S.dirty = false;
      go(a.getAttribute('href'));
